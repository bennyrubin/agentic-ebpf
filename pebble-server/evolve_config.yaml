        "responsibility": "Implements the UDP worker pool, synthetic latency simulation, stats logging, and eBPF-aware SO_REUSEPORT coordination.",
        "structure": {
          "Server struct": "Holds Config, loaded ebpfPolicy, logger, slice of *net.UDPConn, per-worker stats structs, and WaitGroups for workers + stats goroutine.",
