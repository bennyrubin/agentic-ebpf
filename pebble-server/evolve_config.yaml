# OpenEvolve Default Configuration
# This file contains all available configuration options with sensible defaults
# You can use this as a template for your own configuration

# General settings
max_iterations: 25                  # Maximum number of evolution iterations
checkpoint_interval: 5              # Save checkpoints every N iterations
log_level: "INFO"                     # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_dir: null                         # Custom directory for logs (default: output_dir/logs)
random_seed: 42                       # Random seed for reproducibility (null = random, 42 = default)

# Evolution settings
diff_based_evolution: true            # Use diff-based evolution (true) or full rewrites (false)
max_code_length: 10000                # Maximum allowed code length in characters

# Early stopping settings
#early_stopping_patience: null         # Stop after N iterations without improvement (null = disabled)
#convergence_threshold: 0.001          # Minimum improvement required to reset patience counter
#early_stopping_metric: "combined_score"  # Metric to track for early stopping

# LLM configuration
llm:
  # Models for evolution
  models:
    # List of available models with their weights
    - name: "gpt-5"
      weight: 1.0 
    - name: "o3-mini"
      weight: 0.0

  # Models for LLM feedback
  evaluator_models:
    # List of available models with their weights
    - name: "o3"
      weight: 0.9
    - name: "03-mini"
      weight: 0.1

  # API configuration
  api_base: "https://api.openai.com/v1"  # Base URL for API (change for non-OpenAI models)
  api_key: null                       # API key (defaults to OPENAI_API_KEY env variable)

  # Generation parameters
  temperature: 0.7                    # Temperature for generation (higher = more creative)
  top_p: 0.95                         # Top-p sampling parameter
  max_tokens: 10000                    # Maximum tokens to generate

  # Request parameters
  timeout: 200                         # Timeout for API requests in seconds
  retries: 3                          # Number of retries for failed requests
  retry_delay: 5                      # Delay between retries in seconds

# Prompt configuration
prompt:
  template_dir: null                  # Custom directory for prompt templates
  system_message: |
    SETTING:
        You are a senior eBPF performance engineer embedded in the Pebble key/value store team. You specialize in designing high-performance socket reuseport selectors that satisfy the Linux eBPF verifier while minimizing request latency under heavy UDP workloads. The socket reupose port selects which socket to send each packet to. 

    PROBLEM SPECIFICATION:
        Optimize the UDP reuseport selector in `ebpf/agent.c` so the Pebble server handles higher request rates with lower tail latency. Your edits must remain within eBPF verifier limits (bounded loops, 512-byte stack use, helper eligibility) and continue to select sockets only via the data available in `struct sk_reuseport_md`. The build system pins maps under `/sys/fs/bpf/pebble/...`; You may change the agent map if needed, but not create new ones or change the name, since that will break the loading. 
        Be creative with your approach and try to understand the problem and performance to write the next program. 
        Whichever slot you pass into bpf_sk_select_reuseport, will be the socket selected for the packet. You may only include one call to bpf_sk_select_reuseport in the program, as the others are ignored.
        You will also have acces to an expertly crafted explanation of the previous program's performance. Use this as a primary resource for constructing the next program. 

    PERFORMANCE METRICS:
        1. combined_score — primary objective (maximize). Defined as the negative trapezoidal area under the overall latency p99 curve vs. request rate after scaling rates by 10,000. Higher is better (less total latency).
        2. load_p99_curve — supporting metric. Ordered list of (rate, overall_latency_p99_ms) pairs. Prefer curves that stay low and flat as rates increase.
        3. load_p99_stddev_curve — stability metric. Standard deviation of p99 latency at each rate. Lower values indicate more predictable performance.
        4. compile & load — hard constraints. Both must be 1 (program builds and loads successfully).
        5. run_success — must remain 1 (experiment completed without fatal errors).

    TECHNICAL CONTEXT & REQUIREMENTS:
        - The evaluator rewrites `ebpf/agent.c`, runs `go generate` to produce `internal/ebpfutil/agentselector_bpf.*`, and executes `run_exp.py` (or its docker dispatcher) with sudo.
        - The server exposes up to 128 reuseport sockets; all loops touching socket indices must stay bounded and verifier-friendly.
        - Keep code deterministic aside from verifier-approved randomness; no floating point, no unbounded recursion, no forbidden helpers.
        - Maintain GPL license string and map definitions; changing pin paths or map types will break the runtime.
        - You must include an in depth comment at the top of every file explaining your approach and the program and why you think it will improve performance. 

    Deliver candidate programs that maximize combined_score while preserving correctness and verifier compliance.
  eval_agent_prompt: |
    You are an expert evaluator of high‑performance networking systems, specializing in Linux UDP servers that use SO_REUSEPORT with an eBPF sk_reuseport program to steer requests to worker sockets, backed by a database. There are quick point GET requests and longer scans. Your goal is to explain how the system actually behaved and why, using the provided artifacts: the current eBPF program, run metrics, and the previous program and its results. You will also have access to the entire codebase (in the current working directory). Included below is a codebase summary; read all the files and code you think necessarry to understand, but don't excessively read files and waste tokens. Use the prior run as a baseline for context, but do not limit analysis to simply deltas—surface deeper insights and analysis across all layers including the network, userspace, and database layers.
    bpf_sk_select_reuseport selects which socket to send the request to. Assume this cannot fail and will always return 0.

    **Method & guardrails**

    - Be precise but efficient and quick. Do not take too long running or waste tokens.
    - Look carefully at the provided codebase summary and performance metrics and client and server logs. First, summarize them for yourself to make sure you understand.
    - **Evidence only. No leaps.** If a claim is not supported by the artifacts, mark it **uncertain** and state exactly what’s missing. Be explicit about assumptions you cannot verify.
    - You will be given all of the performance numbers and server/client logs to help you understand the behavior of the system. You should use these as well as the codebase itself to confirm your hypothesis. 
    - **You may only read codebase files in the following allowed directories and files: internal/, cmd/, scripts/, workload/, run_exp.py, run.sh
    - **Understand the codebase well and find specific lines and functions to support claims but don’t waste tokens (you don't need line numbers for the provided code).**
    - **Attribution.** Tie each observed effect to a plausible component (e.g. BPF routing, socket queues, userspace, DB) with specific evidence. If multiple hypotheses exist, list them with confidence levels.
    - Assume that there are no failures or stale or empty entries in the reuseport map and that the application correctly supplies all the sockets.  

    **Output format (exactly three sections, concise but thorough):**

    1. **Behavior & performance (precise). Be concise.** 
        - Explain the performance of the system and why it got the performance metrics it did. Compare it to the baseline, when helpful, but surface deeper insights. Include Short, evidence‑backed explanations of *why*
        - Include a confidence note (e.g., **High/Medium/Low**)
    2. **Did the behavior achieve the program’s intent? Why or why not?**
        - Briefly restate the intent inferred from the eBPF program policy (e.g., “maintain per‑core locality/fairness”, “evening distribute requests among workers”).
        - Judge success/failure of the behavior of this system to achieve the program intent, citing the specific metrics and evidence supporting each judgement.

    Below is included all of the relevant information.

  evaluator_system_message: "You are an expert code reviewer."

  # Number of examples to include in the prompt
  num_top_programs: 3                 # Number of top-performing programs to include
  num_diverse_programs: 2             # Number of diverse programs to include

  # Template stochasticity
  use_template_stochasticity: true    # Use random variations in templates for diversity
  template_variations:                # Different phrasings for parts of the template
    improvement_suggestion:
      - "Here's how we could improve this code:"
      - "I suggest the following improvements:"
      - "We can enhance this code by:"

  # Artifact rendering
  include_artifacts: true             # Include execution outputs/errors in prompt
  max_artifact_bytes: 20480           # Maximum artifact size in bytes (20KB default)
  #artifact_security_filter: true      # Apply security filtering to artifacts

  # Feature extraction and program labeling thresholds
  # These control how the LLM perceives and categorizes programs
  # suggest_simplification_after_chars: 500     # Suggest simplifying if program exceeds this many characters
  # include_changes_under_chars: 100           # Include change descriptions in features if under this length  
  # concise_implementation_max_lines: 10        # Label as "concise" if program has this many lines or fewer
  # comprehensive_implementation_min_lines: 50  # Label as "comprehensive" if program has this many lines or more

  # Note: meta-prompting features are not yet implemented

# Database configuration
database:
  # General settings
  db_path: /home/benny/evolve_agent/agentic-ebpf/pebble-server/openevolve_output/db       # Path to persist database (null = in-memory only)
  in_memory: true                     # Keep database in memory for faster access
  log_prompts: true                  # If true, log all prompts and responses into the database

  # Evolutionary parameters
  population_size: 100               # Maximum number of programs to keep in memory
  archive_size: 50                   # Size of elite archive
  num_islands: 1                      # Number of islands for island model (separate populations)

  # Island-based evolution parameters
  # Islands provide diversity by maintaining separate populations that evolve independently.
  # Migration periodically shares the best solutions between adjacent islands.
  migration_interval: 20              # Migrate between islands every N generations
  migration_rate: 0.1                 # Fraction of top programs to migrate (0.1 = 10%)

  # Selection parameters
  elite_selection_ratio: 0.1          # Ratio of elite programs to select
  exploration_ratio: 0.0              # Ratio of exploration vs exploitation
  exploitation_ratio: 1.0             # Ratio of exploitation vs random selection
  # Note: diversity_metric is fixed to "edit_distance" (feature_based not implemented)

  # Feature map dimensions for MAP-Elites
  # Default if not specified: ["complexity", "diversity"]
  # 
  # Built-in features (always available, computed by OpenEvolve):
  #   - "complexity": Code length
  #   - "diversity": Code structure diversity
  #
  # You can mix built-in features with custom metrics from your evaluator:
  feature_dimensions:                 # Dimensions for MAP-Elites feature map (for diversity, NOT fitness)
    - "complexity"                    # Code length (built-in)
    - "diversity"                     # Code diversity (built-in)
  # Example with custom features:
  # feature_dimensions:
  #   - "performance"                 # Must be returned by your evaluator
  #   - "correctness"                 # Must be returned by your evaluator
  #   - "memory_efficiency"           # Must be returned by your evaluator
  
  # Number of bins per dimension
  # Can be a single integer (same for all dimensions) or a dict
  feature_bins: 10                    # Number of bins per dimension
  # Example of per-dimension configuration:
  # feature_bins:
  #   complexity: 10                  # 10 bins for complexity
  #   diversity: 15                   # 15 bins for diversity
  #   performance: 20                 # 20 bins for custom metric
  
  diversity_reference_size: 20        # Size of reference set for diversity calculation

# Evaluator configuration
evaluator:
  # Fitness calculation: Uses 'combined_score' if available, otherwise averages
  # all metrics EXCEPT those listed in database.feature_dimensions
  
  # General settings
  timeout: 2000                        # Maximum evaluation time in seconds
  max_retries: 1                      # Maximum number of retries for evaluation

  # Note: resource limits (memory_limit_mb, cpu_limit) are not yet implemented

  # Evaluation strategies
  cascade_evaluation: false            # Use cascade evaluation to filter bad solutions early
  cascade_thresholds:                 # Thresholds for advancing to next evaluation stage
    - 0.5                             # First stage threshold
    - 0.75                            # Second stage threshold
    - 0.9                             # Third stage threshold

  # Parallel evaluation
  parallel_evaluations: 1             # Number of parallel evaluations
  # Note: distributed evaluation is not yet implemented

  # LLM-based feedback (experimental)
  use_llm_feedback: false             # Use LLM to evaluate code quality
  llm_feedback_weight: 0.1            # Weight for LLM feedback in final score

# Evolution trace configuration
# Logs detailed traces of program evolution for RL training and analysis
evolution_trace:
  enabled: true                      # Enable evolution trace logging
  format: 'jsonl'                     # Output format: 'jsonl', 'json', or 'hdf5'
  include_code: true                 # Include full program code in traces
  include_prompts: true               # Include prompts and LLM responses
  output_path: null                   # Path for trace output (defaults to output_dir/evolution_trace.{format})
  buffer_size: 1                     # Number of traces to buffer before writing
  compress: false                     # Compress output file (jsonl only)

code_summary: |
    {
      "overview": {
        "scope": "Synthetic UDP storage emulator with eBPF-aware load balancing (pebble-server) — only internal/, cmd/, scripts/, workload/, run.sh, run_exp.py included.",
        "languages": [
          "Go 1.22 (internal/*, cmd/*)",
          "Bash (run.sh, scripts/*, workload/run_client.sh)",
          "Python 3 (run_exp.py, scripts/dispatch_docker_experiments.py)"
        ],
        "artifact_conventions": {
          "logs": "logs/<role> (server|client)",
          "results": "results/run-* (per run.sh invocation) containing experiment.json + workload_summary.json",
          "eBPF_pin_paths": "/sys/fs/bpf/pebble/<RUN_ID> (set by run.sh before launching the Go server)"
        }
      },
      "execution_flow": [
        {
          "order": 1,
          "name": "Experiment orchestration",
          "artefact": "run_exp.py",
          "description": "Thin experiment wrapper: either shells into run.sh for fresh sweeps or parses dispatch manifests to summarise existing runs, then emits summary.json and optional matplotlib plots.",
          "key_steps": [
            "parse_args (run_exp.py:29-95) exposes policies/rates/threads plus manifest + plotting toggles.",
            "invoke_run_sh/load_manifest_runs gather `run-*` directories, extract metrics from workload_summary.json, and pass records into write_experiment_summary/generate_plots."
          ]
        },
        {
          "order": 2,
          "name": "Per-run workflow",
          "artefact": "run.sh",
          "description": "Convenience script that (a) slices NUMA CPUs between server/client, (b) rebuilds eBPF assets, (c) restarts the Go server for each workload iteration, (d) runs cmd/workload_client under taskset, and (e) aggregates iteration outputs into workload_summary.json.",
          "key_steps": [
            "resolve_cpu_pool/join_by (run.sh:27-118) derive SERVER_CPUSET + CLIENT_CPUSET from CPUSET_POOL or NUMA node 0.",
            "Calls scripts/build_ebpf.sh + scripts/cleanup_ebpf_maps.sh, then orchestrates server via scripts/launch_server.sh and client via run_client wrapper.",
            "Embedded Python (run.sh:415-452) regex-parses client logs into workload_summary.json; final line prints the run directory for downstream tooling."
          ]
        },
        {
          "order": 3,
          "name": "Runtime services",
          "artefacts": [
            "cmd/pebble_server/main.go:21-91 -> internal/server/*",
            "cmd/workload_client/main.go:67-450"
          ],
          "description": "Go binaries that run.sh controls. The server exposes UDP reuseport workers with synthetic latency and optional eBPF selection, while the workload client generates GET/SCAN traffic with latency tracking.",
          "key_steps": [
            "cmd/pebble_server wires CLI flags, creates log/results dirs, enables pprof/profiling, builds server.Config and runs server.New/Run under signal-aware context.",
            "internal/server.Server.New/Run (server.go:104-181) validate config, load eBPF policy, clear pinned maps, then open reuseport sockets, attach eBPF, and spawn workers; handleRequest (server.go:268-325) executes busy-wait delays and records stats.",
            "cmd/workload_client main loop (main.go:67-347) builds UDP payloads, enforces rate limit via golang.org/x/time/rate, tags each request with reqID (makeReqID/parseReqID, main.go:308-337) so receive goroutines can compute latency and feed the aggregator (latencyAggregator, main.go:40-66).",
            "Server stats logger (server.go:328-395) emits per-worker and aggregate lines that scripts/monitoring can scrape."
          ],
          "downstream": [
            "Server relies on internal/server/ebpf.go + generated internal/ebpfutil bindings.",
            "Client output is parsed by run.sh’s Python aggregator; logs feed human debugging."
          ]
        },
        {
          "order": 4,
          "name": "Support scripts",
          "artefacts": [
            "scripts/build_ebpf.sh:1-34",
            "scripts/cleanup_ebpf_maps.sh:1-25",
            "scripts/launch_server.sh:1-96",
            "scripts/dispatch_docker_experiments.py:1-654",
            "workload/run_client.sh:1-62"
          ],
          "description": "Reusable helpers for building eBPF assets, cleaning pinned maps, launching the server standalone, dispatching dockerized experiments, and invoking the workload client without run.sh.",
          "key_steps": [
            "build_ebpf.sh enforces clang availability, sets BPF_CLANG/BPF_CFLAGS, adds arch include paths, then runs `go generate ./internal/ebpfutil`.",
            "cleanup_ebpf_maps.sh deletes global pinned maps unless run-specific BPF_PIN_PATH is set, preventing fd leaks between runs.",
            "launch_server.sh builds cmd/pebble_server (unless disabled), enforces single instance via PID file, applies taskset when SERVER_CPUSET is exported, and records PID for run.sh.",
            "dispatch_docker_experiments.py reads NUMA topology (read_numa_cpu_map, line 106), assigns per-container CPU slices, constructs docker run commands (build_jobs, line 149), streams logs asynchronously (run_job, line 221), and optionally post-processes with run_exp.py.",
            "workload/run_client.sh is a thin CLI around `go run ./cmd/workload_client` for ad-hoc manual traffic."
          ]
        }
      ],
      "modules": {
        "run_exp.py": {
          "high_level_role": "Top-level wrapper to sweep policies/rates and collect workload_summary.json files into one experiment summary.",
          "key_points": [
            "parse_args exposes knobs for policies/rates, send-workers, duration, server/client cores, plotting, and manifest reuse.",
            "invoke_run_sh executes run.sh and captures the run directory; load_manifest_runs + link_run_directories reuse docker-dispatched runs.",
            "generate_overall_plot / generate_get_scan_plot optionally render PNGs (skip with --skip-plot)."
          ]
        },
        "run.sh": {
          "high_level_role": "Automation glue that sets up CPU pinning, rebuilds eBPF assets, runs cmd/pebble_server + cmd/workload_client for N iterations, and emits workload_summary.json.",
          "key_points": [
            "resolve_cpu_pool + join_by compute SERVER_CPUSET/CLIENT_CPUSET and export them for both taskset prefixes.",
            "start_server/stop_server wrap scripts/launch_server.sh and enforce clean PID files; run_client pins workload_client under CLIENT_CPUSET.",
            "Embedded Python generates workload_summary.json from logs/workload_iteration_*.txt, which run_exp.py later ingests."
          ]
        },
        "cmd/pebble_server": {
          "high_level_role": "Go binary that instantiates internal/server.Server based on CLI flags and keeps it running with profiling enabled.",
          "key_sections": [
            {
              "name": "Flag wiring & filesystem setup",
              "lines": "cmd/pebble_server/main.go:21-52",
              "details": [
                "Defines flags for listen addr, workers, policy, max scan, log/results dirs, timeouts, and synthetic delays; ensures directories exist before logging.",
                "Creates/opens <log-dir>/server.log (append mode) and builds a microsecond-resolution logger."
              ]
            },
            {
              "name": "Profiling + server lifecycle",
              "lines": "cmd/pebble_server/main.go:52-92",
              "details": [
                "Enables block/mutex profiling (runtime.SetBlockProfileRate/SetMutexProfileFraction) and hosts net/http/pprof on 127.0.0.1:6060.",
                "Builds server.Config, calls server.New (fails fast on invalid config or eBPF load issues), installs SIGINT/SIGTERM handler, logs startup configuration, and blocks on srv.Run(ctx)."
              ]
            }
          ],
          "cross_dependencies": [
            "Uses internal/server (Config, Server, eBPF loader).",
            "scripts/launch_server.sh expects -log-dir and -results-dir to exist for log collation."
          ]
        },
        "cmd/workload_client": {
          "high_level_role": "Open-loop UDP workload generator with reqID-based latency measurement and throughput reporting.",
          "key_sections": [
            {
              "name": "Latency data structures",
              "lines": "cmd/workload_client/main.go:32-66",
              "details": [
                "latencyRecord and latencyAggregator store per-request latencies, split into overall/GET/SCAN slices; aggregator.totalRecv reports sample counts."
              ]
            },
            {
              "name": "Main workload loop",
              "lines": "cmd/workload_client/main.go:67-307",
              "details": [
                "Parses flags (server, duration, rate, get-frac, scan-limit, key prefix/space, log path, send workers), validates arguments, seeds RNGs per worker.",
                "Creates a shared rate limiter (golang.org/x/time/rate), spawns send goroutines that build payloads (buildPayload, line 363) and assign reqIDs (makeReqID, line 308).",
                "Spawns recv goroutines with deadlines that parse responses, extract reqIDs (parseReqID, line 320), compute latency, and push records into latencyCh.",
                "Aggregator + monitor goroutines track outstanding requests and total received counts."
              ]
            },
            {
              "name": "Statistics reporting",
              "lines": "cmd/workload_client/main.go:308-451",
              "details": [
                "Helper functions (makeReqID/parseReqID/writeHex/parseHex) ensure both sides share the encoding.",
                "percentile/average/reportLatencyStats (lines 376-451) sort copies of the latency slices, compute p50/p90/p99/avg, and print textual summaries that run.sh’s regex parser expects."
              ]
            }
          ],
          "cross_dependencies": [
            "run.sh’s run_client wrapper invokes this with -log pointing at logs/client.log; workload/run_client.sh uses go run for convenience.",
            "Server assumes GET payload format 'GET key [reqID]' and SCAN 'SCAN start limit [reqID]' as implemented here."
          ]
        },
        "internal/server": {
          "high_level_role": "Core server runtime, including configuration validation, UDP worker pool, request parser, stats logging, and eBPF policy integration.",
          "key_files": [
            {
              "path": "internal/server/config.go",
              "summary": "Config struct + Validate clamp runtime knobs to sane defaults so CLI/script errors don’t crash the server.",
              "key_functions": [
                {
                  "name": "Config.Validate",
                  "lines": "internal/server/config.go:19-43",
                  "details": [
                    "Sets ListenAddr default (127.0.0.1:9000), ensures at least one worker, caps MaxScanKeys >= 1 (default 100k), enforces non-zero timeouts/delays.",
                    "Called by server.New before any socket/eBPF work, giving run.sh freedom to pass zero/negative placeholder values."
                  ]
                }
              ]
            },
            {
              "path": "internal/server/server.go",
              "summary": "Implements the Server struct, worker lifecycle, UDP handler, and stats reporter.",
              "key_functions": [
                {
                  "name": "Server.New",
                  "lines": "internal/server/server.go:104-131",
                  "details": [
                    "Validates config, builds default logger when nil, loads eBPF policy via loadEBPF, clears pinned target map when a program is present, and preallocates workerStats."
                  ]
                },
                {
                  "name": "Server.Run",
                  "lines": "internal/server/server.go:144-182",
                  "details": [
                    "Resets stats, spawns stats logger, iterates workers to open UDP sockets (openWorker, lines 184-230), optionally attaches the eBPF program to worker 0, records socket fds into the pinned map, launches spawnWorker goroutines, and blocks until ctx cancellation."
                  ]
                },
                {
                  "name": "openWorker + spawnWorker",
                  "lines": "internal/server/server.go:184-266",
                  "details": [
                    "openWorker sets SO_REUSEADDR/SO_REUSEPORT via net.ListenConfig.Control and attaches the eBPF program once; returns both UDPConn and fd for map updates.",
                    "spawnWorker loops on ReadFromUDP, handles ctx cancellation/ErrClosed gracefully, and logs transient read/write errors."
                  ]
                },
                {
                  "name": "handleRequest",
                  "lines": "internal/server/server.go:268-325",
                  "details": [
                    "Parses payloads via parseRequest, extracts optional reqID tokens, enforces SCAN limit <= MaxScanKeys, executes accurate busy-wait delays for GET/SCAN, records latencies per worker, and formats responses (formatResponse, lines 397-407)."
                  ]
                },
                {
                  "name": "startStatsLogger",
                  "lines": "internal/server/server.go:328-395",
                  "details": [
                    "Every second, snapshots worker metrics, logs per-worker averages when there was traffic, accumulates totals, and emits aggregate '[perf] interval=1s ...' lines consumed by observability tooling."
                  ]
                }
              ]
            },
            {
              "path": "internal/server/handler.go",
              "summary": "Robust ASCII parser for GET/SCAN requests.",
              "key_functions": [
                {
                  "name": "parseRequest",
                  "lines": "internal/server/handler.go:14-45",
                  "details": [
                    "Trims whitespace, splits fields, enforces argument counts for GET/SCAN, and lowercases manually via equalFoldASCII (lines 48-66) to avoid allocations in hot paths."
                  ]
                }
              ]
            },
            {
              "path": "internal/server/ebpf.go",
              "summary": "Loads eBPF selector programs, manages pin directories, and updates reuseport target maps.",
              "key_functions": [
                {
                  "name": "loadEBPF + load* variants",
                  "lines": "internal/server/ebpf.go:50-218",
                  "details": [
                    "Switches on policy names, ensures memlock rlimit is raised, creates pin directories, loads generated ebpfutil objects, seeds state maps (e.g., PebbleRrState.Active = workers), and returns ebpfPolicy handles with Close hooks.",
                    "Validates non-negative worker counts for agent/scan_split/hash policies."
                  ]
                },
                {
                  "name": "attach/updateTargetsMap/clearTargets",
                  "lines": "internal/server/ebpf.go:220-268",
                  "details": [
                    "attach(fd) wraps SO_ATTACH_REUSEPORT_EBPF, updateTargetsMap writes worker fd values into the pinned pebble_udp_targets map so eBPF programs can redirect flows, clearTargets removes stale slots at startup (skips when map not present)."
                  ]
                }
              ]
            }
          ],
          "cross_dependencies": [
            "Relies on generated internal/ebpfutil bindings (bpf2go outputs).",
            "Server expects run.sh or scripts/launch_server.sh to set BPF_PIN_BASE/PATH correctly."
          ]
        },
        "internal/ebpfutil": {
          "high_level_role": "Generated Go bindings/objects for each eBPF selector program; rebuild with `go generate ./internal/ebpfutil`.",
          "key_files": [
            {
              "path": "internal/ebpfutil/bpf_assets.go",
              "summary": "Contains go:generate directives pointing at ../../ebpf/*.c programs with bpf2go, ensuring clang builds BPF object files.",
              "key_points": [
                "Generated *_bpf.go files (e.g., agentselector_bpf.go) expose typed structs (AgentSelectorObjects, Maps, Programs) and embed corresponding *.o bytecode, which internal/server/ebpf.go loads with pinned map support."
              ]
            }
          ],
          "cross_dependencies": [
            "scripts/build_ebpf.sh must run before any policy other than 'default' is used, otherwise loadEBPF will fail due to missing object files."
          ]
        },
        "scripts": {
          "build_ebpf.sh": {
