          "latencyAggregator (cmd/workload_client/main.go:35-65) stores three slices (overall/get/scan). After the run, `reportLatencyStats` (cmd/workload_client/main.go:423-434) prints p50/p90/p99/avg by sorting copies of the collected slices, while throughput is derived from (responses / duration)."
        ],
        "failure_handling": [
