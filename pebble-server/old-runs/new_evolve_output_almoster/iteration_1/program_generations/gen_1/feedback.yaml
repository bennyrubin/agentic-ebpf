    \ per\u2011packet diversity\n\nIf Change 1 still yields high p99 at low rates, try giving packets a *mild* affinity to\
    \ the 4\u2011tuple while keeping the per\u2011packet diversity from the payload:\n\n- Example tweak:\n\n```c\n// h seeded\
    \ as in Change 1\nh = h * 2654435761u + (reuse->hash ^ 0x9e3779b9u);\n__u32 slot = h % active;\n```\n\nThis:\n\n- Keeps\
    \ packets from the same flow and similar payloads from being sprayed *completely* randomly each time, which may reduce\
