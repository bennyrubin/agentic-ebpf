    \ and at least one worker remains idle in each run, indicating that the bottleneck is uneven worker utilization rather\
    \ than total CPU capacity.\", \"Each wo\n- Parent eval summary/hypothesis/score: The system is a UDP storage emulator\
    \ with 6 SO_REUSEPORT workers and an eBPF sk_reuseport selector running the \"agent\" policy. The eBPF program reads an\
    \ `agent_state.active` field that is set equal to the configured worker count (6) and computes `start = reuse->hash %\
    \ active`, then calls `bpf_sk_select_reuseport` on that slot. Because `reuse->hash` is stable per 4\u2011tuple, this implements\
    \ per-flow consistent hashing of UDP flows onto worker indices 0\u20135. The server opens one UDP socket per worker, attaches\
    \ the eBPF program once (on worker 0), and runs exactly one goroutine per socket calling `ReadFromUDP` and then `handleRequest`\
    \ synchronously (no intra-worker parallelism). `handleRequest` simulates 10\xB5s GETs and 2ms SCANs via busy-wait, and\
