    \ the worker-level server logs show only 4\u20135 of the 6 workers handling traffic and, crucially, that each active worker\u2019\
    s GET count per second is very close to an integer multiple of a common \"base\" value, with the sum of those integer\
    \ factors consistently \u22487. For example, in the 50k run: worker GETs\u2248[7k,14k,7k,21k] summing to \u224849k (base\u2248\
