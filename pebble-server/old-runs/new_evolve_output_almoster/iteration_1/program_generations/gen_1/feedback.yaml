    \ each pinned by the eBPF hash to a single server worker. With 7 flows hashed into 6 buckets, some workers receive two\
    \ flows, some one, and some zero; which workers are idle changes across runs, but at any given run at least one worker\
    \ sees no traffic. At offered loads up to 80k req/s, these 4\u20135 active workers have enough spare CPU that queues remain\
    \ short: the client reports sent\u2248recv, small outstanding counts, no missing responses, and p99 latency of just a\
    \ few microseconds above the synthetic 10\xB5s GET delay. Once the offered rate reaches 100k and then 140k req/s, the\
    \ total server throughput plateaus around 90\u201395k req/s regardless of further load increases, while the client\u2019\
    s outstanding request count explodes (to tens or hundreds of thousands) and, at 140k, ~222k responses never arrive. The\
    \ eBPF selector does not consider current load or request type, so new packets keep being steered to the same small set\
