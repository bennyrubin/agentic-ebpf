    \ to choose a worker. That\n * removed per-flow pinning, but introduced extra randomness and overhead\n * in the hot path,\
    \ and empirically led to millisecond-scale p99 latency\n * even at moderate load.\n *\n * Goals for this revision:\n *\n\
    \ *   - Still decouple selection from the number of client flows so that all\n *     reuseport workers are exercised even\
    \ when there are only a few UDP\n *     flows.\n *   - Avoid concentrating traffic on a small subset of workers.\n * \
    \  - Keep the selector stateless and O(1) per packet, with no loops.\n *   - Remove explicit PRNG usage and rely only\
    \ on deterministic data\n *     derived from the packet itself plus reuse->hash.\n *\n * Approach:\n * ---------\n * 1.\
    \ The Go server writes the current worker count into pebble_agent_state\n *    (field `active`). We clamp this to [1,\
    \ 128] to stay within the\n *    sockarray bounds.\n *\n * 2. For each packet, we take the kernel-provided 4\u2011tuple\
    \ hash\n *    (reuse->hash) and mix it with a small, deterministic hash of the\n *    payload, specifically the first\
    \ four bytes of the packet (if present).\n *    In this workload those bytes include part of the textual reqID, which\n\
    \ *    changes on every request even for a single UDP flow.\n *\n *    - If the payload length is < 4, we fall back to\
    \ reuse->hash alone.\n *    - The payload hash is computed with a few byte loads and a simple\n *      multiplicative\
    \ mix (FNV-style), no loops.\n *\n * 3. We map the mixed 32-bit value into [0, active) with a modulo and call\n *    bpf_sk_select_reuseport\
    \ exactly once.\n *\n * This yields:\n *\n *   - Per-packet variation in the selected worker driven by the changing\n\
    \ *     reqID, so even a single client flow will spread requests across all\n *     workers over time.\n *   - Deterministic\
    \ behavior (no PRNG helper) and minimal arithmetic,\n *     staying well within verifier limits.\n *   - Better utilization\
    \ of all workers and reduced chance of persistent\n *     hotspots, while preserving the server\u2019s stateless semantics:\
    \ any\n *     worker can safely handle any request because correctness is keyed by\n *     reqID in the payload.\n */\n\
    \nstruct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n   \
    \ __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md\
