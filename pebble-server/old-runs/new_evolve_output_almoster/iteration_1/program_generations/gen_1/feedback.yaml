    \n- The code change does achieve the *structural* goal of breaking per\u2011flow pinning:\n  - Selection is now per\u2011\
    packet and uses `bpf_get_prandom_u32() ^ reuse->hash`, so a single 4\u2011tuple will spray packets across all `active`\
    \ workers instead of being pinned to one.\n  - This should, in principle, eliminate dependence on the small number of\
    \ client flows and ensure all reuseport sockets see traffic.\n- However, it **badly misses the performance goals**:\n\
    \  - At 50k req/s, `GET p99 \u2248 2.40 ms`, `overall p99 \u2248 2.43 ms`, `SCAN p99 \u2248 4.45 ms`.\n  - These are roughly\
    \ two orders of magnitude worse than the desired \u201Ca few \xB5s above 10\xB5s\u201D and significantly worse than the\
    \ earlier agent selector at the same rates.\n  - p99 continues to grow with offered load and reaches **16.36 ms** at 140k,\
    \ which is *worse* than the prior plateau (~5 ms) you described.\n- So: the current selector fixes the \u201Cpinned flows\
    \ / idle workers\u201D issue in principle, but **regresses latency massively** and does not yet deliver the intended \u201C\
    spread rare SCANs and shrink queues\u201D behavior in practice.\n\n**2. Key behavior from this run**\n\nFrom the summary\
    \ you provided:\n\n- For all tested rates, latency is dominated by milliseconds\u2011scale delays:\n  - 50k: overall p99\
    \ 2.43 ms, GET p99 2.40 ms, SCAN p99 4.45 ms.\n  - 60k: overall p99 2.78 ms, GET p99 2.74 ms, SCAN p99 4.80 ms.\n  - 80k:\
    \ overall p99 3.55 ms, GET p99 3.50 ms, SCAN p99 5.57 ms.\n  - 100k: overall p99 4.72 ms, GET p99 4.66 ms, SCAN p99 6.91\
    \ ms.\n  - 140k: overall p99 16.36 ms (GET/SCAN not fully listed but clearly very high).\n- GET p99 is already ~2.4 ms\
    \ at 50k, i.e., GETs are frequently sitting behind at least one 2 ms SCAN at the worker, which is *far* worse than the\
    \ prior behavior at the same rate.\n- Combined score went from positive (~9) on the previous agent to **-59.3** here,\
    \ which is consistent with this large p99 regression.\n\nTaken together: per\u2011packet random routing is **spreading\
    \ SCANs around**, but it\u2019s also causing enough head\u2011of\u2011line blocking and/or other overhead that GETs are\
    \ nearly always delayed by ms\u2011scale work, even at moderate load.\n\n---\n\n**3. Concrete next changes to try**\n\n\
    Within the EVOLVE\u2011BLOCK, I\u2019d try these, in this order:\n\n### Change 1: Replace `bpf_get_prandom_u32` with a\
    \ **deterministic per\u2011packet payload hash**\n\nGoal: still decouple from the number of flows, but without calling\
    \ the PRNG on every packet and without adding extra jitter that may be producing pathological queueing.\n\nInstead of:\n\
    \n```c\n__u32 rnd = bpf_get_prandom_u32();\n__u32 mixed = reuse->hash ^ rnd;\nmixed = mixed * 1103515245u + 12345u;\n\
    __u32 slot = mixed % active;\n```\n\nCompute a simple, deterministic hash from the UDP payload and mix it with `reuse->hash`,\
    \ for example:\n\n- Use the **last 4 bytes** of the payload as a cheap \u201Cper\u2011request\u201D token (this will include\
    \ part of the reqID, which changes every request even on a single flow).\n- Guard with bounds checks using `reuse->data`\
    \ / `reuse->data_end`.\n- Mix into a 32\u2011bit hash and take `% active`.\n\nSketch:\n\n```c\nvoid *data = (void *)(long)reuse->data;\n\
    void *data_end = (void *)(long)reuse->data_end;\n__u32 h = reuse->hash;      // fallback base\n\n__u64 len = (__u64)((char\
    \ *)data_end - (char *)data);\nif (len >= 4) {\n    unsigned char *tail = (unsigned char *)data_end - 4;\n    __u32 t\
    \ = ((__u32)tail[0] << 24) |\n              ((__u32)tail[1] << 16) |\n              ((__u32)tail[2] << 8)  |\n       \
    \       ((__u32)tail[3]);\n    h ^= t;\n    h = h * 16777619u + 2166136261u;  // cheap mix (no loops)\n}\n\n__u32 slot\
    \ = h % active;\nbpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n```\n\nWhy this helps:\n\n- Still **stateless**\
    \ and **O(1)** per packet.\n- Even with a single UDP flow, the changing reqID at the end of the payload ensures `slot`\
    \ varies across all workers.\n- Removes `bpf_get_prandom_u32()` from the hot path and makes selection deterministic for\
    \ a given packet, which may reduce pathological interactions and overhead.\n\n### Change 2: Verify all workers are actually\
    \ used and that service times are unchanged\n\nBefore iterating further on the selector logic, validate the basics:\n\n\
