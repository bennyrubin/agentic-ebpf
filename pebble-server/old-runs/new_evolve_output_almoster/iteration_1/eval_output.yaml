      answer:
        answer: "Each send worker makes an independent GET vs SCAN decision on every request using its own RNG, so the get_frac\
          \ (e.g., 0.99) is applied per-request and per-worker. For each request, the worker draws rng.Float64(); if the result\
          \ is <= get_frac it issues a GET, otherwise a SCAN. Since all workers use the same get_frac and draw independently\
          \ for every request, every client flow will, on average, see roughly the same GET/SCAN mix, with normal per-worker\
          \ randomness.\n\nImplementation details:\n- Each worker goroutine has its own rand.Rand instance, seeded with time.Now().UnixNano()\
          \ plus the worker index (so workers don\u2019t share RNG state).\n- Inside the worker\u2019s send loop, it calls\
          \ rng.Float64() for each request and compares the value to *getFrac. This sets isGet/reqType and drives payload\
          \ construction and counters.\n- Counters for sentTotal, sentGet, and sentScan are updated per request based on that\
          \ isGet decision, and the final totals and GET/SCAN counts are reported at the end."
