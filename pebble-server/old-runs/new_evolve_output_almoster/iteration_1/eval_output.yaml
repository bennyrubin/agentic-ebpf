    Summary: "Synthetic UDP storage server with 6 SO_REUSEPORT workers and an eBPF sk_reuseport selector (policy=agent). eBPF\
      \ program hashes reuse->hash modulo an `active` count and calls bpf_sk_select_reuseport; no request-type awareness.\
      \ Workload client sends 99% GET, 1% SCAN, open-loop at rates 50k\u2013140k. Logs show: at 50k\u201380k, p99 latency\
      \ tiny, no drops, but only a subset of workers handle traffic, with per-worker QPS in clear integer multiples of a base\
      \ value; at 100k\u2013140k, total server QPS plateaus around ~95k, per-worker QPS still in integer multiples, outstanding\
      \ requests and latency explode, and at 140k many responses are dropped. This strongly suggests per-flow hashing from\
      \ a small, fixed number of client UDP sockets to a subset of server workers, leading to early saturation of those workers\
      \ while others are idle."
    hypothesis:
      text: "The agent eBPF selector is effectively a static per-flow hash over `reuse->hash` with `slot = hash % active`,\
        \ and the workload client uses a small, fixed number of UDP source sockets (one per send worker). Each client socket\u2019\
        s 4\u2011tuple hashes to a single server worker, so with 7 send workers and 6 server workers, only 4\u20135 server\
        \ workers actually receive traffic (some workers get multiple client flows, others none). This explains the per-worker\
        \ QPS being discrete multiples of a base value and some workers seeing zero traffic. As the offered rate rises, these\
        \ few \u201Chot\u201D workers saturate CPU and their per-socket UDP receive queues, while the idle workers remain\
        \ underused. Because each hot worker processes both GETs and 2 ms SCANs in a single-threaded loop, SCANs induce long\
        \ per-worker queues; at 100k and especially 140k, this queueing drives GET p99 latency into the 100s of microseconds\
        \ and milliseconds and eventually causes packet drops, even though the aggregate rate is below what six evenly loaded\
        \ workers could handle."
      score: 8
