    question_answers:
    - question: |-
        In cmd/workload_client/main.go, for these experiments, how many send workers are created by default, and does each send worker own its own net.UDPConn with its own local port, or do they share a single UDPConn/socket?
      answer:
        answer: "By default, one send worker is created because the `-send-workers` flag defaults to 1, and if the value is\
          \ <= 0 it is reset to 1. Each send worker creates and owns its own `net.UDPConn` by calling `net.DialUDP` inside\
          \ the per\u2011worker loop, so each worker uses a separate UDP socket (and thus its own local port), rather than\
          \ sharing a single `UDPConn`."
        code_snippets:
        - path: |-
            cmd/workload_client/main.go
          snippet: "var (\n\t\tserverAddr  = flag.String(\"server\", \"127.0.0.1:9000\", \"UDP server address\")\n\t\t...\n\
            \t\tsendWorkers = flag.Int(\"send-workers\", 1, \"number of concurrent send workers\")\n\t)\n\tflag.Parse()\n\n\
            \tworkers := *sendWorkers\n\tif workers <= 0 {\n\t\tworkers = 1\n\t}"
        - path: |-
            cmd/workload_client/main.go
          snippet: "conn, err := net.DialUDP(\"udp\", nil, udpAddr)\n\t\tif err != nil {\n\t\t\tlogger.Fatalf(\"dial udp worker=%d:\
            \ %v\", i, err)\n\t\t}\n\t\tdefer conn.Close()\n\n\t\tseed := time.Now().UnixNano() + int64(i)\n\t\trng := rand.New(rand.NewSource(seed))\n\
            \n\t\tworkerID := i\n\n\t\tsendWG.Add(1)\n\t\tgo func(workerID int, conn *net.UDPConn, rng *rand.Rand) {"
        - path: |-
            cmd/workload_client/main.go
          snippet: "go func(workerID int, conn *net.UDPConn) {\n\t\t\tdefer recvWG.Done()\n\t\t\tbuf := make([]byte, 64*1024)\n\
            \t\t\t// Set read deadline once to avoid blocking forever\n\t\t\tconn.SetReadDeadline(time.Now().Add(5 * time.Second))\n\
            \t\t\tfor {\n\t\t\t\tn, err := conn.Read(buf)\n\t\t\t\t...\n\t\t\t}\n\t\t}(workerID, conn)"
    - question: "In internal/server/ebpf.go\u2019s agent policy loader, what exact value is written into pebble_agent_state.active,\
        \ and is it always set equal to the configured number of workers?"
      answer:
        answer: "The agent policy loader writes the configured workers value directly into pebble_agent_state.active. Specifically,\
          \ it constructs:\n\n    state := ebpfutil.AgentSelectorAgentState{\n        Active: uint32(workers),\n    }\n\n\
          and then updates the map with this state. Before doing so, it validates that workers is non\u2011negative; if workers\
          \ < 0, it closes the objects and returns an error. There is no other adjustment or clamping, so whenever the update\
          \ occurs, pebble_agent_state.active is always set exactly to the configured number of workers (cast to uint32).\
          \ If workers is invalid (< 0), the state is not written at all."
        code_snippets:
        - path: |-
            internal/server/ebpf.go
          snippet: "if workers < 0 {\n\tobjs.Close()\n\treturn nil, ErrInvalidConfig(\"workers must be non-negative\")\n}\n\
            \nvar key uint32 = 0\nstate := ebpfutil.AgentSelectorAgentState{\n\tActive: uint32(workers),\n}\nif objs.PebbleAgentState\
            \ != nil {\n\tif err := objs.PebbleAgentState.Update(&key, &state, ebpf.UpdateAny); err != nil {\n\t\tobjs.Close()\n\
            \t\treturn nil, fmt.Errorf(\"configure agent state: %w\", err)\n\t}\n}"
    - question: "In internal/server/ebpf.go\u2019s updateTargetsMap (or equivalent), when policy=agent and workers=6, are\
        \ file descriptors for all 6 UDP worker sockets stored into the pebble_udp_targets map at indices 0 through 5?"
      answer:
        answer: "The shown updateTargetsMap helper only writes a single entry: it loads the pebble_udp_targets map and stores\
          \ the provided file descriptor at the given slot index. Whether all 6 worker sockets (indices 0\u20135) are populated\
          \ depends on other code (e.g., the policy implementation calling updateTargetsMap for each worker). In the provided\
          \ code, there is no logic shown that automatically iterates over 6 workers and calls updateTargetsMap for slots\
          \ 0 through 5, so you cannot conclude from this code alone that all 6 UDP worker FDs are stored in indices 0\u2013\
          5 when policy=agent and workers=6."
        code_snippets:
