            \t\t\t\tisGet := true\n\t\t\t\t\t\treqType := \"GET\"\n\t\t\t\t\t\tif rng.Float64() > *getFrac {\n\t\t\t\t\t\t\
            \treqType = \"SCAN\"\n\t\t\t\t\t\t\tisGet = false\n\t\t\t\t\t\t}\n\t\t\t\t\t\t// Capture timestamp, build payload,\
            \ and send immediately\n\t\t\t\t\t\treqID := makeReqID(time.Now().UnixNano(), currSeq, isGet)\n\t\t\t\t\t\tpayload\
            \ := buildPayload(rng, buf, reqType, reqID, *keyPrefix, *keySpace, *scanLimit)\n\t\t\t\t\t\tif _, err := conn.Write(payload);\
            \ err != nil {\n\t\t\t\t\t\t\tlogger.Printf(\"write error (worker=%d): %v\", workerID, err)\n\t\t\t\t\t\t\tbuf\
            \ = payload[:0]\n\t\t\t\t\t\t\tcontinue\n\t\t\t\t\t\t}\n\t\t\t\t\t\tatomic.AddInt64(&sentTotal, 1)\n\t\t\t\t\t\
