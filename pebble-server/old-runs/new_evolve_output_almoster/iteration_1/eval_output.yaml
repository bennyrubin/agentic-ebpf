      \ the eBPF program once (on worker 0), and runs exactly one goroutine per socket calling `ReadFromUDP` and then `handleRequest`\
      \ synchronously (no intra-worker parallelism). `handleRequest` simulates 10\xB5s GETs and 2ms SCANs via busy-wait, and\
      \ the logs confirm avg_get\u224810.15\xB5s and avg_scan\u22482.0ms. On the client side, there is a knob for `-send-workers`,\
      \ each creating its own `net.UDPConn` (distinct local port) and independently choosing GET vs SCAN at 99%/1%. In the\
      \ experiments, the worker-level server logs show only 4\u20135 of the 6 workers handling traffic and, crucially, that\
      \ each active worker\u2019s GET count per second is very close to an integer multiple of a common \\\"base\\\" value,\
      \ with the sum of those integer factors consistently \u22487. For example, in the 50k run: worker GETs\u2248[7k,14k,7k,21k]\
      \ summing to \u224849k (base\u22487k, factors 1,2,1,3). This pattern across rates strongly indicates there are about\
      \ 7 client UDP flows (7 send workers), each pinned by the eBPF hash to a single server worker. With 7 flows hashed into\
      \ 6 buckets, some workers receive two flows, some one, and some zero; which workers are idle changes across runs, but\
      \ at any given run at least one worker sees no traffic. At offered loads up to 80k req/s, these 4\u20135 active workers\
      \ have enough spare CPU that queues remain short: the client reports sent\u2248recv, small outstanding counts, no missing\
      \ responses, and p99 latency of just a few microseconds above the synthetic 10\xB5s GET delay. Once the offered rate\
      \ reaches 100k and then 140k req/s, the total server throughput plateaus around 90\u201395k req/s regardless of further\
      \ load increases, while the client\u2019s outstanding request count explodes (to tens or hundreds of thousands) and,\
      \ at 140k, ~222k responses never arrive. The eBPF selector does not consider current load or request type, so new packets\
      \ keep being steered to the same small set of \\\"hot\\\" worker sockets, even though 1\u20132 workers are effectively\
      \ idle. On each hot worker, GET and SCAN requests share a single FIFO stream serviced by one goroutine; the infrequent\
      \ but long 2ms SCANs repeatedly occupy the worker, causing head-of-line blocking for the many short GETs queued behind\
      \ them. As the per-worker arrival rate exceeds its service capacity, per-socket UDP receive queues and in-process queues\
      \ grow, driving GET p99 latency far above 10\xB5s (to ~0.6ms at 100k and ~5ms at 140k), and eventually overflowing the\
      \ UDP queues so that requests and/or responses are dropped, which matches the client\u2019s missing responses at 140k\
      \ even though the server logs show no application-level errors.\",\"hypothesis\":{\"text\":\"The observed latency blow-up\
      \ and throughput ceiling are caused by the combination of per-flow consistent hashing in the agent eBPF selector and\
      \ a small, fixed number of client UDP flows, which leaves some workers overloaded while others are idle. The agent loader\
      \ sets `agent_state.active` to the full worker count (6), and the BPF program uses `slot = reuse->hash % active` to\
      \ choose a reuseport socket from a fully populated `pebble_udp_targets` map. The workload client creates a small number\
      \ of `net.UDPConn`s (\u22487 send workers, each its own flow), so these flows are hashed onto only 4\u20135 of the 6\
      \ workers; at least one worker receives no traffic in each run, and others receive either one or two flows. Each worker\
      \ is a single goroutine that parses requests and then busy-waits for 10\xB5s on GETs or 2ms on SCANs; SCANs are chosen\
      \ independently per request with 1% probability on every flow, so every hot worker sees a similar GET/SCAN mix. At offered\
      \ loads \u226480k req/s, the few active workers still have headroom and queues stay short, so p99 latency remains near\
      \ the synthetic 10\xB5s and there is no loss. As offered load increases to 100k and 140k, the aggregate arrival rate\
      \ into the 4\u20135 hot workers exceeds their combined service capacity (given the 2ms SCANs), while 1\u20132 workers\
      \ remain mostly unused. Because the eBPF selector cannot rebalance based on queue length or request type, new packets\
      \ continue to be directed to already-saturated sockets, and each SCAN causes head-of-line blocking for the many queued\
      \ GETs on that worker. This produces long per-worker queues, which the client observes as a rapidly growing outstanding\
      \ count and GET p99 latencies jumping from microseconds to hundreds of microseconds and then several milliseconds. At\
      \ 140k, the UDP receive queues on these saturated workers overflow; packets are dropped in the kernel, so the client\
      \ sees ~222k missing responses, while server metrics still show a throughput plateau around 90\u201395k req/s with no\
