response_text: "- **Idea alignment**\n\n  - Conceptually this matches the design doc very well:\n    - Stateless per\u2011\
  packet, O(1), no new maps.\n    - Uses `pebble_agent_state.active` and `pebble_udp_targets` only.\n    - Clean GET/SCAN\
  \ lane split via payload sniffing.\n  - But behavior at high load **diverges from the goal** of \u201Ckeeping all workers\
  \ reasonably utilized while avoiding pathological queue build\u2011up\u201D:\n    - With 6 workers and `scan_cnt = 1`, all\
  \ SCANs are forced onto a single worker, which becomes **CPU\u2011overloaded**.\n    - At 140k req/s with \u22480.5% SCANs:\n\
  \      - SCAN arrival \u2248 0.005 \xD7 140k \u2248 **700 SCAN/s**.\n      - Single worker with 2ms/SCAN can only do \u2248\
  **500 SCAN/s** \u2192 unstable M/G/1 queue.\n    - Metrics confirm the overload:\n      - p99 overall climbs from 7.8ms\
  \ at 100k to **676ms at 140k** (`overall_latency_p99_avg_ms`), far worse than the prior ~16ms.\n    - This is exactly \u201C\
  pathological per\u2011worker queue build\u2011up\u201D on the SCAN lane; the GET lane is fine but overall p99 is dominated\
  \ by the tiny set of hugely delayed SCANs (p99 covers the slowest 1%, and SCANs are ~0.5%).\n\n- **Key takeaways from this\
  \ attempt**\n\n  - The lane split **does** isolate GETs from SCANs structurally.\n  - The current static split (1 SCAN worker,\
  \ N\u22121 GET workers) **starves SCAN capacity** given SCAN service time (~200\xD7 GET) and SCAN fraction (~0.5%).\n  -\
  \ As soon as offered SCAN load exceeds single\u2011worker capacity (~100\u2013120k total qps), SCAN queue length explodes,\
  \ leading to 100s of ms tails and huge overall p99.\n  - At \u2264100k/s, p99 is acceptable (2.5\u20137.8ms), so the classification\
  \ logic and basic routing are functioning; the issue is **lane sizing**, not correctness.\n\n- **Top changes to try next**\n\
  \n  1. **Give SCANs multiple workers (about half of `active`) instead of 1**\n\n     - Rationale:\n       - With 2ms SCAN\
  \ vs 10\xB5s GET and 0.5% SCAN, CPU demand is \u224850/50 between GET and SCAN; dedicating ~half of workers to SCANs is\
  \ a better static match.\n       - For 6 workers, this yields 3 SCAN workers and 3 GET workers; each side runs at ~\u2159\
  \ CPU per worker, avoiding overload.\n     - Concrete change in the lane sizing block:\n\n       ```c\n       if (active\
  \ > 1) {\n           __u32 scan_cnt;\n\n           /* Give SCANs a reasonable share of workers.\n            * For active\
  \ >= 4, dedicate about half of the workers to SCANs.\n            * For small worker counts, keep at least one SCAN and\
  \ one GET worker.\n            */\n           if (active >= 4)\n               scan_cnt = active / 2;  /* e.g., 6 -> 3 scan\
  \ workers */\n           else\n               scan_cnt = 1;           /* active == 2 or 3: 1 SCAN worker */\n\n        \
  \   __u32 get_cnt = active - scan_cnt;\n           if (get_cnt == 0) {\n               /* Safety: never route everything\
  \ to SCAN lane */\n               scan_cnt = active - 1;\n               get_cnt = 1;\n           }\n\n           if (is_scan)\
  \ {\n               lane_start = 0;\n               lane_size  = scan_cnt;\n           } else {\n               lane_start\
  \ = scan_cnt;\n               lane_size  = get_cnt;\n           }\n       }\n       ```\n\n     - This keeps:\n       -\
