  - iteration: 1
    idea_payload:
      status: finish
      design_doc:
        goals:
        - Eliminate sensitivity to the number of client UDP flows so that all reuseport workers are used even when there are
          only a few flows (e.g., 7 send workers vs 6 server workers).
        - Avoid concentrating traffic on a small subset of workers, which previously caused per-worker saturation, long UDP
          queues, and dropped packets while other workers were idle.
        - "Reduce GET p99 latency at higher offered loads (\u2265100k req/s) by shrinking per-worker queues and spreading\
          \ rare, long SCAN requests across all workers instead of a few hotspots."
        - Keep the eBPF selector simple, stateless, and O(1) per packet, with no new user-space configuration or additional
          maps.
        - "Preserve the server\u2019s stateless per-request semantics and the client\u2019s existing pipelined, reqID-based\
          \ request/response handling so that responses remain correct regardless of which worker processes a given packet."
        evidence:
        - "The current agent selector computes `start = reuse->hash % state->active` and then probes from that slot, which\
          \ pins each client 4\u2011tuple to a fixed worker index, implementing per-flow consistent hashing."
        - "With ~7 client send workers and 6 server workers, server logs show only 4\u20135 workers handle traffic; each active\
          \ worker\u2019s GET count per second is an integer multiple of a common base, and those multiples sum to \u2248\
          7, confirming that flows are pinned and unevenly packed into 6 buckets."
        - "At offered rates of 50\u201380k req/s, these 4\u20135 hot workers still have headroom, so UDP and in-process queues\
          \ stay short: client sent\u2248recv, there are no missing responses, and GET p99 latency is only a few microseconds\
          \ above the synthetic 10\xB5s delay."
        - "At 100k and 140k req/s, total server throughput plateaus around 90\u201395k req/s even as offered load increases\
          \ and at least one worker remains idle in each run, indicating that the bottleneck is uneven worker utilization\
          \ rather than total CPU capacity."
        - "Each worker is a single goroutine that synchronously processes GET (10\xB5s busy-wait) and SCAN (2ms busy-wait)\
          \ requests in FIFO order; although SCANs are only ~1% of requests, they dominate CPU time (~67%), so when traffic\
          \ is concentrated on a few workers, those 2ms SCANs repeatedly cause head-of-line blocking for the many short GETs\
          \ queued behind them."
        - "Under high load, these hot workers\u2019 UDP receive queues and in-process queues grow, pushing GET p99 latency\
          \ from microseconds to ~0.6ms at 100k and ~5ms at 140k, and eventually overflowing so that ~222k responses are never\
          \ received at 140k even though the server logs show no application-level errors."
        - "Server-side code (handleRequest and worker setup) is fully stateless with respect to client identity: there is\
          \ no state keyed by remote UDP address or 4\u2011tuple, only per-worker stats indexed by worker ID. This means breaking\
          \ flow affinity does not threaten correctness within the current design."
        - On the client side, each send goroutine continuously issues requests on its UDPConn under a rate limiter without
          waiting for responses; a separate recv goroutine on the same UDPConn handles replies and uses embedded reqIDs for
          matching. Multiple outstanding requests per flow and response reordering are already supported by design, so changing
          worker selection per packet will not violate any ordering assumptions.
        architecture:
        - "Replace the flow-sticky `reuse->hash % active` selection in AgentUDPSelector with per-packet randomized selection:\
          \ for each packet, look up `PebbleAgentState[0].Active` to obtain the number of configured workers (`active`), call\
          \ `bpf_get_prandom_u32()` to get a 32\u2011bit pseudo-random value, compute `slot = random % active`, and invoke\
          \ `bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0)` exactly once."
        - 'Keep using the existing `pebble_agent_state` and `pebble_udp_targets` maps without adding new maps or user-space
          configuration: `Active` remains the only field, set by Go to the worker count; the BPF program is otherwise stateless
          and depends only on generic helpers (`bpf_get_prandom_u32`) and the reuseport metadata.'
        - By making the selection independent for each packet and uniformly random across `[0, active)`, packets from a small
          number of client flows are evenly distributed over all workers over time, ensuring all 6 reuseport sockets share
          both GET and SCAN load, which reduces per-worker queue depth, mitigates head-of-line blocking for GETs, and allows
          aggregate throughput to scale closer to the theoretical capacity of all workers.
        risks:
        - The design assumes that `bpf_get_prandom_u32()` is available and permitted in sk_reuseport programs on the target
          kernel; this is expected but not guaranteed solely from the codebase and should be confirmed against the actual
          runtime environment (uncertain).
        - Per-packet random selection eliminates flow affinity entirely; while this is safe for the current stateless server
          and pipelined, reqID-based client, any future features that rely on per-client or per-flow affinity (e.g., per-client
          rate limiting, stateful sessions) would need to either opt into a different selector policy or reintroduce some
          form of affinity.
        - Randomized load balancing provides good balance in expectation but can still produce short-term bursts on individual
          workers; at very high loads, transient imbalance might slightly increase tail latency relative to an ideal clairvoyant
          scheduler, though this is likely far smaller than the imbalance caused by the existing flow-hash scheme (uncertain
          magnitude).
        - The Go struct `AgentSelectorAgentState` currently contains only an `Active uint32` field; any future changes to
          the C definition of `struct agent_state` used by `pebble_agent_state` must be accompanied by regenerating the ebpfutil
          bindings to avoid layout mismatches between BPF and Go.
