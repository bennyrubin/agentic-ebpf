    \ drop `reuse->hash` entirely.**  \n   If you want to maximize independence from the number of flows, you can base `h`\
    \ purely on the tail:\n\n   ```c\n   __u32 h = 0x811c9dc5u; // FNV offset basis\n\n   // same tail extraction as above\n\
    \   if (len >= 4) {\n       __u32 t = ...;\n       h ^= t;\n       h *= 16777619u;\n   }\n\n   if (h == 0) h = reuse->hash;\
    \ // fallback in pathological tiny packets\n\n   __u32 slot = h % active;\n   ```\n\n   That makes selection depend **only\
    \ on reqID/payload**, so you\u2019re completely insensitive to how many client UDPConns exist.\n\n3. **After this change,\
    \ verify basic utilization and service times.**  \n   Using server logs at 50k\u201380k:\n   - Confirm all 6 workers see\
    \ traffic (GET/SCAN counts > 0 and reasonably balanced).\n   - Check `avg_get_us \u2248 10` and `avg_scan_us \u2248 2000`.\
    \ If those drift, something else is wrong; if they\u2019re good but p99 is high, then the remaining issue is pure queueing\
    \ and we can consider further affinity tweaks next.\n\nThese steps should restore true per\u2011packet spreading (reqID\u2011\
    based), remove flow\u2011count sensitivity, and give a cleaner baseline to evaluate queueing and p99 behavior."
