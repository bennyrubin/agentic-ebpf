    - question: Besides agentselector.c, what other sk_reuseport selector programs exist under the ebpf/ directory (e.g.,
        hash-based or scan_split variants), and do any of them already perform request-type-aware routing that could inform
        the GET/SCAN lane partitioning design?
      answer:
        answer: "Under the eBPF loading logic, three distinct sk_reuseport selector programs are supported, each with its\
          \ own object set:\n\n1. A hash\u2011based selector (named \"hash\")\n   - Loaded via `loadHash` using `ebpfutil.HashSelectorObjects`.\n\
          \   - Uses the `HashUdpSelector` program attached as the sk_reuseport selector.\n   - Maintains a `PebbleHashState`\
          \ map with a `HashSelectorHashState{ Active: uint32(workers) }`, which only tracks the number of active workers.\n\
          \   - Validates `workers >= 0` but has no additional routing logic exposed here.\n\n2. A round\u2011robin selector\
          \ (named \"round_robin\")\n   - Loaded via `loadRoundRobin` using `ebpfutil.RrSelectorObjects`.\n   - Uses the `RrUdpSelector`\
          \ program as the sk_reuseport selector.\n   - Maintains a `PebbleRrState` map storing `RrSelectorRrState{ Active,\
          \ Counter }`:\n     - On first lookup failure, initializes `Active = workers` and `Counter = 0`.\n     - On subsequent\
          \ loads, updates `Active` while preserving `Counter`.\n   - This implements a pure round\u2011robin policy driven\
          \ by a counter and the active worker count.\n\n3. A scan_split selector (named \"scan_split\")\n   - Loaded via\
          \ `loadScanSplit` using `ebpfutil.ScanSplitSelectorObjects`.\n   - Uses the `SplitUdpSelector` program as the sk_reuseport\
          \ selector.\n   - Maintains a `PebbleSplitState` map with `ScanSplitSelectorSplitState{ Active: uint32(workers)\
          \ }`, again just tracking the number of active workers.\n   - Also validates that `workers` is non\u2011negative.\n\
          \nAll three selectors expose only a simple control surface from user space: the number of active workers (and, for\
          \ round robin, an internal counter). None of these loaders configure any per\u2011request fields, request types,\
          \ or key ranges, nor do they differentiate GET vs SCAN or any other operation types at this layer. They are generic\
          \ load\u2011balancing primitives (hash, round\u2011robin, and a split policy that is parameterized only by an \"\
          Active\" count), not request\u2011type\u2011aware routers.\n\nSo, beyond the existing agentselector.c\u2011style\
          \ selector, there are hash, round\u2011robin, and scan_split selector programs under the eBPF directory, but they\
          \ do not currently implement request\u2011type\u2011aware routing that would directly drive a GET/SCAN lane partitioning\
          \ design. They may serve as structural patterns (e.g., map\u2011based state, pinning, reuseport attach), but new\
          \ logic would be required to route based on request type."
