  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n\n/*\n * Design:\n * -------\n * Previous versions of this\
    \ selector focused on spreading traffic evenly\n * across workers (e.g., via per-packet randomness). That flattens per\u2011\
    worker\n * utilization but still mixes short GETs (~10 \xB5s) and long SCANs (~2 ms) on\n * every UDP receive queue. Even\
    \ with balanced CPU, rare SCANs create\n * head-of-line blocking for many queued GETs on a given worker, which shows\n\
    \ * up as high end-to-end p99 latency at high load.\n *\n * Goals:\n *   - Minimize the time GETs spend queued behind\
    \ SCANs.\n *   - Keep all workers usefully busy without new maps or user-space config.\n *   - Stay verifier-friendly:\
    \ O(1) per packet, no loops, minimal state.\n *\n * Approach: static GET / SCAN lane partitioning.\n * ----------------------------------------------\n\
    \ * We use the existing pebble_agent_state map (Active workers) and treat the\n * reuseport sockarray indices as two static\
    \ \"lanes\":\n *\n *   - SCAN lane:   index 0 (one worker dedicated to SCANs when Active > 1).\n *   - GET lane:    indices\
    \ [1, Active-1] (all remaining workers).\n *\n * When there is only a single worker (Active == 1), the lanes collapse\
    \ and\n * we simply select slot 0.\n *\n * For each packet:\n *   1. Safely parse the incoming IPv4/UDP headers from sk_reuseport_md::data\n\
    \ *      and locate the UDP payload.\n *   2. Inspect the first few payload bytes to classify the request:\n *       \
    \ - \"SCAN \" \u2192 SCAN request.\n *        - Everything else (including \"GET ...\") \u2192 treated as GET/other.\n\
    \ *   3. Choose a lane:\n *        - SCANs \u2192 SCAN lane (slot range [0, 0] when Active > 1).\n *        - GET/other\
    \ \u2192 GET lane (slot range [1, Active-1] when Active > 1).\n *   4. Within the chosen lane, pick a worker index using\n\
    \ *      bpf_get_prandom_u32() % lane_size.\n *   5. Call bpf_sk_select_reuseport once with that slot.\n *\n * This ensures\
    \ that long SCAN requests are funneled into a small, fixed\n * subset of workers and do not share UDP queues with GETs.\
    \ GETs are thus\n * processed on workers that rarely, if ever, run SCANs, substantially\n * reducing their queueing delay\
    \ and improving overall p99 latency.\n *\n * The program remains:\n *   - Stateless per packet (no per-flow state, no\
    \ counters).\n *   - O(1) in work and memory.\n *   - Within verifier limits (no loops, all pointer accesses bounds-checked).\n\
    \ */\n\nstruct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n\
    \    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md\
    \ *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n  \
    \  if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\
    \n    /* Safety: never index beyond the sockarray size even if misconfigured. */\n    if (active > 128)\n        active\
    \ = 128;\n\n    /*\n     * Classify packet as SCAN vs non-SCAN by peeking into the UDP payload.\n     * We assume IPv4+UDP\
    \ as generated by the workload client. All accesses\n     * are guarded by data_end checks so the verifier can prove safety.\n\
    \     */\n    int is_scan = 0;\n\n    void *data = (void *)(long)reuse->data;\n    void *data_end = (void *)(long)reuse->data_end;\n\
    \n    /* Need at least 10 bytes of IPv4 header to read version/IHL and protocol. */\n    if ((void *)((__u8 *)data + 10)\
    \ > data_end)\n        goto classify_done;\n\n    __u8 ver_ihl = ((__u8 *)data)[0];\n    __u8 version = ver_ihl >> 4;\n\
    \    __u8 ihl     = ver_ihl & 0x0F;\n\n    /* Only handle IPv4; anything else falls back to non-SCAN. */\n    if (version\
    \ != 4)\n        goto classify_done;\n\n    /* IHL is in 32-bit words; valid range for IPv4 header is [5, 15]. */\n  \
    \  if (ihl < 5 || ihl > 15)\n        goto classify_done;\n\n    __u32 ip_header_len = (__u32)ihl * 4;\n\n    /* Ensure\
    \ the full IPv4 header and UDP header (8 bytes) are present. */\n    if ((void *)((__u8 *)data + ip_header_len + 8) >\
    \ data_end)\n        goto classify_done;\n\n    /* Protocol field is at offset 9 of the IPv4 header. */\n    __u8 proto\
    \ = ((__u8 *)data)[9];\n    /* 17 == IPPROTO_UDP */\n    if (proto != 17)\n        goto classify_done;\n\n    /* UDP payload\
    \ starts after the variable-length IPv4 header and 8-byte UDP header. */\n    {\n        __u8 *udp_payload = (__u8 *)data\
    \ + ip_header_len + 8;\n\n        /* We need at least 1 byte to check for leading 'S'. */\n        if ((void *)(udp_payload\
    \ + 1) > data_end)\n            goto classify_done;\n\n        if (udp_payload[0] == 'S') {\n            /* We need full\
    \ \"SCAN \" / \"SCAN\\t\" (5 bytes) to classify as SCAN. */\n            if ((void *)(udp_payload + 5) <= data_end &&\n\
    \                udp_payload[1] == 'C' &&\n                udp_payload[2] == 'A' &&\n                udp_payload[3] ==\
    \ 'N' &&\n                (udp_payload[4] == ' ' || udp_payload[4] == '\\t')) {\n                is_scan = 1;\n      \
    \      }\n        }\n    }\n\nclassify_done:\n    /*\n     * Lane selection:\n     *  - If only one worker is active,\
    \ everyone goes to slot 0.\n     *  - If more than one worker:\n     *      - SCANs  \u2192 slot 0 (SCAN lane, size 1).\n\
    \     *      - others \u2192 slots [1, active-1] (GET lane).\n     */\n    __u32 lane_start = 0;\n    __u32 lane_size\
    \  = active;\n\n    if (active > 1) {\n        __u32 scan_cnt = 1;\n        __u32 get_cnt  = active - scan_cnt;\n\n  \
    \      if (is_scan) {\n            lane_start = 0;\n            lane_size  = scan_cnt;  /* == 1 */\n        } else {\n\
    \            lane_start = scan_cnt;  /* == 1 */\n            lane_size  = get_cnt;   /* >= 1 */\n        }\n    }\n\n\
    \    if (lane_size == 0)\n        return SK_PASS;\n\n    __u32 rnd = bpf_get_prandom_u32();\n    __u32 idx = rnd % lane_size;\n\
    \    __u32 slot = lane_start + idx;\n\n    /* Single reuseport selection; kernel ignores any additional calls. */\n  \
    \  bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n}\n\n// EVOLVE-BLOCK-END\n\n\
