    idea_payload:
      status: continue
      design_doc:
        goals:
        - Eliminate sensitivity to the number of client UDP flows so that all reuseport workers are used even when there are
          only a few flows (e.g., 7 send workers vs 6 server workers).
        - Avoid concentrating traffic on a small subset of workers, which previously caused per-worker saturation, long UDP
          queues, and dropped packets while other workers were idle.
        - "Reduce GET p99 latency at higher offered loads (\u2265100k req/s) by shrinking per-worker queues and spreading\
          \ rare, long SCAN requests across all workers instead of a few hotspots."
        - Keep the eBPF selector simple and stateless (no new maps, no per-flow state), with constant-time per-packet overhead
          and no new user-space configuration requirements.
        - Preserve existing server semantics (stateless per-request handling, no dependence on flow affinity) so that responses
          remain correct regardless of which worker processes a given packet.
        evidence:
        - "The current agent selector uses `slot = reuse->hash % active` where `active` is the number of workers (6), causing\
          \ per-flow consistent hashing onto a fixed worker index per 4\u2011tuple."
        - "With ~7 client send workers (flows) and 6 server workers, logs show only 4\u20135 workers carry traffic, and each\
          \ hot worker\u2019s GET count per second is an integer multiple of a common base, summing to ~7\xD7 that base, confirming\
          \ flow pinning."
        - "At 50\u201380k req/s, the active workers have headroom so queues stay short: sent\u2248recv, no drops, and GET\
          \ p99 only a few microseconds above the synthetic 10\xB5s delay."
        - "At 100k and 140k req/s, aggregate throughput plateaus near 90\u201395k req/s even as offered load rises and at\
          \ least one worker remains idle in each run, proving that the bottleneck is uneven worker utilization, not total\
          \ CPU."
        - "Each hot worker processes GET (10\xB5s) and SCAN (2ms) requests in a single FIFO goroutine; SCANs are only 1% of\
          \ requests but account for ~67% of CPU time, so when traffic is concentrated on 4\u20135 workers, these 2ms SCANs\
          \ repeatedly cause head-of-line blocking for short GETs."
        - Under high load, per-socket UDP receive queues and in-process queues grow dramatically, driving GET p99 latency
          from microseconds to ~0.6ms at 100k and ~5ms at 140k, and eventually overflowing so that ~222k responses are never
          received at 140k even though the server logs show no application-level errors.
        - "The eBPF selector does not look at queue length, load, or request type; it always hashes by 4\u2011tuple, so it\
          \ cannot rebalance away from saturated sockets or spread SCANs across more workers."
        architecture:
        - 'Replace the per-flow consistent hashing in agent_udp_selector with a per-packet, time-salted hash that breaks flow
          stickiness while remaining stateless: on each packet, read `agent_state.active` as the number of available workers,
          obtain a fast monotonically-increasing timestamp via a BPF helper (e.g., `ktime_get_ns`), combine it with `reuse->hash`
          using a simple operation (such as XOR), and map the result into `[0, active)` to choose the target slot for a single
          `bpf_sk_select_reuseport` call.'
        - This design keeps using the existing pebble_agent_state map (no new maps, no extra fields required) but stops relying
          on `reuse->hash % active`, so packets from a small number of client flows are evenly distributed across all active
          workers over time, naturally balancing both GET and SCAN load without any explicit per-flow or per-worker state.
        - Because selection is per-packet and independent of any session state, every worker will see approximately the same
          share of total traffic (and of the rare long SCANs), which reduces per-worker queuing, mitigates head-of-line blocking
          for GETs, and allows aggregate throughput to scale up to the true capacity of all 6 workers under the existing synthetic
          workload.
        risks:
        - "The design assumes that the server\u2019s request handling is fully stateless per packet and that no Go code maintains\
          \ per-client or per-flow state that depends on all packets from a given 4\u2011tuple arriving on the same worker;\
          \ if such state exists, breaking flow affinity could cause correctness issues."
        - It is assumed but not yet verified from the code that no other components (e.g., metrics, debugging tools) rely
          on the current consistent mapping between client flow and worker index for interpretation; changing the selection
          policy could make some existing logs less intuitive if they implicitly expect per-flow stickiness.
        - The proposal relies on using a time-based BPF helper (such as `bpf_ktime_get_ns`) from within an sk_reuseport program;
