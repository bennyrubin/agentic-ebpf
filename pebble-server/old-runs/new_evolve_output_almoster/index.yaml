    idea_payload:
      status: continue
      design_doc:
        goals:
        - Reduce client-observed p99 latency for GET requests at high load by minimizing time spent queued behind slow SCAN
          requests in per-socket UDP receive queues.
        - Prevent pathological per-worker queue build-up while still spreading traffic across all reuseport workers, even
          when there is only a single client UDP flow and a purely open-loop sender.
        - Exploit the known GET/SCAN service-time skew by steering SCANs away from GETs (separate 'lanes') using only existing
          eBPF maps and without adding user-space configuration.
        - 'Keep the selector as simple and verifier-friendly as possible: stateless beyond the existing pebble_agent_state
          map, O(1) work per packet, no new maps, and no dependence on per-flow state.'
        evidence:
        - "Server perf logs show even packet distribution across all 6 workers and stable in-handler latencies (avg_get \u2248\
          10\u201311 \xB5s, avg_scan \u22482 ms) with zero errors, indicating the current per-packet random selector is balancing\
          \ traffic and the handlers themselves are behaving as configured."
        - Client logs show sent==recv but outstanding requests and overall p99 latency rise sharply with load, reaching ~16
          ms p99 at 140k req/s, which implies significant queueing delay is being added outside the handler (i.e., in kernel
          UDP receive queues).
        - "With one client UDP socket and stateless per-packet random routing, each worker behaves like an independent M/G/1\
          \ queue. Rare SCANs (~0.5% but \u2248200\xD7 slower than GETs) occasionally occupy a worker for ~2 ms while dozens\
          \ of new GETs are randomly assigned to the same worker, creating long per-socket queues and head-of-line blocking."
        - "Because the server\u2019s latency metrics measure only time inside handleRequest (after ReadFromUDP), they do not\
          \ capture kernel queueing delays, while the client measures end-to-end latency and therefore exposes the high tail\
          \ that arises from those queues."
        - Under these conditions, the primary performance problem is not imbalance across workers but GETs being randomly
          co-located with slow SCANs on the same worker socket, amplifying queueing variance and inflating GET p99 latency.
        architecture:
        - Extend the sk_reuseport/selector to minimally parse the incoming UDP payload (using sk_reuseport_md->data/data_end)
          and classify each request as GET-like (fast) or SCAN-like (slow) based on its ASCII prefix (e.g., leading 'G' vs
          'S').
        - 'Use the existing pebble_agent_state.active to determine the current number of workers and partition the reuseport
          sockarray indices into two disjoint groups: a SCAN lane (roughly half of the [0, active) slots) and a GET lane (the
          remaining slots), with simple deterministic sizing that does not require user-space tuning.'
        - 'For each packet, perform a per-packet pseudo-random selection (reuse->hash mixed with bpf_get_prandom_u32) within
          the appropriate lane: SCANs are routed only to SCAN-lane workers, GETs only to GET-lane workers, falling back to
          the full [0, active) set when there is only one worker or the partition collapses.'
        risks:
        - Assumes that entries in the pebble_udp_targets BPF_MAP_TYPE_REUSEPORT_SOCKARRAY are populated densely from index
          0 up to (active-1) and that these indices map 1:1 to distinct server worker goroutines; if the server uses a different
          indexing scheme, the lane partitioning could be ineffective or misaligned.
        - Assumes that all current requests are ASCII-encoded and begin with distinct textual prefixes for GET and SCAN (e.g.,
          'GET ' vs 'SCAN '), and that no other verbs need to be handled; misclassification could reduce the benefit of lane
          separation.
        - Statically allocating a fixed fraction of workers to the SCAN lane based solely on active (e.g., about half) implicitly
          bakes in assumptions about the GET/SCAN mix and relative service times; if these change significantly in other experiments,
          the SCAN lane may be over- or under-provisioned.
        - Relies on sk_reuseport programs having safe access to packet payload via data/data_end within the verifier and kernel
          used by this project; if the actual sk_reuseport_md layout or kernel capabilities are more limited, payload parsing
          might need to be adjusted or simplified.
        - Assumes pebble_agent_state.active is set once at startup and remains constant; if the server ever changes the active
          worker count at runtime, we must confirm that the selector continues to see consistent state and that the lane partitioning
          logic behaves sensibly.
