          \ virtual finish times in addition to the existing Active field. Conceptually: `struct agent_state { __u32 active;\
          \ __u32 pad; __u64 finish[MAX_WORKERS]; }`, where MAX_WORKERS is a small compile-time constant (e.g., 32) \u2265\
