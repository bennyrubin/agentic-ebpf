    \  - Overall p99 (ms) vs rate:  \n    - 50k: 3.24  \n    - 60k: 7.17  \n    - 80k: 603  \n    - 100k: 1484  \n    - 140k:\
    \ 4475  \n  - The baseline agent selector from the parent run had \u224816 ms p99 at 140k; you\u2019re now in **seconds**,\
    \ not milliseconds.\n- Root cause from the code:\n  - You removed `bpf_get_prandom_u32()` and now use:\n    - GET: `slot\
    \ = reuse->hash % active;`\n    - SCAN: `slot = scan_base + (reuse->hash % scan_workers);`\n  - With the client using\
    \ a single UDP socket, `reuse->hash` is effectively constant per packet stream, so:\n    - All GETs go to one fixed worker.\n\
    \    - All SCANs go to one fixed worker in the tail subset.\n    - The remaining workers are mostly idle.\n  - This violates\
    \ the goal \u201CPreserve good utilization across reuseport workers even with a small number of client flows\u201D and\
    \ explains the huge queueing and p99 blow-up.\n- The SCAN/GET classification itself (payload scan) is likely correct and\
    \ verifier-safe; the issue is the **load-spreading logic**, not parsing.\n\n**Key takeaways from this run**\n\n- Behavior\
    \ is dominated by hot-spotting:\n  - At high offered load, you\u2019re effectively running the workload on 1\u20132 workers\
    \ instead of 6.\n  - With 2 ms SCANs and 10 \xB5s GETs, that produces extreme M/G/1 queueing and multi-second p99.\n-\
    \ The idea of \u201Cconcentrate SCANs on a subset\u201D is good, but without per-packet randomness you\u2019ve lost the\
    \ even worker utilization that the original agent policy had.\n\n**Top changes to try next**\n\n1. **Reintroduce per-packet\
    \ randomness when choosing the worker (for both GET and SCAN).**\n\n   - Use a randomized hash instead of bare `reuse->hash`:\n\
    \n   ```c\n   __u32 rnd = bpf_get_prandom_u32();\n   __u32 h = reuse->hash ^ rnd;\n   ```\n\n   - Then base all `%` computations\
    \ on `h`, not `reuse->hash` directly.\n   - This restores the \u201Cspread across all workers per packet\u201D behavior\
    \ that kept utilization healthy with a single client flow, while still allowing you to bias SCANs to a subset.\n\n2. **Make\
    \ GETs avoid the SCAN subset entirely (two disjoint pools) instead of sending GETs to all workers.**\n\n   - Today:\n\
    \     - GET: `slot = h % active;`  (so GETs also land on SCAN workers)\n     - SCAN: tail subset based on `scan_workers`.\n\
    \   - Next iteration: split workers into \u201Cfast\u201D (GET) and \u201Cslow\u201D (SCAN) pools:\n\n   ```c\n   __u32\
    \ scan_workers = active / 3;\n   if (scan_workers == 0)\n       scan_workers = 1;\n   if (scan_workers >= active)\n  \
    \     scan_workers = active - 1;\n\n   __u32 fast_workers = active - scan_workers; // >= 1\n\n   __u32 rnd = bpf_get_prandom_u32();\n\
    \   __u32 h = reuse->hash ^ rnd;\n\n   if (is_scan) {\n       // Only in tail SCAN pool\n       slot = fast_workers +\
    \ (h % scan_workers);\n   } else {\n       // Only in fast pool\n       slot = h % fast_workers;\n   }\n   ```\n\n   -\
    \ This keeps:\n     - GETs completely insulated from SCAN head-of-line blocking.\n     - SCAN load spread randomly across\
    \ a smaller tail subset.\n     - All workers utilized (fast pool handles most traffic; scan pool handles scans).\n\n3.\
    \ **(Optional tuning after 1\u20132 are working): adjust `scan_workers` fraction.**\n\n   - Start with `active / 3` as\
    \ you have.\n   - If SCAN p99 explodes or scan throughput suffers, experiment with:\n     - `scan_workers = max(1, active\
    \ / 2)` for more SCAN capacity, or\n     - `scan_workers = max(1, active / 4)` for more GET-only workers.\n   - But don\u2019\
    t touch this until you\u2019ve fixed the randomization hot-spot issue; the current run is dominated by that."
