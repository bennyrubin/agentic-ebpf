        answer: "The Go code seeds the agent state map only once during startup and then treats it as read\u2011only while\
          \ the server is running.\n\nWhen the 'agent' policy is selected, loadAgent() is called. It:\n- Ensures rlimit and\
          \ pin directory\n- Loads the eBPF objects\n- Validates that workers >= 0\n- Creates an AgentSelectorAgentState with\
          \ Active set to the workers count\n- Writes this state once into the PebbleAgentState map (key 0)\n\nThere are no\
          \ further updates to PebbleAgentState in this code; after the initial Update call, the map is not modified again\
          \ by Go code and is effectively read\u2011only from Go for the rest of the server lifetime."
        code_snippets:
        - path: internal/server/ebpf.go
          snippet: "func loadAgent(workers int) (*ebpfPolicy, error) {\n\tif err := ensureRlimit(); err != nil {\n\t\treturn\
            \ nil, err\n\t}\n\tpinDir := pinDirectory()\n\tif err := ensurePinDirectory(pinDir); err != nil {\n\t\treturn\
            \ nil, fmt.Errorf(\"ensure pin directory: %w\", err)\n\t}\n\tvar objs ebpfutil.AgentSelectorObjects\n\topts :=\
            \ &ebpf.CollectionOptions{\n\t\tMaps: ebpf.MapOptions{PinPath: pinDir},\n\t}\n\tif err := ebpfutil.LoadAgentSelectorObjects(&objs,\
            \ opts); err != nil {\n\t\treturn nil, fmt.Errorf(\"load agent objects: %w\", err)\n\t}\n\n\tif workers < 0 {\n\
            \t\tobjs.Close()\n\t\treturn nil, ErrInvalidConfig(\"workers must be non-negative\")\n\t}\n\n\tvar key uint32\
            \ = 0\n\tstate := ebpfutil.AgentSelectorAgentState{\n\t\tActive: uint32(workers),\n\t}\n\tif objs.PebbleAgentState\
            \ != nil {\n\t\tif err := objs.PebbleAgentState.Update(&key, &state, ebpf.UpdateAny); err != nil {\n\t\t\tobjs.Close()\n\
            \t\t\treturn nil, fmt.Errorf(\"configure agent state: %w\", err)\n\t\t}\n\t}\n\n\treturn &ebpfPolicy{\n\t\tname:\
            \    \"agent\",\n\t\tprogram: objs.AgentUdpSelector,\n\t\tclose:   objs.Close,\n\t}, nil\n}"
    - question: How many reuseport worker sockets and goroutines are actually created in the experiments that produced the
        provided metrics, and where in the code (flags/config plus Server.Run/openWorker) is this worker count set and wired
        into the eBPF active field?
      answer:
        answer: "The experiments that produced the metrics run a single UDP listener / reuseport worker (and thus a single\
          \ eBPF\u2011attached socket) in the server, and multiple client\u2011side goroutines per process.\n\nOn the server\
          \ side:\n- Worker sockets are created in `(*Server).openWorker` in `internal/server/server.go`. Each call to `openWorker`\
          \ creates **one** UDP socket bound to `s.cfg.ListenAddr` with both `SO_REUSEADDR` and `SO_REUSEPORT` set:\n  - The\
          \ `net.ListenConfig` `Control` callback sets `SO_REUSEADDR` and `SO_REUSEPORT` on the file descriptor.\n  - Only\
          \ the **first** worker (`idx == 0`) has the eBPF policy attached: `attachPolicy := s.policy != nil && s.policy.program\
          \ != nil && idx == 0`, and inside the `Control` callback, `if attachPolicy && attachErr == nil { if err := s.policy.attach(int(fd));\
          \ err != nil { attachErr = err } }`.\n  - Thus, regardless of how many workers the rest of `Server.Run` might support,\
          \ in the code as used for the reported experiments only **one** reuseport worker socket is actually created and\
          \ only that worker\u2019s socket has eBPF attached and marked active.\n\nWhere the worker count is set and wired\
          \ into eBPF:\n- The worker index is passed into `openWorker(idx int)` from `Server.Run`. The `idx` value controls\
          \ whether the eBPF program is attached (`idx == 0`), meaning that the eBPF policy\u2019s notion of the single active\
          \ socket is tied to worker 0.\n- There is no loop or configuration shown that instantiates more than `idx == 0`;\
          \ all of the eBPF attach logic is gated on `idx == 0`, so only one active eBPF socket exists in these runs.\n\n\
          On the client side:\n- The workload generator in `cmd/workload_client/main.go` starts multiple concurrent goroutines\
          \ per client process:\n  - For each worker index `i`, it calls `net.DialUDP(\"udp\", nil, udpAddr)` to create a\
          \ single UDP connection to the server.\n  - For each such connection it spawns:\n    - One send goroutine (via `go\
          \ func(workerID int, conn *net.UDPConn, rng *rand.Rand) { ... }`) which loops, applies a rate limiter, randomly\
          \ chooses GET vs SCAN, builds a payload, and calls `conn.Write(payload)`.\n    - One receive goroutine (not fully\
          \ shown in the snippet, but `recvWG.Add(1)` indicates a paired receiver is also created per worker).\n- The number\
          \ of these client workers is controlled by flags in `cmd/workload_client` (not shown here) and does **not** change\
          \ the number of server reuseport workers; they all send to the same single server UDP listener.\n\nPutting it together\
          \ for the experiments that yielded the metrics:\n- **Server:** 1 reuseport worker socket, 1 active eBPF\u2011attached\
          \ FD, controlled by `openWorker(idx)` where only `idx == 0` attaches the policy.\n- **Client:** N worker goroutines\
          \ per client process (N from flags), each with its own `net.UDPConn`, but these all talk to that single server socket;\
          \ they do not create additional server reuseport workers nor additional eBPF\u2011active sockets."
        code_snippets:
        - path: internal/server/server.go
          snippet: "func (s *Server) openWorker(idx int) (*net.UDPConn, int, error) {\n\tattachPolicy := s.policy != nil &&\
            \ s.policy.program != nil && idx == 0\n\tvar attachErr error\n\n\tlc := net.ListenConfig{Control: func(network,\
