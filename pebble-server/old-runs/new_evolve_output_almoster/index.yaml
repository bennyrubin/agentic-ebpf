        answer: "cmd/workload_client sends ASCII UDP payloads with this exact format:\n\n- General pattern (both GET and SCAN):\n\
          \  \"<REQTYPE><space><KEY><space><REQID>\"\n\n  where `<space>` is the single ASCII space character `' '` (0x20),\
          \ and there are no leading or trailing spaces beyond those shown.\n\n- For GET requests:\n  1. The payload starts\
          \ with the uppercase letters:\n     \"GET\" (bytes: 0x47 0x45 0x54)\n  2. Followed by exactly one space character\
          \ (0x20).\n  3. Then the key string `<KEY>` (see key format below).\n  4. Then exactly one space character (0x20).\n\
          \  5. Then the request ID `<REQID>` as ASCII hex plus a 1-byte type suffix (see below for details).\n\n  So the\
          \ beginning of every GET request is exactly:\n  \"GET \"\n\n- For SCAN requests:\n  1. The payload starts with the\
          \ uppercase letters:\n     \"SCAN\" (bytes: 0x53 0x43 0x41 0x4e)\n  2. Followed by exactly one space character (0x20).\n\
          \  3. Then the key string `<KEY>` (see key format below).\n  4. Then exactly one space character (0x20).\n  5. Then\
          \ the decimal scan limit `<SCANLIMIT>` in ASCII digits (no leading spaces, no sign).\n  6. Then exactly one space\
          \ character (0x20).\n  7. Then the request ID `<REQID>` as ASCII hex plus a 1-byte type suffix.\n\n  So the beginning\
          \ of every SCAN request is exactly:\n  \"SCAN \"\n\n- KEY format (`appendKey`):\n  * The key always starts with\
          \ the configured prefix string `prefix` exactly as given (case-sensitive, no added delimiters).\n  * After `prefix`,\
          \ a numeric key index is appended:\n    - If `keyIdx < 100000000` (i.e., 0\u201399,999,999), it is encoded as an\
          \ 8-digit, zero-padded decimal number, e.g., 0 \u2192 \"00000000\", 42 \u2192 \"00000042\".\n    - If `keyIdx >=\
          \ 100000000`, it is encoded as a decimal integer with no padding.\n\n  So `<KEY>` is:\n  \"<prefix><8-digit-zero-padded-decimal>\"\
          \ (for small indices) or\n  \"<prefix><decimal-without-padding>\" (for large indices).\n\n- REQID format (`makeReqID`):\n\
          \  * `<REQID>` is a fixed-length ASCII string of length `idTotalLen`.\n  * It consists of:\n    1. A hex-encoded\
          \ send timestamp in nanoseconds (`sendNano`), occupying `idTimeHexLen` characters, using lowercase hex digits from\
          \ the constant `hexDigits`.\n    2. Immediately followed by a hex-encoded sequence number (`seq`), occupying `idSeqHexLen`\
          \ characters, also lowercase hex.\n    3. A final single-byte type marker at the very end (position `idTotalLen-1`):\n\
          \       - For GET: the last byte is `reqTypeGet`.\n       - For SCAN: the last byte is `reqTypeScan`.\n  * All hex\
          \ characters are contiguous, with no spaces or delimiters between time and sequence portions.\n\n- Summary for eBPF\
          \ classification using only initial bytes:\n  * GET requests always begin with:\n    \"GET \"\n    i.e., bytes [0..3]\
          \ = 0x47 0x45 0x54 0x20.\n  * SCAN requests always begin with:\n    \"SCAN \"\n    i.e., bytes [0..4] = 0x53 0x43\
          \ 0x41 0x4e 0x20.\n  * All subsequent delimiters between components (`KEY`, optional `SCANLIMIT`, `REQID`) are single\
          \ ASCII spaces.\n"
        code_snippets:
        - path: cmd/workload_client/main.go
          snippet: "func buildPayload(rng *rand.Rand, buf []byte, reqType, reqID, prefix string, keySpace, scanLimit int)\
            \ []byte {\n\tbuf = buf[:0]\n\tbuf = append(buf, reqType...)\n\tbuf = append(buf, ' ')\n\tkeyIdx := rng.Intn(keySpace)\n\
            \tbuf = appendKey(buf, prefix, keyIdx)\n\tif reqType == \"SCAN\" {\n\t\tbuf = append(buf, ' ')\n\t\tbuf = strconv.AppendInt(buf,\
            \ int64(scanLimit), 10)\n\t}\n\tbuf = append(buf, ' ')\n\tbuf = append(buf, reqID...)\n\treturn buf\n}\n\nfunc\
            \ appendKey(buf []byte, prefix string, keyIdx int) []byte {\n\tbuf = append(buf, prefix...)\n\tif keyIdx < 100000000\
            \ {\n\t\tstart := len(buf)\n\t\tbuf = append(buf, '0', '0', '0', '0', '0', '0', '0', '0')\n\t\tfor i := 7; i >=\
            \ 0; i-- {\n\t\t\tbuf[start+i] = byte('0' + keyIdx%10)\n\t\t\tkeyIdx /= 10\n\t\t}\n\t\treturn buf\n\t}\n\treturn\
            \ strconv.AppendInt(buf, int64(keyIdx), 10)\n}\n"
        - path: cmd/workload_client/main.go
          snippet: "func makeReqID(sendNano int64, seq uint64, isGet bool) string {\n\tvar buf [idTotalLen]byte\n\twriteHex(buf[:idTimeHexLen],\
            \ uint64(sendNano))\n\twriteHex(buf[idTimeHexLen:idTimeHexLen+idSeqHexLen], seq)\n\tif isGet {\n\t\tbuf[idTotalLen-1]\
            \ = reqTypeGet\n\t} else {\n\t\tbuf[idTotalLen-1] = reqTypeScan\n\t}\n\treturn string(buf[:])\n}\n\nfunc writeHex(dst\
            \ []byte, value uint64) {\n\tfor i := len(dst) - 1; i >= 0; i-- {\n\t\tdst[i] = hexDigits[value&0xF]\n\t\tvalue\
            \ >>= 4\n\t}\n}\n"
