    - question: Is there any existing eBPF selector in the repository that already maintains per-worker state in a map (e.g.,
        for round-robin or hash-based policies), and if so, what struct layout and update pattern does it use for that state
        (pointers to the relevant ebpf/*.c files and their generated Go bindings are sufficient)?
      answer:
        answer: "Yes. There are existing eBPF selectors that maintain per\u2011worker state in maps for both round\u2011robin\
          \ and hash/scan\u2011split style policies. The state is stored in small per\u2011policy maps keyed by a single uint32\
          \ key (typically 0) and updated from Go via the generated ebpfutil bindings.\n\n1) Round\u2011robin selector\n-\
          \ Go binding type: `ebpfutil.RrSelectorRrState`\n- Map: `objs.PebbleRrState`\n- Key type: `uint32` (always `0` is\
          \ used)\n- Fields:\n  - `Active uint32` \u2014 number of active workers\n  - `Counter uint32` \u2014 round\u2011\
          robin counter\n- Update pattern in Go:\n  - On load, it looks up the existing state; if lookup fails, it initializes\
          \ both `Active` and `Counter` (with `Counter = 0`). If lookup succeeds, it overwrites `Active` and preserves whatever\
          \ `Counter` was.\n  - Then it writes the struct back into the map with `UpdateAny`.\n\n  Relevant code (Go bindings\
          \ / loader):\n  - Struct and state management:\n    - `ebpfutil.RrSelectorRrState` used as the value\n    - `objs.PebbleRrState.Lookup(&key,\
          \ &state)`\n    - `objs.PebbleRrState.Update(&key, &state, ebpf.UpdateAny)`\n\n2) Hash\u2011based selector\n- Go\
          \ binding type: `ebpfutil.HashSelectorHashState`\n- Map: `objs.PebbleHashState`\n- Key type: `uint32` (always `0`)\n\
          - Fields:\n  - `Active uint32` \u2014 number of active workers\n- Update pattern in Go:\n  - Validates `workers\
          \ >= 0`.\n  - Constructs `HashSelectorHashState{ Active: uint32(workers) }`.\n  - If `objs.PebbleHashState` is non\u2011\
          nil, writes it with `UpdateAny`.\n\n  Relevant code (Go bindings / loader):\n  - Struct and state management:\n\
          \    - `ebpfutil.HashSelectorHashState{ Active: uint32(workers) }`\n    - `objs.PebbleHashState.Update(&key, &state,\
          \ ebpf.UpdateAny)`\n\n3) Scan\u2011split selector\n- Go binding type: `ebpfutil.ScanSplitSelectorSplitState`\n-\
          \ Map: `objs.PebbleSplitState`\n- Key type: `uint32` (always `0`)\n- Fields:\n  - `Active uint32` \u2014 number\
          \ of active workers\n- Update pattern in Go:\n  - Validates `workers >= 0`.\n  - Constructs `ScanSplitSelectorSplitState{\
          \ Active: uint32(workers) }`.\n  - If `objs.PebbleSplitState` is non\u2011nil, writes it with `UpdateAny`.\n\n \
          \ Relevant code (Go bindings / loader):\n  - Struct and state management:\n    - `ebpfutil.ScanSplitSelectorSplitState{\
          \ Active: uint32(workers) }`\n    - `objs.PebbleSplitState.Update(&key, &state, ebpf.UpdateAny)`\n\nIn all three\
          \ cases, the eBPF side is represented by maps whose layouts correspond to these generated Go structs; the maps are\
          \ pinned under the directory returned by `pinDirectory()` and updated via a fixed key (`uint32(0)`) using `UpdateAny`.\
          \ The per\u2011worker state is therefore encapsulated in these `*State` structs and manipulated through the `Pebble*State`\
          \ maps in the generated bindings, which correspond to the underlying eBPF maps defined in the `ebpf/*.c` programs."
