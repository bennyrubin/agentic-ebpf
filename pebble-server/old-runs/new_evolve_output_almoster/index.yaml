  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n\t__uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \t__uint(max_entries, 128);\n\t__type(key, __u32);\n\t__type(value, __u32);\n\t__uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n\n/*\n * Design:\n * -------\n * Earlier versions of this\
    \ selector used per-packet randomness to spread\n * traffic evenly across all workers. That balances CPU but still mixes\
    \ short\n * GETs (~10 \xB5s) and long SCANs (~2 ms) on every UDP receive queue, so rare\n * SCANs create head-of-line\
    \ blocking for many queued GETs on a given worker.\n * This shows up as high end-to-end p99 latency at high load, even\
    \ though\n * in-handler latencies look fine.\n *\n * Goals:\n *   - Minimize the time GETs spend queued behind SCANs.\n\
    \ *   - Keep all workers reasonably utilized without new maps or config.\n *   - Stay verifier-friendly: O(1) per packet,\
    \ no loops, minimal state.\n *\n * Approach: static GET / SCAN lane partitioning with multiple SCAN workers.\n * ------------------------------------------------------------------------\n\
    \ * We use the existing pebble_agent_state map (Active workers) and treat the\n * reuseport sockarray indices as two static\
    \ \"lanes\":\n *\n *   - SCAN lane: indices [0, scan_cnt-1].\n *   - GET lane:  indices [scan_cnt, Active-1].\n *\n *\
    \ Lane sizing is chosen to roughly match service-time skew and measured\n * SCAN fraction without overloading any single\
    \ worker:\n *\n *   - If Active == 1:\n *       - Everyone uses slot 0.\n *   - If Active == 2 or 3:\n *       - scan_cnt\
    \ = 1 (one SCAN worker, at least one GET worker).\n *   - If Active >= 4:\n *       - scan_cnt = Active / 2 (about half\
    \ the workers for SCANs).\n *\n * Given GET \u2248 10 \xB5s, SCAN \u2248 2 ms, and SCAN fraction \u2248 0.5%, overall\
    \ CPU\n * time is roughly split between GET and SCAN. Dedicating about half the\n * workers to SCANs and half to GETs:\n\
    \ *\n *   - Prevents the single-SCAN-worker overload seen previously at high load.\n *   - Keeps GETs isolated from SCANs'\
    \ long service times, reducing their\n *     queueing delay and lowering overall p99.\n *\n * For each packet:\n *   1.\
    \ Look up Active workers in pebble_agent_state (fall back to SK_PASS if\n *      missing or zero).\n *   2. Safely parse\
    \ IPv4+UDP headers from sk_reuseport_md::{data,data_end}.\n *   3. Classify the request as SCAN iff the UDP payload starts\
    \ with \"SCAN \"\n *      or \"SCAN\\t\"; everything else (including \"GET ...\") is treated as GET.\n *   4. Choose a\
    \ lane:\n *        - SCANs \u2192 SCAN lane [0, scan_cnt-1].\n *        - Others \u2192 GET lane [scan_cnt, Active-1].\n\
    \ *   5. Within the chosen lane, pick an index using bpf_get_prandom_u32().\n *   6. Call bpf_sk_select_reuseport once\
    \ with that slot.\n *\n * The program is:\n *   - Stateless per packet (no per-flow state, no new maps).\n *   - O(1)\
    \ in work and memory.\n *   - Within verifier limits (no loops, all pointer accesses bounds-checked).\n */\n\nstruct agent_state\
    \ {\n\t__u32 active;\n\t__u32 pad;\n};\n\nstruct {\n\t__uint(type, BPF_MAP_TYPE_ARRAY);\n\t__uint(max_entries, 1);\n\t\
    __type(key, __u32);\n\t__type(value, struct agent_state);\n\t__uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state\
    \ SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n\
    {\n\t__u32 key = 0;\n\tstruct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n\tif (!state)\n\t\t\
    return SK_PASS;\n\n\t__u32 active = state->active;\n\tif (active == 0)\n\t\treturn SK_PASS;\n\n\t/* Safety: never index\
    \ beyond the sockarray size even if misconfigured. */\n\tif (active > 128)\n\t\tactive = 128;\n\n\t/*\n\t * Classify packet\
    \ as SCAN vs non-SCAN by peeking into the UDP payload.\n\t * We assume IPv4+UDP as generated by the workload client. All\
    \ accesses\n\t * are guarded by data_end checks so the verifier can prove safety.\n\t */\n\tint is_scan = 0;\n\n\tvoid\
    \ *data = (void *)(long)reuse->data;\n\tvoid *data_end = (void *)(long)reuse->data_end;\n\n\t/* Need at least 10 bytes\
    \ of IPv4 header to read version/IHL and protocol. */\n\tif ((void *)((__u8 *)data + 10) > data_end)\n\t\tgoto classify_done;\n\
    \n\t__u8 ver_ihl = ((__u8 *)data)[0];\n\t__u8 version = ver_ihl >> 4;\n\t__u8 ihl     = ver_ihl & 0x0F;\n\n\t/* Only handle\
    \ IPv4; anything else falls back to non-SCAN. */\n\tif (version != 4)\n\t\tgoto classify_done;\n\n\t/* IHL is in 32-bit\
    \ words; valid range for IPv4 header is [5, 15]. */\n\tif (ihl < 5 || ihl > 15)\n\t\tgoto classify_done;\n\n\t__u32 ip_header_len\
    \ = (__u32)ihl * 4;\n\n\t/* Ensure the full IPv4 header and UDP header (8 bytes) are present. */\n\tif ((void *)((__u8\
    \ *)data + ip_header_len + 8) > data_end)\n\t\tgoto classify_done;\n\n\t/* Protocol field is at offset 9 of the IPv4 header.\
    \ */\n\t__u8 proto = ((__u8 *)data)[9];\n\t/* 17 == IPPROTO_UDP */\n\tif (proto != 17)\n\t\tgoto classify_done;\n\n\t\
    /* UDP payload starts after the variable-length IPv4 header and 8-byte UDP header. */\n\t{\n\t\t__u8 *udp_payload = (__u8\
    \ *)data + ip_header_len + 8;\n\n\t\t/* We need at least 1 byte to check for leading 'S'. */\n\t\tif ((void *)(udp_payload\
    \ + 1) > data_end)\n\t\t\tgoto classify_done;\n\n\t\tif (udp_payload[0] == 'S') {\n\t\t\t/* We need full \"SCAN \" / \"\
    SCAN\\t\" (5 bytes) to classify as SCAN. */\n\t\t\tif ((void *)(udp_payload + 5) <= data_end &&\n\t\t\t    udp_payload[1]\
    \ == 'C' &&\n\t\t\t    udp_payload[2] == 'A' &&\n\t\t\t    udp_payload[3] == 'N' &&\n\t\t\t    (udp_payload[4] == ' '\
    \ || udp_payload[4] == '\\t')) {\n\t\t\t\tis_scan = 1;\n\t\t\t}\n\t\t}\n\t}\n\nclassify_done:\n\t/*\n\t * Lane selection:\n\
    \t *  - If only one worker is active, everyone goes to slot 0.\n\t *  - If more than one worker:\n\t *      - SCANs  \u2192\
    \ slots [0, scan_cnt-1] (SCAN lane).\n\t *      - others \u2192 slots [scan_cnt, active-1] (GET lane).\n\t *    with scan_cnt\
    \ sized as described in the header comment.\n\t */\n\t__u32 lane_start = 0;\n\t__u32 lane_size  = active;\n\n\tif (active\
    \ > 1) {\n\t\t__u32 scan_cnt;\n\n\t\t/* Give SCANs a reasonable share of workers.\n\t\t * For active >= 4, dedicate about\
    \ half of the workers to SCANs.\n\t\t * For small worker counts, keep at least one SCAN and one GET worker.\n\t\t */\n\
    \t\tif (active >= 4)\n\t\t\tscan_cnt = active / 2;  /* e.g., 6 -> 3 SCAN workers */\n\t\telse\n\t\t\tscan_cnt = 1;   \
    \        /* active == 2 or 3: 1 SCAN worker */\n\n\t\t__u32 get_cnt = active - scan_cnt;\n\t\tif (get_cnt == 0) {\n\t\t\
    \t/* Safety: never route everything to SCAN lane. */\n\t\t\tscan_cnt = active - 1;\n\t\t\tget_cnt = 1;\n\t\t}\n\n\t\t\
    if (is_scan) {\n\t\t\tlane_start = 0;\n\t\t\tlane_size  = scan_cnt;\n\t\t} else {\n\t\t\tlane_start = scan_cnt;\n\t\t\t\
    lane_size  = get_cnt;\n\t\t}\n\t}\n\n\tif (lane_size == 0)\n\t\treturn SK_PASS;\n\n\t__u32 rnd = bpf_get_prandom_u32();\n\
    \t__u32 idx = rnd % lane_size;\n\t__u32 slot = lane_start + idx;\n\n\t/* Single reuseport selection; kernel ignores any\
    \ additional calls. */\n\tbpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n\treturn SK_PASS;\n}\n\n//\
