    idea_payload:
      status: continue
      design_doc:
        goals:
        - Reduce end-to-end p99 latency (especially for GETs) at high offered load by cutting queueing delay in per-socket
          UDP receive buffers.
        - Prevent head-of-line blocking of many fast GETs behind rare slow SCANs on the same worker, while keeping throughput
          near the target rate.
        - 'Keep the selector self-contained in eBPF: no new maps, no additional userspace configuration, and minimal per-packet
          overhead.'
        - Preserve even utilization across reuseport workers for a small number of client flows, avoiding the imbalances seen
          with per-flow hashing.
        evidence:
        - "Server perf logs show traffic evenly spread across all 6 workers and avg_get \u224810\u201311\xB5s, avg_scan \u2248\
          2ms at all loads, with zero errors, confirming that the current per-packet random agent selector is functioning\
          \ and that handler time has not regressed."
        - "Client logs show sent == recv (no loss) but outstanding requests and p99 latency rise sharply with offered load,\
          \ reaching \u224816 ms p99 at 140k req/s, indicating that most delay is incurred before handlers run (i.e., in kernel\
          \ queues) rather than in the synthetic service itself."
        - "Each worker processes ReadFromUDP \u2192 handleRequest \u2192 WriteToUDP sequentially on a single goroutine, so\
          \ every worker is effectively an M/G/1 queue; with ~10\xB5s GETs and ~2ms SCANs, a worker doing a SCAN can accumulate\
          \ dozens of queued GETs behind it at 140k req/s."
        - The current stateless, per-packet random selection ignores per-worker backlog, so under heavy-tailed service times
          it behaves like six independent M/G/1 queues fed randomly; queueing theory predicts large tail latencies in such
          a setup even when overall utilization is moderate.
        - The mismatch between stable in-handler latencies (server-side metrics) and rising end-to-end p99 (client metrics)
          is consistent with growing time spent waiting in per-socket UDP receive queues due to head-of-line blocking behind
          slow SCANs and accumulated GETs.
        architecture:
        - 'Replace pure per-packet random selection with a stateful, per-worker "virtual finish time" model stored in pebble_agent_state:
          for each worker, maintain a u64 timestamp representing the expected completion time of the last request assigned
          to that worker.'
        - "On each packet, estimate its service cost (short vs long) using only information available in sk_reuseport_md (e.g.,\
          \ UDP payload length threshold that separates typical GET vs SCAN sizes), and convert this into a fixed cost in\
          \ nanoseconds (e.g., ~10\xB5s for GET, ~2ms for SCAN)."
        - 'Read active from pebble_agent_state, get now = bpf_ktime_get_ns(), and for workers 0..active-1 compute a predicted
          finish time: finish_i = max(virtual_finish_i, now) + service_cost; choose the worker with the smallest finish_i,
          update its virtual_finish_i = finish_i, and pass that index to bpf_sk_select_reuseport.'
        - 'This turns the six independent M/G/1 queues into an approximate central queue with least-loaded routing: workers
          with many outstanding (especially SCAN) assignments have virtual_finish times far in the future and are avoided
          for new GETs, reducing head-of-line blocking and tail latency.'
        - 'Keep the design self-contained: use only the existing pebble_agent_state map (extended value struct if needed),
          do all state updates from eBPF, and rely solely on the active field seeded by Go at startup; introduce only simple
          integer arithmetic and a bounded loop over active workers.'
        risks:
        - 'Classification accuracy: the design assumes GET and SCAN requests can be reliably distinguished in eBPF using packet
          length (or a similarly cheap heuristic) from sk_reuseport_md; if their size distributions overlap too much, service_cost
          estimation will be noisy and SCANs may not be weighted correctly.'
        - 'Map layout compatibility: pebble_agent_state is currently a small struct with at least an active field; extending
          its value type to hold per-worker virtual finish times must be compatible with how the Go bindings (internal/ebpfutil
          + internal/server/ebpf.go) define and use this map.'
        - "Go interaction: the design assumes that Go seeds pebble_agent_state.active once at startup and does not mutate\
          \ other fields at runtime; if Go also writes into the map later (for example, to change active or reuse fields for\
          \ other policies), it could race with eBPF\u2019s updates."
        - 'Concurrency and races: if the selector can run on multiple CPUs concurrently, unsynchronized read-modify-write
          of per-worker virtual finish timestamps in a single map value may lead to occasional mis-accounting (lost updates);
          this might slightly reduce optimality but should not break correctness, yet it needs to be confirmed/tolerated.'
        - 'Worker count and bounds: the algorithm iterates over [0, active) workers; we need to verify the actual range of
          active (typically 6) and ensure it never exceeds the compile-time capacity we plan for in the struct, to keep verifier-friendly
          bounded loops and avoid out-of-bounds access.'
