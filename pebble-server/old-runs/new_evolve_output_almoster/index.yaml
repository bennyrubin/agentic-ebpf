  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n\n/*\n * Approach\n * --------\n * Tail latency is dominated\
    \ by queueing inside each worker\u2019s UDP socket.\n * Every worker is a single-threaded M/G/1 queue that serves both\
    \ fast GETs\n * (~10 \xB5s) and slow SCANs (~2 ms). When GETs share a worker with SCANs,\n * they experience head-of-line\
    \ blocking behind long SCANs, inflating p99\n * latency even though handler service times are stable.\n *\n * We can\u2019\
    t see kernel queue depths from BPF, but we *can* classify requests\n * cheaply by looking at the first word of the UDP\
    \ payload. The client always\n * sends:\n *\n *   \"GET  key [reqID]\"\n *   \"SCAN start limit [reqID]\"\n *\n * (see\
    \ cmd/workload_client/main.go).\n *\n * This program:\n *\n * 1) Classifies SCAN vs non-SCAN by inspecting only the first\
    \ 4 bytes of\n *    the payload. If they are \"SCAN\", we treat it as a slow request;\n *    otherwise it is treated as\
    \ fast/unknown (GET). This is constant-time,\n *    fully bounds-checked, and verifier-friendly.\n *\n * 2) Splits workers\
    \ into two disjoint pools:\n *\n *      [0 .. fast_workers-1]       : GET/fast pool\n *      [fast_workers .. active-1]\
    \  : SCAN/slow pool\n *\n *    Let `active` be the configured worker count from pebble_agent_state:\n *\n *      - For\
    \ active <= 3: exactly 1 SCAN worker, remaining fast.\n *      - For active >= 4: about half the workers are SCAN workers:\n\
    \ *            scan_workers = active / 2\n *            fast_workers = active - scan_workers\n *\n *    We always ensure:\n\
    \ *      - fast_workers >= 1\n *      - scan_workers >= 1\n *\n *    With the typical 6-worker setup this yields 3 fast\
    \ + 3 scan workers.\n *    Compared to the previous 4-fast/2-scan split, this lowers utilization\n *    on the SCAN pool\
    \ (and thus SCAN p99 and overall p99) while still\n *    isolating GETs from SCAN-induced head-of-line blocking.\n *\n\
    \ * 3) Uses per-packet randomness to avoid hot-spotting:\n *\n *      h = reuse->hash ^ bpf_get_prandom_u32();\n *\n *\
    \    - For SCAN:        slot = fast_workers + (h % scan_workers);\n *    - For GET/unknown: slot = h % fast_workers;\n\
    \ *\n *    This keeps utilization balanced even with a small number of client\n *    flows while ensuring GETs never land\
    \ on SCAN-only workers.\n *\n * 4) Verifier constraints:\n *    - Only existing maps are used: pebble_udp_targets and\
    \ pebble_agent_state.\n *    - Only one call to bpf_sk_select_reuseport.\n *    - No loops in the parser, minimal stack\
    \ usage, and only allowed helpers.\n *    - Behavior is deterministic aside from verifier-approved randomness.\n */\n\n\
    struct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries,\
    \ 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state\
    \ SEC(\".maps\");\n\n/* Return 1 for SCAN, 0 for GET/unknown. */\nstatic __always_inline int classify_scan(struct sk_reuseport_md\
    \ *reuse)\n{\n    unsigned char *data = (unsigned char *)(long)reuse->data;\n    unsigned char *data_end = (unsigned char\
    \ *)(long)reuse->data_end;\n\n    /* Need at least 4 bytes to match \"SCAN\". Otherwise treat as GET. */\n    if (data\
    \ + 4 > data_end)\n        return 0;\n\n    __u8 c0 = data[0];\n    __u8 c1 = data[1];\n    __u8 c2 = data[2];\n    __u8\
    \ c3 = data[3];\n\n    /* Client sends uppercase tokens; detect \"SCAN\". */\n    if (c0 == 'S' && c1 == 'C' && c2 ==\
    \ 'A' && c3 == 'N')\n        return 1;\n\n    /* Everything else (including \"GET\") is treated as non-scan. */\n    return\
    \ 0;\n}\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n    __u32\
    \ key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n       \
    \ return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\n    if (active\
    \ > 128)\n        active = 128;\n\n    __u32 slot = 0;\n\n    if (active == 1) {\n        /* Only one worker; nothing\
    \ to balance. */\n        slot = 0;\n    } else {\n        int is_scan = classify_scan(reuse);\n\n        /*\n       \
    \  * Partition workers into:\n         *   [0 .. fast_workers-1]       : GET/fast pool\n         *   [fast_workers ..\
    \ active-1]  : SCAN/slow pool\n         */\n        __u32 scan_workers;\n\n        if (active <= 3) {\n            /*\
    \ With very few workers, keep exactly one SCAN worker. */\n            scan_workers = 1;\n        } else {\n         \
    \   /* For 4+ workers, dedicate about half to SCANs. */\n            scan_workers = active / 2;\n        }\n\n       \
    \ if (scan_workers >= active)\n            scan_workers = active - 1;\n\n        __u32 fast_workers = active - scan_workers;\
    \ /* >= 1 */\n\n        __u32 rnd = bpf_get_prandom_u32();\n        __u32 h = reuse->hash ^ rnd;\n\n        if (is_scan)\
    \ {\n            /* SCAN: route only within the tail SCAN pool. */\n            __u32 idx = h % scan_workers;\n      \
    \      slot = fast_workers + idx;\n        } else {\n            /* GET/unknown: route only within the fast pool. */\n\
    \            __u32 idx = h % fast_workers;\n            slot = idx;\n        }\n    }\n\n    /* Single reuseport selection;\
    \ kernel ignores additional calls. */\n    bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n    return\
    \ SK_PASS;\n}\n\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
