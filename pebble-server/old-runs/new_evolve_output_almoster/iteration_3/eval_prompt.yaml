  eval_summary: "The agent eBPF program uses a stateless, per-packet random choice (based on reuse->hash ^ bpf_get_prandom_u32())\
    \ to select among 6 reuseport worker sockets, with the active worker count fixed at startup. The client runs with a single\
    \ UDP socket and a pure open\u2011loop rate limiter (no backpressure), sending 99.5% GETs and a small fraction of longer\
    \ SCANs. Each server worker is a single goroutine that loops ReadFromUDP \u2192 handleRequest \u2192 WriteToUDP, so it\
    \ can process only one request at a time; additional packets for that worker queue in the kernel UDP receive buffer. Synthetic\
    \ service times are configured to ~10\xB5s for GET and ~2ms for SCAN. Server perf logs show that traffic is evenly spread\
    \ across workers at all loads, avg_get stays \u224810\u201311\xB5s and avg_scan \u22482ms, and all errors counters are\
    \ zero. Client logs show sent==recv (no missing responses), but outstanding requests and overall p99 latency rise with\
    \ load, culminating in ~16 ms p99 at 140k req/s even though throughput remains near the target rate."
  eval_hypothesis: "The agent eBPF selector is successfully balancing packets across all 6 reuseport workers, but the combination\
    \ of stateless per\u2011packet random routing, strictly serial per\u2011worker processing, and a heavy\u2011tailed service\
    \ mix (very fast GETs vs much slower SCANs) produces significant queueing in the kernel\u2019s per\u2011socket receive\
    \ queues at higher offered load. With one client UDP flow and a pure open\u2011loop sender, each incoming packet is randomly\
    \ assigned to a worker without regard to that worker\u2019s backlog. Each worker then acts as an M/G/1 queue: it processes\
    \ one request at a time with synthetic service times of \u224810\xB5s for GET and \u22482ms for SCAN. Although SCANs are\
    \ only about 0.5% of traffic, at 140k req/s each worker still sees dozens of GETs arriving during the 2ms it spends on\
    \ a SCAN. Because new packets continue to be assigned uniformly at random, some workers will, by chance, spend time in\
    \ states where they are stuck on a SCAN while their socket\u2019s receive queue accumulates many additional GETs. Those\
    \ queued GETs then experience multi\u2011millisecond head\u2011of\u2011line blocking behind the SCAN and the queued GETs\
    \ ahead of them. The server\u2019s avg_get and avg_scan metrics remain near the configured delays because they measure\
    \ only the time spent inside the handler (after ReadFromUDP has dequeued the packet), so they do not capture time spent\
    \ waiting in the kernel socket queue. The client, however, measures full end\u2011to\u2011end latency from send to receive,\
    \ so it sees the growing queueing delay: outstanding request counts climb (hundreds at 140k/s) and the overall p99 latency,\
    \ dominated by GETs and SCANs that happened to land on temporarily overloaded workers, rises from a few milliseconds at\
    \ \u2264100k/s to \u224816 ms at 140k/s. Thus, the observed behavior is best explained by high tail queueing delays induced\
    \ by stateless random worker selection over serial workers with a skewed GET/SCAN service\u2011time distribution, not\
    \ by any imbalance or failure in the eBPF selection itself."
