  idea_payload:
    status: finish
    design_doc:
      goals:
      - Reduce end-to-end p99 latency at high offered load (especially for GETs) by shrinking queueing delay in per-socket
        UDP receive buffers.
      - Avoid head-of-line blocking where many fast GETs sit behind rare slow SCANs on the same worker, while keeping total
        throughput near the target rate.
      - 'Keep the selector fully self-contained in eBPF: use only AgentUDPSelector, the existing pebble_udp_targets and pebble_agent_state
        maps, no new maps, and no additional userspace configuration.'
      - Preserve good utilization across reuseport workers even with a small number of client flows, avoiding both hot spots
        and idle workers.
      evidence:
      - "Server-side perf logs show that traffic is evenly spread across all workers with the current agent selector; avg_get\
        \ \u2248 10\u201311 \xB5s and avg_scan \u2248 2 ms remain stable across loads, and error counters are zero. This indicates\
        \ that eBPF-based load-balancing itself is working and handler service times are as configured."
      - "Client logs show sent == recv but outstanding requests and overall p99 latency increase sharply with load, up to\
        \ \u224816 ms p99 at 140k req/s. This gap between stable in-handler times and rising end-to-end latency implies most\
        \ delay is in kernel socket queues, not in application processing."
      - "Each worker is a single goroutine running ReadFromUDP \u2192 handleRequest \u2192 WriteToUDP, so each UDP socket\
        \ behaves as an M/G/1 queue. With ~10 \xB5s GETs and ~2 ms SCANs, a worker that is busy on a SCAN at 140k req/s can\
        \ accumulate dozens of queued GETs behind it, producing multi-millisecond queueing for unlucky GETs."
      - 'The current agent program picks a worker per packet using stateless random choice (reuse->hash xor bpf_get_prandom_u32).
        This ignores worker backlog: packets keep being assigned uniformly even to a worker that is currently occupied with
        a SCAN and already has many queued requests.'
      - 'Request formats from cmd/workload_client/main.go are fixed ASCII commands beginning at the UDP payload: GET requests
        are exactly "GET <key> <reqID>", SCAN requests "SCAN <key> <scanLimit> <reqID>". Both are short (tens of bytes), and
        the first token is a reliable discriminator between GET and SCAN.'
      - "Go only writes pebble_agent_state once at startup for the agent policy (it sets the Active field based on the worker\
        \ count) and never touches it again. This leaves the map effectively under eBPF\u2019s exclusive control during runtime,\
        \ aside from the initial Active value."
      - Other selectors (round_robin, hash, scan_split) use similar state maps keyed by 0 with small structs (Active, Counter,
        etc.) and manage more complex behavior purely in eBPF, confirming that maintaining modest per-policy state in maps
        is a feasible pattern here.
      architecture:
      - "State model: Extend the existing pebble_agent_state value struct (key 0) to hold a small fixed-size array of per-worker\
        \ virtual finish times in addition to the existing Active field. Conceptually: `struct agent_state { __u32 active;\
        \ __u32 pad; __u64 finish[MAX_WORKERS]; }`, where MAX_WORKERS is a small compile-time constant (e.g., 32) \u2265 the\
        \ maximum expected worker count. Go continues to set only Active at startup; all finish[] entries start at 0 and are\
        \ maintained exclusively by the eBPF program."
      - "Request classification: In AgentUDPSelector, use sk_reuseport_md\u2019s data/data_end pointers to locate the UDP\
        \ payload and read its first few bytes. If the payload begins with \"GET \" (i.e., 'G','E','T',' '), classify as a\
        \ GET; if it begins with \"SCAN\" followed by space or end-of-payload, classify as a SCAN. If parsing fails (packet\
        \ too short, unexpected prefix), conservatively treat it as a GET to avoid over-penalizing unknown traffic. This uses\
        \ the exact request formats already enforced by the Go client."
      - "Service cost estimation: Map the classified type to a fixed synthetic service cost in nanoseconds, encoded as constants\
        \ in the eBPF program (no userspace configuration). For this workload, start with GET_COST_NS \u2248 10,000 (10 \xB5\
        s) and SCAN_COST_NS \u2248 2,000,000 (2 ms). These reflect the server\u2019s configured busy-wait delays and can be\
        \ tweaked in code if future profiling suggests better values."
      - 'Virtual finish-time scheduling: On each packet, look up agent_state, read `active`, and bound it to MAX_WORKERS.
        Get the current time `now = bpf_ktime_get_ns()`. For each worker index i in [0, active): compute `base_i = (finish[i]
        < now) ? now : finish[i]`, then `candidate_finish_i = base_i + service_cost`. Select the index best_i whose `candidate_finish_i`
        is minimal. After the loop, update `finish[best_i] = candidate_finish_i` in-place. This turns the group of independent
        M/G/1 queues into an approximation of a single central queue with least-virtual-finish-time routing: workers that
        have just been assigned a SCAN (large service_cost) will have finish[i] far into the future and will be avoided for
        subsequent GETs until their virtual backlog clears.'
      - 'Worker selection: Pass best_i as the slot index to `bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0)`,
        just as the current agent program does with its random slot. The pebble_udp_targets map remains the sole source of
        worker FDs, seeded by Go at startup and not modified thereafter.'
      - "Algorithmic properties: The per-packet work is O(active) but with a small bound (e.g., \u2264 6 in current experiments).\
        \ The computation for each worker is simple integer arithmetic and a couple of branches. The only stateful component\
        \ is the finish[] array; there is no need for additional maps, locks, or per-flow state. Under the current GET-heavy\
        \ mix, this design strongly prefers to place SCANs on the currently least-loaded worker and prevents new GETs from\
        \ being routed to a worker whose virtual backlog is already dominated by a SCAN, directly addressing the observed\
        \ head-of-line blocking."
      risks:
      - "UDP payload parsing details: AgentUDPSelector must correctly locate the UDP payload from sk_reuseport_md\u2019s data\
        \ pointer, accounting for IPv4/IPv6 and any L2 headers present in this environment. The design assumes we can safely\
        \ reach the application payload (\"GET\"/\"SCAN\") with a small fixed set of header parsing steps, ideally mirroring\
        \ what the existing scan_split selector does. If these offsets are incorrect, classification could fail or, worse,\
        \ read out-of-bounds; this needs to be carefully implemented and verified against the current packet layout."
      - "Workload coupling of service costs: The embedded GET_COST_NS and SCAN_COST_NS are tuned for the current synthetic\
        \ delays (\u224810 \xB5s and \u22482 ms). If the server\u2019s configured delays change significantly or new request\
        \ types are added, these constants may no longer reflect true service times; the scheduler will still function but\
        \ could become suboptimal (e.g., over- or under-penalizing SCANs), affecting tail latency improvements."
      - 'State layout and Go bindings: Extending the agent_state struct with the finish[] array changes the map value size
        and thus the generated Go type (ebpfutil.AgentSelectorAgentState). The current Go code only writes Active once at
        startup and ignores other fields, which is compatible with adding new fields. However, this requires regenerating
        ebpfutil bindings and ensuring that no other Go code assumes a different struct size or layout.'
      - "Concurrent updates: On multi-core systems, AgentUDPSelector may run concurrently on multiple CPUs, all reading and\
        \ updating the same agent_state value. Without explicit synchronization (e.g., BPF spin locks), there can be lost\
        \ updates: one CPU may overwrite another\u2019s newer finish[] modifications. For this algorithm, such races degrade\
        \ the optimality of scheduling but should not affect correctness; they effectively inject some noise into the virtual\
        \ finish times. We need to confirm that this approximate behavior is acceptable and does not produce pathological\
        \ cases under the expected traffic patterns."
      - 'Bounded worker count: The loop over workers in eBPF must be statically bounded to satisfy the verifier, so MAX_WORKERS
        must be a compile-time constant greater than or equal to the maximum worker count used in practice (currently 6 in
        evaluation). The code must clamp `active` to MAX_WORKERS to avoid out-of-bounds access. If future configurations increase
        the number of workers beyond MAX_WORKERS without updating the constant, some workers would be ignored by the scheduler,
        which could reintroduce imbalance.'
      - 'Protocol assumptions: The design assumes that all relevant traffic to this UDP port uses the same "GET"/"SCAN" ASCII
        protocol as implemented in cmd/workload_client. If different traffic (e.g., health checks, other message types) appears,
        the classification will treat them as GET by default. This is safe but may slightly distort the load model, especially
        if those messages have very different processing costs.'
