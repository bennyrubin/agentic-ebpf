    code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n#include <bpf/bpf_endian.h>\n#include\
      \ <linux/if_ether.h>\n#include <linux/ip.h>\n#include <linux/udp.h>\n#include <linux/in.h>\n\nstruct {\n\t__uint(type,\
      \ BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\t__uint(max_entries, 128);\n\t__type(key, __u32);\n\t__type(value, __u32);\n\t\
      __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n\n/*\n * Design:\n\
      \ * -------\n * The primary latency problem is queueing: rare, long SCANs (~2 ms) share\n * per-socket UDP receive queues\
      \ with very short GETs (~10 \xB5s). With a\n * stateless random selector, each worker behaves like an M/G/1 queue that\n\
      \ * mixes both request types, so occasional SCANs cause head-of-line blocking\n * for many queued GETs, inflating end-to-end\
      \ p99 latency.\n *\n * Goals:\n *   - Steer SCANs away from GETs to avoid mixed queues.\n *   - Keep workers reasonably\
      \ utilized without extra maps or config.\n *   - Remain verifier-friendly: O(1) per packet, no loops, minimal state.\n\
      \ *\n * Approach:\n *   - Use the existing pebble_agent_state map to learn the number of active\n *     reuseport workers\
      \ (Active).\n *   - Statistically partition the reuseport sockarray indices into two lanes:\n *\n *       * SCAN lane:\
      \ indices [0, scan_cnt-1]\n *       * GET lane:  indices [scan_cnt, Active-1]\n *\n *     with scan_cnt sized as:\n\
      \ *       * Active == 1:   scan_cnt = 1 (single mixed worker).\n *       * Active == 2/3: scan_cnt = 1 (one SCAN worker,\
      \ at least one GET).\n *       * Active >= 4:   scan_cnt = Active / 2 (about half workers for SCANs).\n *\n *   - Parse\
      \ L2+L3+L4 headers from sk_reuseport_md::{data,data_end}:\n *       Ethernet \u2192 IPv4 \u2192 UDP \u2192 payload.\n\
      \ *   - Classify a packet as SCAN iff the UDP payload starts with \"SCAN \"\n *     or \"SCAN\\t\". Everything else\
      \ is treated as GET/other.\n *   - Only apply lane partitioning when classification is valid; otherwise,\n *     fall\
      \ back to using all workers uniformly. This prevents accidental\n *     capacity loss if parsing fails (e.g., non-Ethernet/IPv6).\n\
      \ *   - Within the chosen lane, pick a worker index using bpf_get_prandom_u32().\n *   - Call bpf_sk_select_reuseport\
      \ once with that slot.\n *\n * This isolates GETs from SCANs' long service times, keeps total worker\n * capacity roughly\
      \ matched to their CPU shares, and remains fully stateless\n * and verifier-friendly.\n */\n\nstruct agent_state {\n\
      \t__u32 active;\n\t__u32 pad;\n};\n\nstruct {\n\t__uint(type, BPF_MAP_TYPE_ARRAY);\n\t__uint(max_entries, 1);\n\t__type(key,\
      \ __u32);\n\t__type(value, struct agent_state);\n\t__uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state SEC(\"\
      .maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n\t\
      __u32 key = 0;\n\tstruct agent_state *state;\n\t__u32 active;\n\tint is_scan = 0;\n\tint classification_valid = 0;\n\
      \n\tvoid *data;\n\tvoid *data_end;\n\tstruct ethhdr *eth;\n\tstruct iphdr *iph;\n\tvoid *l4;\n\tstruct udphdr *uh;\n\
      \t__u8 *udp_payload;\n\t__u32 ihl;\n\n\t__u32 lane_start;\n\t__u32 lane_size;\n\t__u32 rnd;\n\t__u32 idx;\n\t__u32 slot;\n\
      \t__u32 scan_cnt;\n\t__u32 get_cnt;\n\n\tstate = bpf_map_lookup_elem(&pebble_agent_state, &key);\n\tif (!state)\n\t\t\
      return SK_PASS;\n\n\tactive = state->active;\n\tif (active == 0)\n\t\treturn SK_PASS;\n\n\t/* Safety: never index beyond\
      \ the sockarray size even if misconfigured. */\n\tif (active > 128)\n\t\tactive = 128;\n\n\t/*\n\t * Classify packet\
      \ as SCAN vs non-SCAN by peeking into the UDP payload.\n\t * We assume Ethernet + IPv4 + UDP as generated by the workload\
      \ client.\n\t * All accesses are guarded by data_end checks for verifier safety.\n\t */\n\tdata = (void *)(long)reuse->data;\n\
      \tdata_end = (void *)(long)reuse->data_end;\n\n\t/* Parse Ethernet header. */\n\teth = data;\n\tif ((void *)(eth + 1)\
      \ > data_end)\n\t\tgoto classify_done;\n\n\tif (bpf_ntohs(eth->h_proto) != ETH_P_IP)\n\t\tgoto classify_done;\n\n\t\
      /* Parse IPv4 header. */\n\tiph = (void *)(eth + 1);\n\tif ((void *)(iph + 1) > data_end)\n\t\tgoto classify_done;\n\
      \n\tif (iph->protocol != IPPROTO_UDP)\n\t\tgoto classify_done;\n\n\tihl = iph->ihl;\n\tif (ihl < 5 || ihl > 15)\n\t\t\
      goto classify_done;\n\n\tl4 = (void *)((__u8 *)iph + ihl * 4);\n\tuh = (struct udphdr *)l4;\n\tif ((void *)(uh + 1)\
      \ > data_end)\n\t\tgoto classify_done;\n\n\t/* UDP payload starts after UDP header. */\n\tudp_payload = (__u8 *)(uh\
      \ + 1);\n\n\t/* Need at least 1 byte to check for leading 'S'. */\n\tif ((void *)(udp_payload + 1) > data_end)\n\t\t\
      goto classify_done;\n\n\tclassification_valid = 1;\n\n\tif (udp_payload[0] == 'S') {\n\t\t/* Need full \"SCAN \" / \"\
      SCAN\\t\" (5 bytes) to classify as SCAN. */\n\t\tif ((void *)(udp_payload + 5) <= data_end &&\n\t\t    udp_payload[1]\
      \ == 'C' &&\n\t\t    udp_payload[2] == 'A' &&\n\t\t    udp_payload[3] == 'N' &&\n\t\t    (udp_payload[4] == ' ' || udp_payload[4]\
      \ == '\\t')) {\n\t\t\tis_scan = 1;\n\t\t}\n\t}\n\nclassify_done:\n\t/*\n\t * Lane selection:\n\t *  - If only one worker\
      \ is active, everyone goes to slot 0.\n\t *  - If more than one worker:\n\t *      * When classification failed, fall\
      \ back to using all workers.\n\t *      * When classification succeeded:\n\t *          - SCANs  \u2192 slots [0, scan_cnt-1]\
      \   (SCAN lane).\n\t *          - others \u2192 slots [scan_cnt, active-1] (GET lane).\n\t */\n\tlane_start = 0;\n\t\
      lane_size  = active;\n\n\tif (active > 1) {\n\t\tif (!classification_valid) {\n\t\t\t/* Parsing failed: use all workers\
      \ uniformly. */\n\t\t\tlane_start = 0;\n\t\t\tlane_size  = active;\n\t\t} else {\n\t\t\t/* Allocate workers to SCAN\
      \ lane. */\n\t\t\tif (active >= 4)\n\t\t\t\tscan_cnt = active / 2;  /* e.g., 6 -> 3 SCAN workers */\n\t\t\telse\n\t\t\
      \t\tscan_cnt = 1;           /* active == 2 or 3 */\n\n\t\t\tget_cnt = active - scan_cnt;\n\t\t\tif (get_cnt == 0) {\n\
      \t\t\t\t/* Safety: always keep at least one GET worker. */\n\t\t\t\tscan_cnt = active - 1;\n\t\t\t\tget_cnt = 1;\n\t\
      \t\t}\n\n\t\t\tif (is_scan) {\n\t\t\t\tlane_start = 0;\n\t\t\t\tlane_size  = scan_cnt;\n\t\t\t} else {\n\t\t\t\tlane_start\
      \ = scan_cnt;\n\t\t\t\tlane_size  = get_cnt;\n\t\t\t}\n\t\t}\n\t}\n\n\tif (lane_size == 0)\n\t\treturn SK_PASS;\n\n\t\
      rnd = bpf_get_prandom_u32();\n\tidx = rnd % lane_size;\n\tslot = lane_start + idx;\n\n\t/* Single reuseport selection;\
      \ kernel ignores any additional calls. */\n\tbpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n\treturn\
      \ SK_PASS;\n}\n\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
