  idea_payload:
    status: finish
    design_doc:
      goals:
      - Reduce client-observed p99 latency (especially for GETs) at high load by minimizing time spent queued behind slow
        SCAN requests in per-socket UDP receive queues.
      - Keep all reuseport workers reasonably utilized while avoiding pathological per-worker queue build-up, even with a
        single client UDP flow and an open-loop sender.
      - Exploit the GET/SCAN service-time skew by steering SCANs away from GETs via simple, static lane partitioning using
        only existing maps (pebble_udp_targets, pebble_agent_state) and no extra user-space configuration.
      - 'Maintain a verifier-friendly, stateless-per-packet selector: O(1) work per packet, no per-flow state, and no new
        BPF maps beyond the existing pebble_agent_state.'
      evidence:
      - "Server perf logs with the current agent selector show even packet distribution across all 6 workers and stable in-handler\
        \ latencies (avg_get \u224810\u201311 \xB5s, avg_scan \u22482 ms) with zero errors, confirming that basic load-balancing\
        \ and handler behavior are correct."
      - Client logs show sent==recv but outstanding requests and overall p99 latency rise sharply with load, reaching ~16
        ms p99 at 140k req/s, indicating that delays are dominated by queueing outside the handler (kernel UDP receive queues).
      - "With per-packet stateless random routing over 6 workers, each worker behaves as an independent M/G/1 queue. Given\
        \ GET\u224810 \xB5s, SCAN\u22482 ms, and SCAN fraction\u22480.5%, SCANs and GETs each consume roughly half of the\
        \ CPU time (0.995\xD71 + 0.005\xD7200 \u2248 2), so occasional SCANs can cause large head-of-line blocking for many\
        \ queued GETs on the same worker."
      - "The client\u2019s end-to-end measurements expose the heavy queueing tails, whereas server-side metrics measure only\
        \ time inside handleRequest (post-ReadFromUDP) and therefore do not capture kernel queue delays."
      - Code inspection confirms that pebble_udp_targets is densely populated with worker fds at indices 0..workers-1, and
        pebble_agent_state.Active is set once at startup to the exact worker count, giving the selector a reliable active
        worker range.
      - "cmd/workload_client always emits ASCII payloads starting with exact prefixes \"GET \" or \"SCAN \", so the eBPF selector\
        \ can reliably classify request type by inspecting only the first 4\u20135 bytes of the packet."
      architecture:
      - Retain a single sk_reuseport/selector program AgentUDPSelector that reads pebble_agent_state[0].Active as the active
        worker count (clamped to the sockarray max) and never modifies the state map, keeping the selector effectively stateless
        per packet.
      - On each packet, safely read the first few bytes from sk_reuseport_md->data/data_end and classify the request as GET
        if the payload begins with "GET " (0x47 0x45 0x54 0x20), as SCAN if it begins with "SCAN " (0x53 0x43 0x41 0x4e 0x20),
        and otherwise treat it as GET-like for routing purposes.
      - 'Deterministically partition the [0, active) worker index space into two contiguous lanes based solely on active:
        let scan_workers = active / 2 (integer division) and get_workers = active - scan_workers; if 0 < scan_workers < active,
        define SCAN lane = [get_workers, active) and GET lane = [0, get_workers), otherwise fall back to a single unified
        lane [0, active) with no type-based split.'
      - 'For each packet, derive a mixed pseudo-random value from reuse->hash and bpf_get_prandom_u32(), optionally run through
        a simple linear congruential step, and choose a slot uniformly within the appropriate lane: for GET-like traffic,
        index = mixed % get_workers; for SCAN, index = get_workers + (mixed % scan_workers); when lanes are disabled, index
        = mixed % active.'
      - Invoke bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &index, 0) exactly once per packet and return SK_PASS,
        letting the kernel reuseport logic honor the chosen worker while preserving per-packet statelessness and even distribution
        within each lane.
      risks:
      - Static 50/50 lane partitioning (scan_workers = active / 2) is tuned to the observed workload where GET and SCAN consume
        roughly equal total CPU despite very different frequencies. If the GET/SCAN mix or relative service times change significantly
        (e.g., many more SCANs or much slower SCANs), this split could under- or over-provision the SCAN lane, increasing
        either SCAN or GET queueing.
      - For configurations with very few workers (e.g., active=2), an even split means only one GET worker, which can be close
        to saturation at high total request rates; the design optimizes mainly for the evaluated 6-worker configuration and
        may show higher tails at extreme loads with small worker counts.
      - The selector assumes all current operations are either GET or SCAN and defaults unknown prefixes into the GET lane.
        If new, slower operation types are introduced without updating the classifier, they may be misrouted into the GET
        lane and reintroduce head-of-line blocking for GETs.
      - The design relies on safe access to packet payload in the sk_reuseport_md context via data/data_end. While this is
        standard for reuseport programs, any kernel or verifier differences that restrict payload access would require simplifying
        the classifier or reverting to hash-only selection.
      - Because no per-worker queue information is available and no runtime feedback is used, the selector cannot react to
        transient load imbalances or hotspots within a lane; it only reduces cross-type interference by separating GET and
        SCAN queues, but residual tail latency from random arrival bursts within each lane will still exist.
