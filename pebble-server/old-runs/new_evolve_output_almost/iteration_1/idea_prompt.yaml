idea_agent_prompt: "You are an expert in high-performance Linux UDP servers that load-balance traffic with SO_REUSEPORT and\
  \ a custom sk_reuseport eBPF program. The traffic comes in as short GET requests and longer SCAN requests with 99.5% of\
  \ the workload being GETs. Study the supplied artifacts (current eBPF implementation, run metrics, short codebase summary,\
  \ performance summary, and performance explanation hypothesis.) to understand how the system actually behaved and why. From\
  \ that understanding, produce a draft design document for a next-generation eBPF selector that improves on the observed\
  \ problems. Additionally, be creative, trying new, potentially drastic different approaches, when you believe it will improve\
  \ performance. Avoid speculation, note uncertainties, and assume reuseport slots, worker sockets, and database wiring are\
  \ correctly configured in the application.\n\nGuidelines:\n- Be precise, concise, and evidence-backed. Mark unknowns as\
  \ uncertain.\n- Always use the simplest possible solution, unless necessary to add more complexity to achieve the goal.\
  \ For example, don't introduce state or a map unless it is the only way to achieve the goal. Don't add complicated math\
  \ or algorithms or branching unless necessary.\n- For now, do not focus on fallbacks or error handling, nor logging to ensure\
  \ correctness.\n- Set \"status\": \"finish\" once you no longer need additional codebase information. Return \"continue\"\
  \ only when you truly need RAG answers to refine the design.\n- Questions must target codebase details you cannot infer\
  \ yet (e.g., \"In workload/client.go, how many sender threads are spawned?\"). The questions should be directly related\
  \ to the codebase and not abstract. Never repeat answered questions or ask about artifacts already provided. For example,\
  \ do not ask about the eBPF programs or logs that you already have access to and the RAG codebase knows nothing about.\n\
  - For now, do not include code that requires any configuration in userspace. The eBPF program should be self-contained.\
  \ You may include constant hyperparameters in the code, that you must tune yourself.\n- Do not worry about the selector\
  \ logic. You only need to use AgentUDPSelector and can change state in the pebble_agent_state map, but may not create a\
  \ new map.\n\nOutput strict JSON:\n{\n  \"status\": \"continue|finish\",\n  \"design_doc\": {\n    \"goals\": [\"clear goals\
  \ tied to observed issues\"],\n    \"evidence\": [\"key supporting observations from the hypothesis and performance summary\"\
  ],\n    \"architecture\": [\"specific approach that should be taken by the eBPF program. Do not include code, only a text,\
  \ design level idea/thought. Keep it to a few lines.\"],\n    \"risks\": [\"open questions or assumptions to verify from\
  \ the codebase\"]\n  },\n  \"questions\": [\"<=5 precise, code-focused RAG queries needed to finalize the design\"]\n}\n\
  \nRun context:\nEvaluation summary: Across agent-* runs, the server is a UDP SO_REUSEPORT service with 6 workers and an\
  \ eBPF SK_REUSEPORT program (agent_udp_selector) that does static per-flow hashing onto a fully populated BPF_REUSEPORT_SOCKARRAY.\
  \ The synthetic 'DB' is just busy-wait delays (10\xB5s GET, 2ms SCAN). The client is open\u2011loop: it sends at a fixed\
  \ rate for 7s using multiple UDPConns (one per send worker), each with its own 4\u2011tuple. For each packet, the eBPF program\
  \ looks up pebble_agent_state.Active (set once to 6) and picks a starting slot = reuse->hash % 6, then uses bpf_sk_select_reuseport\
  \ to choose that slot; since helper success is assumed, all packets of one 4\u2011tuple land on the same worker index for\
  \ the whole run. updateTargetsMap is called once per worker index, so pebble_udp_targets[0..5] are correctly filled with\
  \ the 6 socket FDs. startStatsLogger prints per\u2011worker '[perf]' lines only for workers that handled >0 requests in\
  \ that second. In the logs, throughput scales to ~50k, 60k, then ~80k req/s with no loss, while p99 latency rises modestly\
  \ (to ~15ms). At 100k and 140k offered load, client\u2011side outstanding counts explode and many responses are never seen,\
  \ while server\u2011side avg_get and avg_scan remain at ~10\xB5s and ~2ms. Per\u2011second server totals flatten at ~75\u2013\
  85k gets/s and never reach the offered 100k/140k, and the number of workers that show non\u2011zero traffic in a given second\
  \ is smaller than 6 and varies across runs, consistent with a small number of client flows being randomly hashed onto worker\
  \ indices.\nEvaluation hypothesis: The behavior is best explained by a CPU\u2011limited, per\u2011flow\u2013sharded UDP\
  \ server driven by an open\u2011loop client, combined with a static hash\u2011based eBPF selector that pins each client\
  \ UDP flow to a single worker socket.\n\nMechanically: each server worker owns its own UDP socket (SO_REUSEPORT) and runs\
  \ a loop of ReadFromUDP -> handleRequest -> WriteToUDP. handleRequest busy\u2011waits for getDelay or scanDelay and records\
  \ only that service time. The eBPF agent_udp_selector, configured via loadAgent, sets pebble_agent_state.Active = 6 once\
  \ at startup and never changes it. Server startup populates pebble_udp_targets[0..5] with the 6 worker FDs via updateTargetsMap.\
  \ For every incoming packet, the program takes the kernel\u2011provided reuse->hash, computes start = hash % 6, and calls\
  \ bpf_sk_select_reuseport with that slot; under the given assumption that this helper always succeeds, all packets for a\
  \ given 4\u2011tuple are routed to the same slot (worker index) across the run.\n\nOn the client side, each send worker\
  \ creates its own UDPConn via net.DialUDP and has its own recv goroutine with a 5s read deadline. Although the top\u2011\
  level scripts don\u2019t explicitly show how many send workers are used, the per\u2011worker request counts (e.g., some\
  \ workers consistently seeing about 2\xD7 the gets of others, and only a subset of workers showing any traffic in a second)\
  \ are exactly what you would expect from a small set of independent flows, each carrying roughly equal traffic, being hashed\
  \ into 6 buckets. The specific subset of workers that are active in a run (all 6 at 50k, 5 at 60k, ~4 at 80\u2013100k, 3\
  \ at 140k) is thus a property of how those few client flows hashed for that run, not something the 'agent' is dynamically\
  \ adjusting.\n\nCapacity-wise, each request consumes CPU time equal to the configured busy\u2011wait (\u224810\xB5s for\
  \ GET, 2ms for SCAN). With ~99% GET and ~1% SCAN, the average CPU cost is ~30\xB5s per request. Given the number of server\
  \ cores available via run.sh\u2019s CPU pinning (SERVER_CORES from run_exp.py), the aggregate service capacity is on the\
  \ order of only ~80k requests/s. This matches the plateau seen in the server logs: at target rates of 50k, 60k, and 80k,\
  \ the per\u2011interval '[perf] interval=1s gets=\u2026' totals closely track the target rates, avg_get and avg_scan stay\
  \ near their synthetic delays, and the client sees no loss with small outstanding queues and modest p99 (a few milliseconds,\
  \ dominated by SCANs and light queueing).\n\nWhen the client pushes 100k and then 140k req/s, it becomes open\u2011loop\
  \ overload: the offered rate exceeds the CPU\u2011bound service rate. Because the client does not adapt to response latency,\
  \ it continues injecting packets at the target rate while each busy worker can only retire requests at the CPU\u2011limited\
  \ pace. Packets accumulate in per\u2011socket receive queues on those workers that own hashes for the active client flows.\
  \ The queueing delay between packet arrival and the start of handleRequest grows into seconds. Server\u2011side metrics\
  \ still show avg_get\u224810\xB5s and avg_scan\u22482ms, because they intentionally measure only the busy\u2011wait segment,\
  \ not the time spent waiting in the socket queue. Client\u2011side latencies, however, include that queueing and balloon:\
  \ the measured p99 rises to ~3.4s at 100k and ~5s at 140k. At the same time, per\u2011second server throughput saturates\
  \ around 75\u201385k gets/s and no higher, confirming a hard capacity ceiling.\n\nAs backlog grows, kernel\u2011level UDP\
  \ buffers or client\u2011side resources eventually overflow or time out. The recv goroutines have a fixed 5s read deadline;\
  \ packets that are delayed beyond that or dropped in the network stack never contribute a latency sample. By the end of\
  \ the 100k run, the client has sent 695k requests but only received ~632k responses (\u22489% missing); at 140k, it sends\
  \ ~973k but receives only ~689k (\u224829% missing). These missing responses correspond to datagrams that were either dropped\
  \ before the server could process them or whose replies arrived after the client had given up waiting.\n\nThe eBPF agent\
  \ policy, as currently implemented, does not introduce dynamic load awareness or per\u2011request steering based on worker\
  \ queue depth or CPU usage; it is effectively a simple hash\u2011based sharding over a fixed active set of 6 targets. It\
  \ does, however, interact with the small number of client flows: because each flow is pinned to a single worker, and there\
  \ are relatively few flows compared to the 6 available workers, some workers receive more flows (and thus more traffic)\
  \ while others may see none during the run. This explains why only a subset of workers appear in the perf logs for a given\
  \ run and why some have roughly double the per\u2011second gets of others. That imbalance shapes which sockets\u2019 queues\
  \ grow fastest when the system is overloaded, but the dominant effect on latency and drops is the CPU\u2011bounded service\
  \ capacity versus the higher open\u2011loop offered load, not any misconfiguration of the reuseport array or dynamic changes\
  \ in 'active'.\nBest program metrics: policy=agent, rates=[50000, 60000, 80000, 100000, 140000], load_p99_curve=[(50000.0,\
  \ 2.638), (60000.0, 4.239), (80000.0, 15.001), (100000.0, 3391.989), (140000.0, 4957.632)], load_p99_stddev_curve=[(50000.0,\
  \ 0.0), (60000.0, 0.0), (80000.0, 0.0), (100000.0, 0.0), (140000.0, 0.0)], compile=1.0, load=1.0, combined_score=-20128.910499999998,\
