    - question: |-
        In internal/server/ebpf.go, does updateTargetsMap for the 'agent' policy always populate pebble_udp_targets with exactly one unique socket FD per worker index [0..workers-1], or is there any logic that can skip some indices or duplicate FDs?
      answer:
        answer: "There is no logic in internal/server/ebpf.go that guarantees \u201Cexactly one unique socket FD per worker\
          \ index [0..workers-1]\u201D for the agent policy, nor any logic here that explicitly skips indices or prevents\
          \ duplicates.\n\nThe only related helper, updateTargetsMap, is a very thin wrapper: it loads the pinned map at the\
          \ single path used for pebble_udp_targets, and then updates the entry for the provided slot key with the given fd\
          \ value using ebpf.UpdateAny. It does not:\n- enforce that every index in [0..workers-1] is written,\n- prevent\
          \ the same fd from being written into multiple indices, or\n- check for gaps or uniqueness at all.\n\nSimilarly,\
          \ clearTargets just iterates from 0 to numSlots-1 and deletes keys if present; it doesn\u2019t enforce any particular\
          \ re\u2011population pattern either. The agent-specific setup in loadAgent only configures the AgentState map (setting\
          \ the Active worker count) and does not touch pebble_udp_targets at all.\n\nSo, from this file alone, updateTargetsMap\
          \ can be called in any pattern: some indices might never be updated, some might be updated multiple times, and multiple\
          \ indices may share the same fd. Any higher\u2011level logic to ensure one unique FD per worker index would have\
          \ to live outside this file."
