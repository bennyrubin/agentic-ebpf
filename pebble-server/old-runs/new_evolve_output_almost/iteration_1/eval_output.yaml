    question_answers:
    - question: |-
        In cmd/workload_client/main.go, does each send worker create and use its own UDPConn (with a distinct local port), or do all send workers share a single UDP socket for sending and receiving?
      answer:
        answer: "Each send worker creates and uses its own UDPConn. Inside the worker-creation loop, a separate net.DialUDP\
          \ call is made for each worker index i, and the resulting conn is passed only to that worker\u2019s send goroutine\
          \ and the corresponding receive goroutine. There is no shared UDPConn across workers; each worker pair (send/recv)\
          \ uses its own socket (and thus its own local port)."
        code_snippets:
        - path: |-
            cmd/workload_client/main.go
          snippet: "conn, err := net.DialUDP(\"udp\", nil, udpAddr)\n\t\tif err != nil {\n\t\t\tlogger.Fatalf(\"dial udp worker=%d:\
            \ %v\", i, err)\n\t\t}\n\t\tdefer conn.Close()\n\n\t\tseed := time.Now().UnixNano() + int64(i)\n\t\trng := rand.New(rand.NewSource(seed))\n\
            \n\t\tworkerID := i\n\n\t\tsendWG.Add(1)\n\t\tgo func(workerID int, conn *net.UDPConn, rng *rand.Rand) { ... }(workerID,\
            \ conn, rng)\n\n\t\trecvWG.Add(1)\n\t\tgo func(workerID int, conn *net.UDPConn) { ... }(workerID, conn)"
        - path: |-
            cmd/workload_client/main.go
          snippet: "go func(workerID int, conn *net.UDPConn) {\n\t\t\tdefer recvWG.Done()\n\t\t\tbuf := make([]byte, 64*1024)\n\
            \t\t\t// Set read deadline once to avoid blocking forever\n\t\t\tconn.SetReadDeadline(time.Now().Add(5 * time.Second))\n\
            \t\t\tfor {\n\t\t\t\tn, err := conn.Read(buf)\n\t\t\t\t// ...\n\t\t\t}\n\t\t}(workerID, conn)"
