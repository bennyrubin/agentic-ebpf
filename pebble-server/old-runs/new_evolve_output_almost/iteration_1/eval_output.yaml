    - question: "In run.sh (resolve_cpu_pool and related logic), how are SERVER_CPUSET and CLIENT_CPUSET chosen from the available\
        \ CPUs\u2014for example, does the script always split the CPU pool evenly between server and client processes?"
      answer:
        answer: "SERVER_CPUSET and CLIENT_CPUSET are taken as consecutive slices from a pre\u2011resolved pool of AVAILABLE_CPUS;\
          \ the script does not try to split the pool evenly.\n\n1. resolve_cpu_pool builds AVAILABLE_CPUS\n- A CPU list is\
          \ either taken from CPUSET_POOL or, if unset, from `/sys/devices/system/node/node0/cpulist`.\n- That list is expanded\
          \ into an ordered array AVAILABLE_CPUS (e.g., `0,1,2,3,4,5` becomes `[0 1 2 3 4 5]`).\n- The script only checks\
          \ that these CPUs exist and that there is at least one, but does not modify or rebalance them.\n\n2. SERVER_CORES\
          \ and CLIENT_CORES are validated, then used as counts\n- SERVER_CORES and CLIENT_CORES are provided by the environment\
          \ or defaults and validated as positive integers.\n- The script checks `SERVER_CORES + CLIENT_CORES <= number_of_AVAILABLE_CPUS`.\
          \ If not, it exits.\n\n3. CPU sets are simple slices of AVAILABLE_CPUS\n- SERVER_CPUSET_LIST is the first SERVER_CORES\
          \ CPUs from AVAILABLE_CPUS: indices `[0 .. SERVER_CORES-1]`.\n- CLIENT_CPUSET_LIST is the next CLIENT_CORES CPUs\
          \ from AVAILABLE_CPUS: indices `[SERVER_CORES .. SERVER_CORES+CLIENT_CORES-1]`.\n- SERVER_CPUSET and CLIENT_CPUSET\
          \ are strings built by joining these lists with commas.\n\nSo the script does not automatically split the CPU pool\
          \ evenly; it strictly honors SERVER_CORES and CLIENT_CORES and assigns the first N CPUs to the server and the next\
          \ M CPUs to the client within the chosen pool."
        code_snippets:
        - path: |-
            run.sh
          snippet: |-
            resolve_cpu_pool() {
              local source="$1"
