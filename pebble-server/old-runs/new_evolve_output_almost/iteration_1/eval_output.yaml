    hypothesis:
      text: "The observed behavior is primarily due to per-flow stickiness interacting with a limited number of client UDP\
        \ flows, combined with CPU capacity limits, causing only a subset of the 6 server workers to be utilized and leading\
        \ to queue buildup and drops when the offered load exceeds the effective capacity of those hot workers. Specifically:\
        \ (1) The agent_udp_selector uses reuse->hash % active, so all packets for a given 4-tuple are pinned to a single\
        \ worker; (2) The client likely runs with a modest, fixed number of UDPConns (one per send worker), so there are relatively\
        \ few flows compared to 6 server sockets; hashing those flows into 6 buckets randomly leaves some buckets empty for\
        \ an entire run, which matches the logs where 1\u20133 workers see zero traffic; (3) Total service capacity is then\
        \ limited by the CPU budget and the number of busy workers actually receiving traffic (plus 10\xB5s/2ms busy-wait\
        \ costs), giving an empirical ceiling around 90\u2013100k req/s; (4) When the open-loop client sends at or above that\
        \ ceiling (100k and 140k), the per-socket receive queues for the busy workers grow large, so replies are delayed (p99\
        \ in seconds) and eventually UDP drops occur, while idle workers cannot help because flows are pinned by the hash.\
        \ This explains stable in-server avg_get/avg_scan around the synthetic delays, rising client-side p99 latency, and\
        \ the decreasing set of active workers across runs. Uncertainty remains about the exact number of client sockets/flows\
        \ and whether any Go code dynamically adjusts the agent_state or target map."
