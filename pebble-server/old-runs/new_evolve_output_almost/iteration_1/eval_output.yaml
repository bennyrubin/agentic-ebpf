            \ line:\n\n  - `\"[perf] worker=%d gets=%d get_errors=%d avg_get=%s scans=%d scan_errors=%d avg_scan=%s\", i,\
            \ snap.getCount, snap.getErrors, workerAvgGet, snap.scanCount, snap.scanErrors, workerAvgScan`.\n\n- Regardless\
            \ of whether it printed the per\u2011worker line, it always accumulates totals:\n  - `total.getCount += snap.getCount`,\
            \ `total.scanCount += snap.scanCount`, etc.\n\n- After the loop over workers, if `total.getCount == 0 && total.scanCount\
            \ == 0`, it continues to the next interval without printing any aggregate stats.\n\nTherefore:\n- A per\u2011\
            worker `'[perf] worker=N ...'` line is printed only if that worker handled at least one get or scan during the\
            \ interval (`snap.getCount > 0 || snap.scanCount > 0`).\n- Workers that had zero requests of both types during\
            \ the interval are skipped and do not produce a per\u2011worker line."
