    - question: |-
        In internal/server/ebpf.go, for the 'agent' policy, how is the pebble_agent_state map (and specifically the 'active' field) initialized, and is that 'active' value ever modified after server startup?
      answer:
        answer: "For the `agent` policy, the eBPF objects are loaded and the `pebble_agent_state` map is initialized during\
          \ `loadAgent(workers int)`.\n\n1. Initialization:\n- `loadAgent` first loads the eBPF objects via `ebpfutil.LoadAgentSelectorObjects(&objs,\
          \ opts)`.\n- It then validates `workers` (`workers` must be non\u2011negative).\n- A key `var key uint32 = 0` is\
          \ created, and a value of type `ebpfutil.AgentSelectorAgentState` is constructed with:\n  - `state := ebpfutil.AgentSelectorAgentState{\
          \ Active: uint32(workers), }`\n- If `objs.PebbleAgentState` (the `pebble_agent_state` map) is non\u2011nil, the\
          \ map is updated at key `0` with this `state` using `UpdateAny`:\n  - `objs.PebbleAgentState.Update(&key, &state,\
          \ ebpf.UpdateAny)`\n\nSo the `active` field is initialized exactly once at startup to the configured `workers` value\
          \ (cast to `uint32`).\n\n2. Modification after startup:\nWithin the provided code, there are no further updates\
          \ to `PebbleAgentState` after this call in `loadAgent`. Aside from this initialization, the code does not modify\
          \ the `active` field again, so it remains set to the original `workers` value for the lifetime of the server process\
          \ (unless other code outside this snippet updates the map)."
        code_snippets:
        - path: |-
            internal/server/ebpf.go
          snippet: "func loadAgent(workers int) (*ebpfPolicy, error) {\n\tif err := ensureRlimit(); err != nil {\n\t\treturn\
            \ nil, err\n\t}\n\tpinDir := pinDirectory()\n\tif err := ensurePinDirectory(pinDir); err != nil {\n\t\treturn\
