        In run.sh and/or run_exp.py, what values are used for SERVER_CORES and CLIENT_CORES when running these agent-* experiments, and how are those values passed to cmd/pebble_server (e.g., via taskset and/or -workers)?
      answer:
        answer: |-
          For these agent-* experiments, the Python driver determines the effective values for server and client CPU core counts and then passes them to run.sh, which in turn exposes them to the Go benchmark/server via environment and/or command-line.

          1. How SERVER_CORES and CLIENT_CORES are chosen
          - In run_exp.py, the top-level argument parsing logic validates and resolves the core counts:
            - If --server-cores is provided and > 0, that value is used.
            - Otherwise, server_cores defaults to the --threads value.
            - If --client-cores is provided and > 0, that value is used.
            - Otherwise, client_cores defaults to the --send-workers value.

            This resolution is done via:
            - resolved_server_cores = args.server_cores if args.server_cores is not None else args.threads
            - resolved_client_cores = args.client_cores if args.client_cores is not None else args.send_workers

          2. How those values are passed to run.sh / the server
          - When launching an individual experiment, run_exp.py builds a cmd list that invokes run.sh and explicitly appends the resolved core counts as CLI options:
            - "--server-cores", str(server_cores)
            - "--client-cores", str(client_cores)

            So run.sh sees these as command-line flags. Inside run.sh, there are corresponding environment variables:
            - SERVER_CORES=${SERVER_CORES:-}
            - CLIENT_CORES=${CLIENT_CORES:-}

            run.sh is structured to work with CPU pinning via these variables (using TASKSET_BIN=taskset and CPUSET_POOL, along with helper functions like expand_cpu_list), so the values from run_exp.py are intended to control CPU affinity / pinning for the server and client processes (e.g., via taskset). The exact wiring from SERVER_CORES/CLIENT_CORES to the final pebble_server flags (such as -workers) is not shown in the given snippets, but the flow is:
            - run_exp.py resolves server_cores and client_cores
            - passes them to run.sh as --server-cores/--client-cores
            - run.sh uses SERVER_CORES/CLIENT_CORES (and TASKSET_BIN=taskset) to control CPU placement for server and client processes.

          In summary: the effective core counts default to threads and send_workers when explicit core counts are not given, and are then passed to run.sh as --server-cores/--client-cores, where they are mapped onto SERVER_CORES/CLIENT_CORES and used for CPU pinning (likely via taskset) and worker configuration for the agent-* experiments.
