        In internal/server/server.go, what is the exact implementation of startStatsLogger: under what condition does it print a per-worker '[perf] worker=N ...' line, and does it skip workers that had zero requests during the interval?
      answer:
        answer: "In internal/server/server.go, startStatsLogger is implemented roughly as:\n\n- It returns immediately if\
          \ either the server has no logger or there are no worker stats:\n  - `if s.logger == nil || len(s.stats) == 0 {\
          \ return }`\n  - Otherwise it does `s.statsWG.Add(1)` and runs a loop that periodically collects a snapshot from\
          \ each worker\u2019s stats using `snapshotAndReset()`.\n\n- For each worker `i`, it does:\n  - `snap := s.stats[i].snapshotAndReset()`\n\
          \  - It then checks:\n    - `if snap.getCount > 0 || snap.scanCount > 0 { ... print ... }`\n\n- Only when that condition\
          \ is true does it compute `workerAvgGet` and `workerAvgScan` and print a per\u2011worker performance line:\n\n \
          \ - `\"[perf] worker=%d gets=%d get_errors=%d avg_get=%s scans=%d scan_errors=%d avg_scan=%s\", i, snap.getCount,\
          \ snap.getErrors, workerAvgGet, snap.scanCount, snap.scanErrors, workerAvgScan`.\n\n- Regardless of whether it printed\
          \ the per\u2011worker line, it always accumulates totals:\n  - `total.getCount += snap.getCount`, `total.scanCount\
          \ += snap.scanCount`, etc.\n\n- After the loop over workers, if `total.getCount == 0 && total.scanCount == 0`, it\
          \ continues to the next interval without printing any aggregate stats.\n\nTherefore:\n- A per\u2011worker `'[perf]\
          \ worker=N ...'` line is printed only if that worker handled at least one get or scan during the interval (`snap.getCount\
          \ > 0 || snap.scanCount > 0`).\n- Workers that had zero requests of both types during the interval are skipped and\
          \ do not produce a per\u2011worker line."
