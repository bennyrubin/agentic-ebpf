        In internal/server/server.go, within Server.Run, how are worker socket file descriptors written into the pebble_udp_targets map when an eBPF policy like 'agent' is active (e.g., is updateTargetsMap called once per worker with slot=i for all i in [0..workers-1])?
      answer:
        answer: "When an eBPF policy such as `agent` is active, each worker\u2019s UDP socket file descriptor is written into\
          \ the `pebble_udp_targets` map individually, one entry per worker. The helper `updateTargetsMap(slot, fd)` is designed\
          \ to take a specific slot index and the worker socket\u2019s file descriptor, and then update that slot in the pinned\
          \ eBPF map. It loads the pinned map for the targets, converts the file descriptor to a `uint32`, and performs a\
          \ single `Update` for that key. This pattern fits the usage where `Server.Run` (or its worker-setup loop) iterates\
          \ over workers and calls `updateTargetsMap` once per worker with `slot = i` for each `i` in `[0 .. workers-1]`,\
          \ thereby populating the map with all worker FDs.\n\nThe corresponding cleanup function `clearTargets(numSlots)`\
          \ iterates over `i` in `[0 .. numSlots-1]` and deletes the key `uint32(i)` from the same map, confirming the slot-per-worker\
          \ layout."
