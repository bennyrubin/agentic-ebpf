- id: 940495a5c02f46d2a2d368ae794b36d6
  idea_payload:
    status: finish
    design_doc:
      goals:
      - Reduce head-of-line blocking for short GET requests caused by rare, long SCAN requests on single-threaded workers,
        without changing the userspace worker model.
      - "Keep total throughput close to the current ~135\u2013140k ops/s capacity while materially improving GET p99 latency\
        \ at medium\u2013high load."
      - Implement request-type-aware routing (GET vs SCAN) entirely inside the AgentUDPSelector eBPF program, using only the
        existing pebble_udp_targets sockarray and pebble_agent_state map.
      - 'Minimize new eBPF complexity: add only simple state and a small, bounded amount of extra logic (no new maps, no divisions,
        few branches), keeping verifier-friendly patterns.'
      - Avoid introducing any new userspace configuration paths; continue to rely only on the existing Active field seeded
        once by Go, with all new behavior self-contained in BPF.
      evidence:
      - The current agent selector implements a global round-robin over all workers using a single counter in pebble_agent_state,
        and server logs show almost perfectly even GET/SCAN distribution per worker across all loads, so routing skew is not
        the source of tail latency.
      - "Each worker is single-threaded and CPU-bound, executing fixed busy-wait delays (~10\xB5s for GET, ~2ms for SCAN)\
        \ plus parsing/IO/Go/runtime overhead, and these synthetic delays remain flat as offered load increases; observed\
        \ p99 growth is thus driven by queuing, not per-request delay inflation."
      - "Throughput at 140k target load is ~137k ops/s with 6 workers, implying effective per-request CPU time \u224843\u2013\
        44\xB5s, more than double the 0.995\xD710\xB5s + 0.005\xD72ms \u224820\xB5s synthetic-delay mix, confirming significant\
        \ fixed overhead per request and a cluster capacity around 135\u2013140k ops/s."
      - "As the open-loop client approaches this capacity (especially at 140k target), it does not adapt to rising outstanding\
        \ requests, so kernel socket queues and worker goroutines accumulate backlog; with SCANs being 2ms and GETs 10\xB5\
        s, this high service-time variance causes classic M/G/1-style super-linear growth in tail latency as utilization \u2192\
        \ 1."
      - "Under the current policy, SCANs are uniformly spread across workers; when a SCAN lands on a worker, it stops reading\
        \ for ~2ms while BPF keeps assigning packets to it at the same round-robin rate as others, so that worker\u2019s kernel\
        \ queue fills with GETs that then pay the full 2ms SCAN delay plus additional queuing."
      - SCANs are extremely rare (~0.5%), but each is very long; if GETs could be preferentially steered away from workers
        that are in the middle of (or just started) a SCAN, many GETs would avoid landing behind a 2ms request, reducing tail
        latency without materially changing aggregate CPU demand.
      - Existing eBPF selectors in this repo only use scalar state in maps (Active, Counter) and do not inspect the UDP payload;
        there is no evidence of payload parsing or sk_reuseport_md->data/data_end use, so adding lightweight payload inspection
        and slightly richer per-worker state to AgentUDPSelector is a new but localized change.
      architecture:
      - "Extend AgentUDPSelector into a type-aware scheduler that peeks at the first byte(s) of the UDP payload via sk_reuseport_md\
        \ (assuming standard kernel layout) to classify each packet as GET (payload starting with 'G'/'g' for 'GET') or SCAN\
        \ (payload starting with 'S'/'s' for 'SCAN'); if classification is ambiguous, default to treating it as GET, since\
        \ \u224899.5% of operations are GETs."
      - 'Augment the existing pebble_agent_state value (currently holding Active and Counter) with a small amount of per-worker
        SCAN-busy metadata and reuse a single global counter for fairness: e.g. a struct like { __u32 active; __u32 counter;
        __u64 scan_busy_until_ns[128]; }, where scan_busy_until_ns[i] is an approximate timestamp (in ns) until which worker
        i is expected to be busy with a SCAN; keep using pebble_udp_targets as the sole sockarray map.'
      - "On each SCAN packet, choose a worker using the existing global round-robin over [0, active): read state->counter,\
        \ wrap it into [0, active), use that as the slot, and then advance counter = slot + 1 (wrapping implied on next use).\
        \ Immediately after selecting the slot, obtain the current time with bpf_ktime_get_ns() and set scan_busy_until_ns[slot]\
        \ = now + SCAN_BUSY_NS, where SCAN_BUSY_NS is a fixed constant (\u22482.1ms in nanoseconds) tuned to slightly exceed\
        \ the synthetic SCAN delay plus overhead. Then call bpf_sk_select_reuseport with that slot."
      - "On each GET packet, avoid workers that are in a SCAN-busy window while still keeping selection cheap and bounded:\
        \ read active and state->counter (as a starting point), then perform a bounded linear probe over worker indices to\
        \ find a slot whose scan_busy_until_ns[slot] \u2264 now. The probe should be capped by a small compile-time constant\
        \ (e.g. MAX_PROBE = 8) and by active, and implemented without division (increment index, wrap with a simple compare-and-subtract\
        \ when \u2265 active). If an idle slot is found within the probe, use that slot; otherwise, fall back to the original\
        \ round-robin choice based on the starting counter. In all cases, update state->counter to slot + 1 so that both GETs\
        \ and SCANs advance a single shared RR pointer."
      - "This design distributes SCANs evenly across all workers (since they still use global round-robin), but during each\
        \ SCAN\u2019s busy window it steers subsequent GETs preferentially to other workers that are not marked as SCAN-busy.\
        \ Because SCANs are rare but long, this reduces the probability that a GET will land directly behind a 2ms SCAN on\
        \ the same worker, lowering GET tail latency. At the same time, CPU utilization remains balanced over time and overall\
        \ throughput remains close to the current ~135\u2013140k ops/s, as we do not concentrate SCANs onto a small subset\
        \ of workers or reserve workers exclusively for SCANs."
      - 'Keep the implementation verifier-friendly and simple: use a single ARRAY map (pebble_agent_state) with one key, avoid
        new maps, avoid divisions, and implement the bounded GET probe as a small, unrolled loop (e.g. #pragma unroll over
        MAX_PROBE) that exits early if an idle worker is found. All new state (scan_busy_until_ns[]) is maintained entirely
        in BPF; userspace continues to only set Active once at startup.'
      risks:
      - 'Payload access in sk_reuseport programs: while upstream Linux defines struct sk_reuseport_md with data/data_end pointers,
        the exact kernel headers used in this build are not visible in the repo, and no existing selector here uses payload
        reads. It is assumed that reading the first few bytes of the UDP payload via reuse->data/reuse->data_end is allowed;
        if not, request-type classification in BPF would need to be reconsidered (e.g. relying on external configuration,
        which this design currently avoids).'
      - 'Time-based SCAN windows: the design assumes bpf_ktime_get_ns() is available in sk_reuseport programs and that adding
        a single helper call per packet is acceptable overhead. If this helper is unavailable or significantly constrained
        in this BPF hook, we could not maintain scan_busy_until_ns timestamps, and the SCAN-avoidance heuristic would need
        a different signal.'
      - "Heuristic nature and races: per-worker SCAN-busy status is inferred and stored in a shared map value that multiple\
        \ BPF invocations update concurrently without explicit synchronization. This can lead to transient inconsistencies\
        \ (e.g. a worker marked free slightly before a SCAN actually finishes, or multiple SCANs extending the busy window\
        \ concurrently). These races should only degrade the heuristic\u2019s effectiveness, not correctness, but we must\
        \ confirm there are no project-specific expectations about pebble_agent_state being effectively read-only in BPF."
      - 'Verifier constraints and loops: the bounded linear probe for GET selection relies on small, fixed-iteration loops
        (#pragma unroll with MAX_PROBE). This is standard for modern BPF toolchains, but the exact kernel and LLVM versions
        used here are not explicitly documented. If loop constructs are more restricted than assumed, we may need to refactor
        the probe into a simpler pattern (e.g. checking only a handful of statically indexed offsets from the counter) which
        could weaken the SCAN-avoidance effect.'
      - "Workload dependency and tuning: SCAN_BUSY_NS is tuned for the current synthetic workload (~2ms SCAN delay with very\
        \ low SCAN fraction). If SCAN duration or mix is changed substantially in future tests, a static 2\u20132.5ms busy\
        \ window may either under-protect GETs (if SCANs get longer) or reduce effective capacity by over-penalizing workers\
        \ (if SCANs get much shorter or more frequent). The design deliberately avoids userspace configuration knobs, so its\
        \ robustness across different workloads should be validated."
      - 'No per-worker queue visibility: the selector has no direct signal about per-socket queue length or actual worker
        CPU utilization; it only knows which workers were recently assigned SCANs. Under extreme load, some workers may see
        higher GET rates when others are frequently SCAN-busy, potentially leading to uneven CPU utilization and earlier saturation
        on those workers. The expectation is that even if utilization becomes slightly more uneven, removing 2ms head-of-line
        blocking for many GETs will still improve p99 latency at similar throughput, but this requires empirical validation.'
