    \        __u32 candidate = base;\n\n#pragma unroll\n            for (int attempt = 0; attempt < (1 + SCAN_RECENT_SLOTS);\
    \ attempt++) {\n                bool conflict = false;\n\n#pragma unroll\n                for (int i = 0; i < SCAN_RECENT_SLOTS;\
