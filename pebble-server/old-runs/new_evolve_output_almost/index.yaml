    idea_payload:
      status: continue
      design_doc:
        goals:
        - Eliminate hot-spotting caused by static per-flow hashing so that small numbers of client flows do not collapse onto
          a subset of reuseport workers.
        - Drive all configured reuseport workers toward similar load to better utilize available CPU capacity and increase
          sustainable throughput near the CPU limit.
        - Reduce tail latency under overload by distributing backlog more evenly across workers, without attempting to exceed
          the underlying CPU-bound service capacity.
        - Keep the selector implementation simple and self-contained inside the AgentUDPSelector program, using only existing
          maps (pebble_udp_targets and pebble_agent_state) and without any new user-space configuration.
        evidence:
        - "Per the logs, as offered load increases, only a subset of the 6 workers show non-zero traffic in a given second\
          \ (e.g., all 6 at 50k, ~3\u20134 at 80\u2013140k), consistent with a few client flows being pinned to a few worker\
          \ indices by hash % active."
        - "The current agent_udp_selector is static: it computes start = reuse->hash % state->active and passes that single\
          \ slot into bpf_sk_select_reuseport, so each 4\u2011tuple is effectively stuck on one worker for the whole run."
        - "Server throughput plateaus around 75\u201385k req/s for 100k and 140k offered load, while avg_get and avg_scan\
          \ stay near the synthetic delays, indicating CPU-bound service with significant queuing but no per-request slowdown."
        - Client-side p99 latency explodes (to seconds) and many responses go missing at 100k/140k, behavior expected from
          an open-loop overload with growing per-socket queues on hot workers and idle capacity on cold workers.
        - "Workload composition (~99\u201399.5% short GETs, ~0.5\u20131% long SCANs) yields an average CPU cost of roughly\
          \ tens of microseconds per request, so the main lever for eBPF is balancing that work across workers, not reducing\
          \ per-request cost."
        architecture:
        - 'Replace the per-flow hash-based sharding with a simple global per-packet round-robin across all active reuseport
          slots: store an atomic counter in pebble_agent_state, increment it on each packet, and select slot = counter % state->active.'
        - Use pebble_udp_targets only as the backing sockarray for bpf_sk_select_reuseport; call the helper once with the
          chosen round-robin slot and fall back to SK_PASS if it fails, leaving all dynamic behavior inside AgentUDPSelector.
        - "For this first iteration, do not attempt to classify GET vs SCAN or observe queue depth; all packets are balanced\
          \ identically, focusing solely on eliminating 4\u2011tuple pinning and equalizing load across workers with minimal\
          \ logic."
        risks:
        - Assumes that updating a shared counter inside pebble_agent_state (likely via an atomic XADD on a map value) is allowed
          and performant in sk_reuseport programs on the target kernel; if not, a different stateless balancing scheme (e.g.,
          time-based jitter) will be required.
        - Assumes user space only relies on the existing 'active' field in pebble_agent_state and will tolerate extending
          the struct to include a counter (and possibly padding), so that Go bindings and BPF stay in sync.
        - "Assumes the number of client send workers (and thus distinct 4\u2011tuples) is relatively small compared to the\
          \ number of server workers, so per-packet balancing provides a clear benefit over per-flow hashing; if there are\
          \ already many flows, gains may be modest."
        - "Assumes that the application semantics do not require flow affinity or in-order processing per 4\u2011tuple; with\
          \ UDP request/response and no connection-specific state, striping packets from the same client flow across workers\
          \ should be safe but needs to be double-checked."
        - Assumes the additional per-packet map lookup and atomic increment overhead inside eBPF is negligible compared to
          user-space busy-wait costs; if it proves significant, we may need to optimize further (e.g., per-CPU state or reduced
          helper usage).
