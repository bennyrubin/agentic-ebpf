  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector\n *\n * Approach / rationale\n\
    \ * --------------------\n * The kernel's default reuseport selection (and the original agent policy)\n * relied on sk_reuseport_md->hash,\
    \ which is effectively per-flow. With only a\n * small number of UDP flows, that pins each 4\u2011tuple to one worker,\
    \ causing hot\n * sockets with long queues and high tail latency, while other workers are idle.\n *\n * This selector\
    \ ignores the kernel hash and implements a global round\u2011robin\n * over the active workers using a single counter\
    \ stored in pebble_agent_state:\n *\n *   - pebble_agent_state[0].active is the number of active workers (slots\n *  \
    \   [0, active)).\n *   - pebble_agent_state[0].counter holds the next slot index to use.\n *   - For each packet:\n *\
    \       * read active; if zero, fall back to SK_PASS.\n *       * clamp active to the sockarray capacity (128).\n *  \
    \     * take 'next = counter'; if next >= active, wrap to 0.\n *       * select slot = next, then store counter = next\
    \ + 1.\n *       * call bpf_sk_select_reuseport once with that slot.\n *\n * Properties:\n *   - Even with a single client\
    \ flow, packets are spread across all active\n *     workers, balancing CPU and backlog and raising the effective throughput\n\
    \ *     ceiling while keeping p99 latency low and flat under load.\n *   - The round\u2011robin is implemented without\
    \ division (no modulo). We only use\n *     a compare\u2011and\u2011wrap step, which is cheaper in the BPF JIT than a\
    \ 32\u2011bit\n *     divide, while still cycling deterministically over [0, active).\n *   - The design uses a single\
    \ small ARRAY map value, one lookup, one write,\n *     and a single bpf_sk_select_reuseport call, staying well within\
    \ verifier\n *     limits (no loops, minimal stack, no forbidden helpers).\n *   - User space continues to manage only\
    \ the Active field; Counter is\n *     maintained by the BPF program and starts at zero when the map is\n *     (re)created\
    \ or updated.\n */\n\nstruct agent_state {\n    __u32 active;   /* number of active workers (slots [0, active)) */\n \
    \   __u32 counter;  /* next slot index to use for round-robin */\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n\
    \    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md\
    \ *reuse)\n{\n    /* Lookup global agent state (index 0). */\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state,\
    \ &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n      \
    \  return SK_PASS;\n\n    /* Safety clamp: map holds at most 128 entries. */\n    if (active > 128)\n        active =\
    \ 128;\n\n    /*\n     * Global round-robin without modulo:\n     *\n     *   next = state->counter;\n     *   if next\
    \ >= active: wrap to 0;\n     *   slot = next;\n     *   state->counter = next + 1;\n     *\n     * This cycles deterministically\
    \ over [0, active) while avoiding a divide.\n     */\n    __u32 next = state->counter;\n    if (next >= active)\n    \
    \    next = 0;\n\n    __u32 slot = next;\n    state->counter = next + 1;\n\n    /* Single selection attempt; kernel ignores\
    \ any additional calls. */\n    bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n\
    }\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
