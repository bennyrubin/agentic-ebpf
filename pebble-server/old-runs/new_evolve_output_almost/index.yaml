    \                    }\n                }\n\n                if (!conflict)\n                    break;\n\n          \
    \      candidate++;\n                if (candidate >= active)\n                    candidate = 0;\n            }\n\n \
    \           slot = candidate;\n            state->get_rr = candidate + 1;\n        }\n    }\n\n    /* Single selection\
