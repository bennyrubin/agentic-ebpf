            \ workers.\",\n      \"Drive all configured reuseport workers toward similar load to better utilize available\
            \ CPU capacity and increase sustainable throughput near the CPU limit.\",\n      \"Reduce tail latency under overload\
            \ by distributing backlog more evenly across workers, without attempting to exceed the underlying CPU-bound service\
            \ capacity.\",\n      \"Keep the selector implementation simple and self-contained inside the AgentUDPSelector\
            \ program, using only existing maps (pebble_udp_targets and pebble_agent_state) and without any new user-space\
            \ configuration.\"\n    ],\n    \"evidence\": [\n      \"Per the logs, as offered load increases, only a subset\
            \ of the 6 workers show non-zero traffic in a given second (e.g., all 6 at 50k, ~3\u20134 at 80\u2013140k), consistent\
            \ with a few client flows being pinned to a few worker indices by hash % active.\",\n      \"The current agent_udp_selector\
            \ is static: it computes start = reuse->hash % state->active and passes that single slot into bpf_sk_select_reuseport,\
            \ so each 4\u2011tuple is effectively stuck on one worker for the whole run.\",\n      \"Server throughput plateaus\
            \ around 75\u201385k req/s for 100k and 140k offered load, while avg_get and avg_scan stay near the synthetic\
            \ delays, indicating CPU-bound service with significant queuing but no per-request slowdown.\",\n      \"Client-side\
            \ p99 latency explodes (to seconds) and many responses go missing at 100k/140k, behavior expected from an open-loop\
            \ overload with growing per-socket queues on hot workers and idle capacity on cold workers.\",\n      \"Workload\
            \ composition (~99\u201399.5% short GETs, ~0.5\u20131% long SCANs) yields an average CPU cost of roughly tens\
            \ of microseconds per request, so the main lever for eBPF is balancing that work across workers, not reducing\
            \ per-request cost.\"\n    ],\n    \"architecture\": [\n      \"Replace the per-flow hash-based sharding with\
            \ a simple global per-packet round-robin across all active reuseport slots: store an atomic counter in pebble_agent_state,\
            \ increment it on each packet, and select slot = counter % state->active.\",\n      \"Use pebble_udp_targets only\
            \ as the backing sockarray for bpf_sk_select_reuseport; call the helper once with the chosen round-robin slot\
            \ and fall back to SK_PASS if it fails, leaving all dynamic behavior inside AgentUDPSelector.\",\n      \"For\
            \ this first iteration, do not attempt to classify GET vs SCAN or observe queue depth; all packets are balanced\
            \ identically, focusing solely on eliminating 4\u2011tuple pinning and equalizing load across workers with minimal\
            \ logic.\"\n    ],\n    \"risks\": [\n      \"Assumes that updating a shared counter inside pebble_agent_state\
            \ (likely via an atomic XADD on a map value) is allowed and performant in sk_reuseport programs on the target\
            \ kernel; if not, a different stateless balancing scheme (e.g., time-based jitter) will be required.\",\n    \
            \  \"Assumes user space only relies on the existing 'active' field in pebble_agent_state and will tolerate extending\
            \ the struct to include a counter (and possibly padding), so that Go bindings and BPF stay in sync.\",\n     \
            \ \"Assumes the number of client send workers (and thus distinct 4\u2011tuples) is relatively small compared to\
            \ the number of server workers, so per-packet balancing provides a clear benefit over per-flow hashing; if there\
