  - iteration: 1
    idea_payload:
      status: finish
      design_doc:
        goals:
        - Remove dependence on kernel per-flow hashing so that even a very small number of client flows (down to a single
          UDPConn) are spread across all reuseport workers, avoiding hot-spotting.
        - Achieve roughly even per-worker request rates so aggregate CPU capacity is utilized up to the true service ceiling
          (~80k req/s in the current setup).
        - Reduce queueing and tail latency under overload by equalizing backlog across workers, without introducing user-space
          coordination or configuration beyond the existing Active field.
        - Keep the AgentUDPSelector program simple and self-contained, using only pebble_udp_targets and pebble_agent_state,
          with minimal additional state (one global counter) and no new maps.
        evidence:
        - "The current AgentUDPSelector uses reuse->hash % state->active to pick a single slot, and bpf_sk_select_reuseport\
          \ is only called for that slot; thus each 4\u2011tuple is pinned to a worker for the entire run."
        - "The client workload uses a very small number of flows; workload/run_client.sh defaults to one send worker (-w 1),\
          \ so in the absence of overrides, only one UDPConn / 4\u2011tuple is active. Even if -w is occasionally increased,\
          \ the number of flows remains small relative to 6 server workers."
        - Server logs show that only a subset of workers receive traffic at higher loads (e.g., fewer than 6 workers active
          per second in many intervals), which matches expectations for static hashing of a small flow set onto 6 buckets.
        - "Throughput plateaus at ~75\u201385k req/s while avg_get and avg_scan match the synthetic delays, indicating CPU-bound\
          \ service; the main inefficiency is uneven distribution of that load across workers, not per-request cost."
        - Client-side p99 latency grows to seconds and many requests time out or are dropped at 100k/140k req/s, consistent
          with long per-socket queues on a few hot workers while other workers remain underutilized.
        architecture:
        - "Extend the pebble_agent_state value to hold both Active (existing uint32) and a 32\u2011bit global counter; keep\
          \ Active as the first field so Go\u2019s AgentSelectorAgentState remains compatible and only needs a regenerated\
          \ definition."
        - On each packet, AgentUDPSelector looks up key 0 in pebble_agent_state, atomically increments the counter, and selects
          slot = counter % Active; it then calls bpf_sk_select_reuseport once with that slot and falls back to SK_PASS if
          the helper fails.
        - "This implements simple per-packet round-robin across the Active worker range, eliminating 4\u2011tuple pinning\
          \ while relying solely on existing maps and a single shared counter, with no payload parsing or additional heuristics."
        risks:
        - Atomic updates on a map value from an sk_reuseport program must be verifier- and kernel-compatible; the existing
          round_robin policy (RrUdpSelector + PebbleRrState) strongly suggests this is feasible, but the exact atomic pattern
          used there will need to be mirrored in AgentUDPSelector at implementation time.
        - Regenerating eBPF assets will change the Go definition of AgentSelectorAgentState from a single-field struct (Active
          uint32) to a multi-field struct; existing Go code only sets Active, so the new counter field will rely on zero-initialization,
          which should be safe but must be confirmed after regeneration.
        - 'Per-packet round-robin breaks any implicit per-flow ordering guarantees: responses for a single client flow may
          now be served by different workers and arrive out of order; the current UDP + reqID design appears tolerant of this,
          but other potential consumers of this selector might not be.'
        - "The small amount of added work per packet (one extra map value field and an atomic increment) is expected to be\
          \ negligible compared to the 10\xB5s/2ms busy-wait in user space, but on very fast real backends this overhead could\
          \ become non-trivial and may then need optimization (e.g., weaker consistency or per-CPU patterns)."
        - If future workloads use very many independent flows, plain per-packet round-robin might not outperform a good per-flow
          hash (which can have better cache locality and fewer cross-worker effects); however, for the current benchmark with
          few flows, the design directly targets the dominant imbalance.
