            \ specifically in loadAgent and any related setup code, how is the pebble_agent_state map initialized from Go\
            \ (which fields are written, and with what struct type)? Please show the relevant code.\",\n    \"Is there an\
            \ existing round-robin-style eBPF selector program in the repository (e.g., an rr policy under ebpf/)? If so,\
            \ please provide its C source file so we can reuse its patterns for safe counters and helper usage.\",\n    \"\
            Do any of the existing eBPF selector programs in ebpf/ (such as scan_split or hash variants) read the UDP payload\
            \ via sk_reuseport_md->data / data_end? If yes, please show a representative code snippet demonstrating this access\
            \ pattern.\",\n    \"What is the generated Go definition (in internal/ebpfutil/*agentselector*_bpf.go or similar)\
            \ for the value type of the pebble_agent_state map (field names and types), so we can understand current struct\
