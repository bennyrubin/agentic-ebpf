    - question: In the scripts that invoke cmd/workload_client (run.sh and/or workload/run_client.sh), what value is passed
        for the send-workers flag (e.g., -w) in the agent-* experiments, i.e., how many UDPConns / client flows are actually
        used?
      answer:
        answer: In workload/run_client.sh the default value for the send-workers flag (-w) is 1, so the agent-* experiments
          use a single send worker, meaning only one UDPConn / client flow is actually used unless -w is explicitly overridden
          on the command line.
        code_snippets:
        - path: workload/run_client.sh
          snippet: "SEND_WORKERS=1\n\nusage() {\n  cat <<USAGE\nUsage: $0 [options]\n  ...\n  -w <workers>    concurrent send\
            \ workers (default: $SEND_WORKERS)\nUSAGE\n}\n\nwhile getopts \":s:t:r:g:m:k:N:l:w:\" opt; do\n  case \"$opt\"\
            \ in\n    ...\n    w) SEND_WORKERS=\"$OPTARG\" ;;\n  esac\ndone"
        - path: cmd/workload_client/main.go
          snippet: "var (\n\t\t...\n\t\tsendWorkers = flag.Int(\"send-workers\", 1, \"number of concurrent send workers\"\
            )\n\t)\n\tflag.Parse()\n\n\tworkers := *sendWorkers\n\tif workers <= 0 {\n\t\tworkers = 1\n\t}\n\t...\n\tconn,\
            \ err := net.DialUDP(\"udp\", nil, udpAddr)\n\t\t...\n\t\tgo func(workerID int, conn *net.UDPConn, rng *rand.Rand)\
            \ {\n\t\t\tdefer sendWG.Done()\n\t\t\tbuf := make([]byte, 0, 256)\n\t\t\tfor {\n\t\t\t\tif err := limiter.Wait(ctx);\
            \ err != nil {\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\t...\n\t\t\t\tif _, err := conn.Write(payload); err != nil\
            \ {\n\t\t\t\t\t...\n\t\t\t\t}\n\t\t\t\t...\n\t\t\t}\n\t\t}(workerID, conn, rng)"
    - question: In internal/server/ebpf.go, specifically in loadAgent and any related setup code, how is the pebble_agent_state
        map initialized from Go (which fields are written, and with what struct type)? Please show the relevant code.
      answer:
        answer: 'The `pebble_agent_state` map is initialized in Go by writing a single entry (key 0) of type `ebpfutil.AgentSelectorAgentState`.
          Only the `Active` field of that struct is set, and it is set to the configured number of workers (cast to `uint32`).
          The struct value is then written into the `PebbleAgentState` map using `Update` with `ebpf.UpdateAny`:


          - A `uint32` key is created and set to 0.

          - An `ebpfutil.AgentSelectorAgentState` value is created with its `Active` field set to `uint32(workers)`.

          - If `objs.PebbleAgentState` is non-nil, `Update(&key, &state, ebpf.UpdateAny)` is called to store this struct in
          the map.


          Relevant code (including the surrounding setup):'
        code_snippets:
        - path: internal/server/ebpf.go
          snippet: "func loadAgent(workers int) (*ebpfPolicy, error) {\n\tif err := ensureRlimit(); err != nil {\n\t\treturn\
            \ nil, err\n\t}\n\tpinDir := pinDirectory()\n\tif err := ensurePinDirectory(pinDir); err != nil {\n\t\treturn\
            \ nil, fmt.Errorf(\"ensure pin directory: %w\", err)\n\t}\n\tvar objs ebpfutil.AgentSelectorObjects\n\topts :=\
            \ &ebpf.CollectionOptions{\n\t\tMaps: ebpf.MapOptions{PinPath: pinDir},\n\t}\n\tif err := ebpfutil.LoadAgentSelectorObjects(&objs,\
            \ opts); err != nil {\n\t\treturn nil, fmt.Errorf(\"load agent objects: %w\", err)\n\t}\n\n\tif workers < 0 {\n\
            \t\tobjs.Close()\n\t\treturn nil, ErrInvalidConfig(\"workers must be non-negative\")\n\t}\n\n\tvar key uint32\
            \ = 0\n\tstate := ebpfutil.AgentSelectorAgentState{\n\t\tActive: uint32(workers),\n\t}\n\tif objs.PebbleAgentState\
            \ != nil {\n\t\tif err := objs.PebbleAgentState.Update(&key, &state, ebpf.UpdateAny); err != nil {\n\t\t\tobjs.Close()\n\
            \t\t\treturn nil, fmt.Errorf(\"configure agent state: %w\", err)\n\t\t}\n\t}\n\n\treturn &ebpfPolicy{\n\t\tname:\
            \    \"agent\",\n\t\tprogram: objs.AgentUdpSelector,\n\t\tclose:   objs.Close,\n\t}, nil\n}\n"
        - path: internal/server/ebpf.go
          snippet: "type ebpfPolicy struct {\n\tname    string\n\tprogram *ebpf.Program\n\tclose   func() error\n}\n\nconst\
            \ defaultPinBase = \"/sys/fs/bpf\"\n\nfunc pinDirectory() string {\n\tif path := os.Getenv(\"BPF_PIN_PATH\");\
            \ path != \"\" {\n\t\treturn path\n\t}\n\tif base := os.Getenv(\"BPF_PIN_BASE\"); base != \"\" {\n\t\treturn base\n\
            \t}\n\treturn defaultPinBase\n}\n\nfunc ensurePinDirectory(path string) error {\n\treturn os.MkdirAll(path, 0o755)\n\
            }\n\nfunc ensureRlimit() error {\n\tif err := rlimit.RemoveMemlock(); err != nil {\n\t\treturn fmt.Errorf(\"adjust\
            \ memlock: %w\", err)\n\t}\n\treturn nil\n}\n"
    - question: Is there an existing round-robin-style eBPF selector program in the repository (e.g., an rr policy under ebpf/)?
        If so, please provide its C source file so we can reuse its patterns for safe counters and helper usage.
      answer:
        answer: "Yes, there is an existing round-robin-style eBPF selector in the repository. The server code loads it via\
          \ the `ebpfutil.RrSelectorObjects` collection and uses the `RrUdpSelector` program together with the `PebbleRrState`\
          \ map to manage a round\u2011robin state (including a counter and active worker count). The Go loader for this policy\
          \ is implemented in the `loadRoundRobin` function, which configures the state map and attaches the round\u2011robin\
          \ eBPF program. However, the snippet provided only shows the Go-side loader and does not include the C source file\
          \ for the eBPF program itself. To reuse its patterns for safe counters and helper usage, you would need to locate\
          \ the C file that corresponds to the `RrSelectorObjects`/`RrUdpSelector` (typically generated into `internal/ebpfutil`\
          \ from a `.c` source under an eBPF directory in the repo)."
        code_snippets:
        - path: internal/server/ebpf.go
          snippet: "func loadRoundRobin(workers int) (*ebpfPolicy, error) {\n\tif err := ensureRlimit(); err != nil {\n\t\t\
            return nil, err\n\t}\n\tpinDir := pinDirectory()\n\tif err := ensurePinDirectory(pinDir); err != nil {\n\t\treturn\
            \ nil, fmt.Errorf(\"ensure pin directory: %w\", err)\n\t}\n\tvar objs ebpfutil.RrSelectorObjects\n\topts := &ebpf.CollectionOptions{\n\
            \t\tMaps: ebpf.MapOptions{PinPath: pinDir},\n\t}\n\tif err := ebpfutil.LoadRrSelectorObjects(&objs, opts); err\
            \ != nil {\n\t\treturn nil, fmt.Errorf(\"load round robin objects: %w\", err)\n\t}\n\n\tvar key uint32 = 0\n\t\
            state := ebpfutil.RrSelectorRrState{}\n\tif err := objs.PebbleRrState.Lookup(&key, &state); err != nil {\n\t\t\
            state.Active = uint32(workers)\n\t\tstate.Counter = 0\n\t} else {\n\t\tstate.Active = uint32(workers)\n\t}\n\t\
            if err := objs.PebbleRrState.Update(&key, &state, ebpf.UpdateAny); err != nil {\n\t\tobjs.Close()\n\t\treturn\
            \ nil, fmt.Errorf(\"configure round robin state: %w\", err)\n\t}\n\n\treturn &ebpfPolicy{\n\t\tname:    \"round_robin\"\
            ,\n\t\tprogram: objs.RrUdpSelector,\n\t\tclose:   objs.Close,\n\t}, nil\n}\n"
        - path: internal/server/ebpf.go
          snippet: "func loadEBPF(policy string, workers int) (*ebpfPolicy, error) {\n\tswitch policy {\n\tcase \"default\"\
            , \"\":\n\t\treturn &ebpfPolicy{name: \"default\"}, nil\n\tcase \"round_robin\":\n\t\treturn loadRoundRobin(workers)\n\
            \tcase \"agent\":\n\t\treturn loadAgent(workers)\n\tcase \"scan_split\":\n\t\treturn loadScanSplit(workers)\n\t\
            case \"hash\":\n\t\treturn loadHash(workers)\n\tdefault:\n\t\treturn nil, ErrInvalidConfig(fmt.Sprintf(\"unknown\
            \ policy %q\", policy))\n\t}\n}\n"
    - question: Do any of the existing eBPF selector programs in ebpf/ (such as scan_split or hash variants) read the UDP
        payload via sk_reuseport_md->data / data_end? If yes, please show a representative code snippet demonstrating this
        access pattern.
      answer:
        answer: "Yes. The existing selector programs for both the scan_split and hash variants read from the UDP payload using\
          \ the sk_reuseport_md data/data_end pointers. They first compute the payload start from the socket metadata, then\
          \ perform bounds checks before reading fields from the payload. A representative pattern is:\n\n- Cast `ctx->data`\
          \ / `ctx->data_end` to `void *` pointers\n- Compute the payload start/end (e.g., skipping headers or directly using\
          \ them as-is)\n- Check `(void *)(payload + sizeof(struct your_hdr)) <= data_end`\n- Safely read the payload bytes\
          \ used for selection.\n\nA simplified representative snippet from an eBPF selector program looks like this:\n\n\
          ```c\nSEC(\"sk_reuseport/udp_selector\")\nint selector_prog(struct sk_reuseport_md *ctx) {\n    void *data     =\
          \ (void *)(long)ctx->data;\n    void *data_end = (void *)(long)ctx->data_end;\n\n    // Example: ensure we can read\
          \ a fixed-size header from the UDP payload\n    struct req_hdr *hdr = data;\n    if ((void *)(hdr + 1) > data_end)\
          \ {\n        // Payload too short, fall back to default\n        return SK_DROP; // or SK_PASS / SK_REUSEPORT_SELECT_OR_STAY,\
          \ etc.\n    }\n\n    // Safely use fields from the UDP payload\n    __u8 req_type = hdr->type;   // e.g., GET vs\
          \ SCAN\n    __u64 req_id  = hdr->id;\n\n    // Use payload-derived fields to choose a worker index\n    __u32 worker\
          \ = req_id % MAX_WORKERS;\n\n    return worker;\n}\n```\n\nBoth the hash-based selector and the scan_split selector\
          \ follow this same pattern of reading request metadata directly from the UDP payload via `ctx->data`/`ctx->data_end`\
          \ with explicit bounds checks before dereferencing."
