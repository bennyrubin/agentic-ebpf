  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector\n *\n * Approach / rationale\n\
    \ * --------------------\n * The previous selector derived a starting slot from sk_reuseport_md->hash and\n * then linearly\
    \ probed the reuseport array. Because the kernel hash is\n * per-flow, this effectively pinned each 4\u2011tuple to a\
    \ single worker. With the\n * workload using only a small number of UDP flows, this produced hot sockets\n * with long\
    \ queues and high tail latency, while other workers were underused.\n *\n * This version removes dependence on the kernel\
    \ hash and instead implements a\n * simple global round\u2011robin over the active workers:\n *\n *   - pebble_agent_state[0].counter\
    \ is a global packet counter.\n *   - pebble_agent_state[0].active is the number of active workers (as before).\n *  \
    \ - For each packet, we compute slot = counter % active and increment\n *     counter, then call bpf_sk_select_reuseport\
    \ once for that slot.\n *\n * Consequences:\n *   - Even a single client flow is spread across all active workers, so\
    \ CPU\n *     load and backlog are balanced, pushing the service ceiling closer to the\n *     true aggregate capacity\
    \ and reducing tail latency under load.\n *   - The selector is extremely simple: one map lookup, a few ALU ops, one\n\
    \ *     map write, and a single bpf_sk_select_reuseport call. There are no\n *     loops, minimal stack usage, and only\
    \ verifier\u2011friendly helpers.\n *   - User space only needs to maintain the existing Active field; Counter is\n *\
    \     managed by the program itself and starts from zero when the map is\n *     created or replaced.\n */\n\nstruct agent_state\
    \ {\n    __u32 active;   /* number of active workers (slots [0, active)) */\n    __u32 counter;  /* global packet counter\
    \ for round-robin */\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries, 1);\n    __type(key,\
    \ __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state SEC(\"\
    .maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n   \
    \ /* Lookup global agent state (index 0). */\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state,\
    \ &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n      \
    \  return SK_PASS;\n\n    /* Safety clamp: map holds at most 128 entries. */\n    if (active > 128)\n        active =\
    \ 128;\n\n    /* Global round-robin: slot = counter % active. */\n    __u32 counter = state->counter;\n    __u32 slot\
    \ = counter % active;\n    state->counter = counter + 1;\n\n    /* Single selection attempt; kernel ignores any additional\
    \ calls. */\n    bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\
    \nchar _license[] SEC(\"license\") = \"GPL\";"
