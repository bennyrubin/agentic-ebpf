idea_agent_prompt: "You are an expert in high-performance Linux UDP servers that load-balance traffic with SO_REUSEPORT and\
  \ a custom sk_reuseport eBPF program. The traffic comes in as short GET requests and longer SCAN requests with 99.5% of\
  \ the workload being GETs. Study the supplied artifacts (current eBPF implementation, run metrics, short codebase summary,\
  \ performance summary, and performance explanation hypothesis.) to understand how the system actually behaved and why. From\
  \ that understanding, produce a draft design document for a next-generation eBPF selector that improves on the observed\
  \ problems. Additionally, be creative, trying new, potentially drastic different approaches, when you believe it will improve\
  \ performance. Avoid speculation, note uncertainties, and assume reuseport slots, worker sockets, and database wiring are\
  \ correctly configured in the application.\n\nGuidelines:\n- Be precise, concise, and evidence-backed. Mark unknowns as\
  \ uncertain.\n- Always use the simplest possible solution, unless necessary to add more complexity to achieve the goal.\
  \ For example, don't introduce state or a map unless it is the only way to achieve the goal. Don't add complicated math\
  \ or algorithms or branching unless necessary.\n- For now, do not focus on fallbacks or error handling, nor logging to ensure\
  \ correctness.\n- Set \"status\": \"finish\" once you no longer need additional codebase information. Return \"continue\"\
  \ only when you truly need RAG answers to refine the design.\n- Questions must target codebase details you cannot infer\
  \ yet (e.g., \"In workload/client.go, how many sender threads are spawned?\"). The questions should be directly related\
  \ to the codebase and not abstract. Never repeat answered questions or ask about artifacts already provided. For example,\
  \ do not ask about the eBPF programs or logs that you already have access to and the RAG codebase knows nothing about.\n\
  - For now, do not include code that requires any configuration in userspace. The eBPF program should be self-contained.\
  \ You may include constant hyperparameters in the code, that you must tune yourself.\n- Do not worry about the selector\
  \ logic. You only need to use AgentUDPSelector and can change state in the pebble_agent_state map, but may not create a\
  \ new map.\n\nOutput strict JSON:\n{\n  \"status\": \"continue|finish\",\n  \"design_doc\": {\n    \"goals\": [\"clear goals\
  \ tied to observed issues\"],\n    \"evidence\": [\"key supporting observations from the hypothesis and performance summary\"\
  ],\n    \"architecture\": [\"specific approach that should be taken by the eBPF program. Do not include code, only a text,\
  \ design level idea/thought. Keep it to a few lines.\"],\n    \"risks\": [\"open questions or assumptions to verify from\
  \ the codebase\"]\n  },\n  \"questions\": [\"<=5 precise, code-focused RAG queries needed to finalize the design\"]\n}\n\
  \nRun context:\nEvaluation summary: The system is a UDP reuseport server with 6 workers pinned to 6 dedicated CPUs. An eBPF\
  \ sk_reuseport program (\u201Cagent\u201D) implements a global round\u2011robin over a sockarray; its `active` count is\
  \ set once to the worker count and never changed. Each UDP packet is steered to workers in a strict RR order, independent\
  \ of 5\u2011tuple or queue length. Each worker goroutine then processes packets serially: `ReadFromUDP` \u2192 `handleRequest`\
  \ \u2192 `WriteToUDP`. `handleRequest` implements GET and SCAN as pure busy\u2011waits of 10\xB5s and 2ms respectively,\
  \ fully occupying the worker for that duration. Stats are maintained per worker with no shared locks on the hot path. The\
  \ client has 6 independent `net.UDPConn`s, one per send/recv pair, uses an open\u2011loop rate limiter targeting 50\u2013\
  140k QPS, and measures latency from a timestamp embedded at request construction (before send) to the time the response\
  \ is read. It does not cap outstanding requests. The experiment harness records the client\u2019s overall p99 latency (GET+SCAN)\
  \ as the reported `load_p99_curve`. Server perf logs show very even per\u2011worker GET/SCAN counts and stable per\u2011\
  request service times (\u224810\xB5s GET, \u22482ms SCAN) across all loads. As offered rate increases, client logs show\
  \ outstanding requests growing, and measured p99 latency climbs gradually then sharply at 140k QPS, while server\u2011side\
  \ avg_get/avg_scan remain flat. The server relies on default UDP buffer sizes (only SO_REUSEADDR/SO_REUSEPORT are set),\
  \ so queuing and any overload are handled by kernel socket queues and user\u2011space scheduling rather than tuned buffers.\n\
  Evaluation hypothesis: The agent eBPF selector is correctly balancing traffic across all 6 reuseport workers; the observed\
  \ p99 latency behavior is driven by CPU\u2011bound, single\u2011threaded workers with a highly variable service time distribution\
  \ (short 10\xB5s GETs and rare 2ms SCANs), combined with an open\u2011loop client that does not adapt to queueing.\n\nEvidence\
  \ and mechanism:\n- **Balanced routing:** In every run (50k\u2013140k), server perf logs show nearly identical per\u2011\
  worker GET and SCAN counts (e.g., at 140k, workers process ~22.7\u201323.0k GETs and ~95\u2013125 SCANs per second each).\
  \ This matches the agent BPF program\u2019s design: a single global `counter` in `pebble_agent_state` drives round\u2011\
  robin selection over `Active` workers, and `Active` is set once to the worker count. Thus, routing skew or per\u2011flow\
  \ pinning is *not* causing hotspots; load is spread evenly.\n- **Worker model and service times:** Each worker processes\
  \ requests sequentially and busy\u2011waits inside `handleRequest` for exactly the configured `GetDelay`/`ScanDelay`. The\
  \ server\u2019s perf output measures only this busy\u2011wait window (the `elapsed` between `start := time.Now()` and the\
  \ end of the spin loop). It consistently reports ~10.1\u201310.5\xB5s for GETs and ~2.0ms for SCANs at all loads, confirming\
  \ the synthetic delays themselves are stable and not stretching with offered rate.\n- **Hidden per\u2011request overhead:**\
  \ The true per\u2011request service time from the worker\u2019s perspective also includes parsing, stats bookkeeping, response\
  \ formatting, `WriteToUDP`, and kernel networking/BPF overhead, which are *not* in the logged `avg_get`/`avg_scan`. At 140k,\
  \ aggregate throughput from server logs is ~137k ops/s (GET+SCAN), spread across 6 workers. This implies each worker handles\
  \ ~22.8k requests/s, i.e. an *effective* per\u2011request time of \u224843\u201344\xB5s. That is more than double the  ~20\xB5\
  s pure busy\u2011wait expectation (0.995\xD710\xB5s + 0.005\xD72ms), meaning parse+I/O/runtime overhead contributes roughly\
  \ another ~20\xB5s per request under load. With 6 workers, the cluster\u2019s effective capacity is therefore \u22486 /\
  \ 44\xB5s \u2248 135\u2013140k ops/s.\n- **Approaching/saturating capacity:** At 50\u2013100k QPS, offered load is well\
  \ below this ~135\u2013140k capacity. Client outstanding counts in logs stay low (tens of requests), and overall p99 latency\
  \ grows slowly from \u22482.2ms to \u22484.5ms. The \u22482ms floor at 50k aligns with SCAN delay: with only ~0.5% SCANs,\
  \ the 99th percentile at low load is dominated by the SCANs themselves with little queuing. By 100k (\u03C1\u22480.7 against\
  \ capacity), occasionally a GET lands behind a SCAN or a short queue, pushing p99 to ~4.5ms.\n  At the nominal 140k run,\
  \ the client\u2019s actual send rate (from its own logs) is ~137k QPS, almost exactly the server\u2019s throughput, indicating\
  \ the system is at or slightly above saturation. Outstanding requests grow to several hundred (e.g., 465\u2013680) before\
  \ later draining. This is classical behavior of a near\u2011saturated or mildly overloaded CPU\u2011bound service: queues\
  \ build up, but because the test duration is finite and the overload margin is small, the backlog eventually drains after\
  \ the send rate eases slightly. The server\u2019s per\u2011request synthetic delays remain near their configured values,\
  \ but the *wait time* in kernel socket queues and on the worker goroutines grows sharply.\n- **Impact of long SCANs (head\u2011\
  of\u2011line blocking):** Even though only ~0.5% of operations are SCANs, each SCAN busy\u2011waits for 2ms on its worker,\
  \ during which that worker cannot read new packets. The agent BPF policy is oblivious to request type and continues round\u2011\
  robining packets onto that worker at the same rate as onto others. As load rises and CPU headroom shrinks, a SCAN arriving\
  \ on a worker effectively creates a 2ms service gap on that socket. During this interval, the kernel\u2019s per\u2011socket\
  \ receive queue accumulates both GETs and additional SCANs for that worker. Once the SCAN finishes, the worker drains the\
  \ queued GETs one by one, each incurring not only its 10\xB5s busy\u2011wait but also the accumulated queueing delay from\
  \ being behind a 2ms request (and possibly other queued GETs). Since all workers see the same GET/SCAN mixture, this head\u2011\
  of\u2011line blocking pattern repeats uniformly across workers. The high variance between 10\xB5s GETs and 2ms SCANs inflates\
  \ the service\u2011time variance E[S\xB2]; with utilization \u03C1 rising toward 1, standard M/G/1/c queueing effects produce\
  \ a super\u2011linear increase in tail latency even though the mean service time stays almost constant.\n- **Client measurement\
  \ and open\u2011loop behavior:** The workload client embeds a timestamp when constructing the request (before `Write` and\
  \ after rate\u2011limiter gating), and computes latency as `recvTime - sendTime`. Thus, the reported p99 includes: (a) any\
  \ per\u2011packet delay in the client process or kernel send path, (b) queuing in the server\u2019s socket buffers and worker\
  \ goroutine, and (c) the synthetic GET/SCAN delay. There is no feedback from outstanding count to the send loop: send workers\
  \ continue to inject requests at the target rate as long as the limiter allows, regardless of rising outstanding. At 140k,\
  \ this open\u2011loop behavior keeps the offered rate pinned near the server\u2019s capacity, so queueing remains high and\
  \ p99 stabilizes around ~13.8ms, far above the 2ms SCAN baseline.\n- **No evidence of buffer tuning or packet loss:** The\
  \ server does not alter SO_RCVBUF/SO_SNDBUF, relying on default UDP buffers. Despite heavy load, client logs always end\
  \ with `sent == recv`, indicating that kernel buffers were sufficient to hold transient bursts and that drops were not significant\
  \ in these runs. The absence of read/write errors in server logs further supports that the behavior is dominated by queuing\
  \ delay rather than I/O errors.\n\nPutting this together: the agent eBPF round\u2011robin policy is functioning as intended\
  \ and providing even load distribution; the root cause of the observed latency curve is that each busy\u2011waiting, single\u2011\
  threaded worker sees a mixed GET/SCAN workload with large service\u2011time variance, and the total per\u2011request CPU\
  \ cost (busy\u2011wait plus parse/I/O overhead) puts the 6\u2011worker server\u2019s true capacity at ~135\u2013140k ops/s.\
  \ As the open\u2011loop client pushes toward that capacity, socket and goroutine queues grow, particularly behind 2ms SCANs,\
  \ and the client\u2019s overall p99 latency (including queuing and SCANs) rises from \u22482ms at low load to \u22484\u2013\
  5ms near 100k and \u224814ms near 140k, even though the server\u2019s internal GET/SCAN delay measurements remain nearly\
  \ constant.\nBest program metrics: policy=agent, rates=[50000, 60000, 80000, 100000, 140000], load_p99_curve=[(50000.0,\
  \ 2.183), (60000.0, 2.583), (80000.0, 3.985), (100000.0, 4.487), (140000.0, 13.774)], load_p99_stddev_curve=[(50000.0, 0.0),\
  \ (60000.0, 0.0), (80000.0, 0.0), (100000.0, 0.0), (140000.0, 0.0)], compile=1.0, load=1.0, combined_score=-53.945, run_success=1.0\n\
