      \ >= active)\n       scan_slots = active - 1;  // always leave at least 1 GET-only\n\n   __u32 get_slots = active -\
      \ scan_slots;\n\n   if (is_scan) {\n       __u32 idx_in_scan = pick_slot(rnd, scan_slots);\n       slot = get_slots\
      \ + idx_in_scan;      // scan workers: [get_slots, active)\n   } else if (is_get) {\n       slot = pick_slot(rnd, get_slots);\
      \    // GET workers: [0, get_slots)\n   } else {\n       goto random_all;\n   }\n   ```\n\n   - With 6 workers, this\
      \ yields `scan_slots=1` (no regression) or 2 depending on formula; you can tune divisor (e.g., `/3` to get 2 of 6).\
      \ The experiment will tell whether a 2-of-6 SCAN subset improves behavior at 180k without tanking 140\u2013160k.\n\n\
