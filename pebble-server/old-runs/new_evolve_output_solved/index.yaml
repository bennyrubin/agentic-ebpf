  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector: stateless per-packet random\
    \ load balancing.\n *\n * Motivation\n * ----------\n * The previous selector derived a socket index from reuse->hash\
    \ and then\n * linearly probed:\n *\n *     slot = reuse->hash % active\n *\n * With a small number of client flows (often\
    \ 1) and many SO_REUSEPORT\n * workers (default 64), this \"flow-hash pinning\" sends all packets from a\n * given flow\
    \ to a single worker. That leaves most workers idle while one\n * builds a long UDP queue, causing drops and high tail\
    \ latency.\n *\n * Approach\n * --------\n * - Keep a single configuration knob: agent_state.active, set once from Go\n\
    \ *   to the number of active workers.\n * - For each packet, draw a pseudo-random 32-bit value using\n *   bpf_get_prandom_u32(),\
    \ then compute:\n *\n *       slot = rnd % active;\n *\n * - Call bpf_sk_select_reuseport exactly once with this slot.\
    \ If the helper\n *   fails for any reason, fall back to SK_PASS so the kernel's default\n *   selection can proceed.\n\
    \ *\n * Properties\n * ----------\n * - Eliminates flow-hash pinning: even a single high-rate flow is spread\n *   across\
    \ all active workers, avoiding per-socket queue hot spots and\n *   improving utilization.\n * - Simple, stateless, and\
    \ self-contained: no new maps, no extra userspace\n *   wiring, and only O(1) work per packet (no loops).\n * - Provides\
    \ a clean base for future refinements (e.g., GET/SCAN-specific\n *   logic or light feedback) without additional complexity\
    \ today.\n */\n\nstruct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n\
    \    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md\
    \ *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n  \
    \  if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\
    \n    /* Clamp to the maximum size of pebble_udp_targets for safety. */\n    if (active > 128)\n        active = 128;\n\
    \n    /* Per-packet random selection over [0, active). */\n    __u32 rnd = bpf_get_prandom_u32();\n    __u32 slot = rnd\
    \ % active;\n\n    /* Single helper call; kernel ignores additional calls anyway. */\n    (void)bpf_sk_select_reuseport(reuse,\
    \ &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") =\
    \ \"GPL\";"
