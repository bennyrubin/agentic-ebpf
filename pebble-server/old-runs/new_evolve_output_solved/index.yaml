  parent_id: 18f802b0133a45f5b4b368221b18af9f
  eval_summary: "The system is a synthetic UDP key-value emulator with 6 SO_REUSEPORT workers and an eBPF sk_reuseport program\
    \ (\u201Cagent\u201D) that randomly selects a worker per packet. The agent eBPF code is stateless, reads an `active` worker\
    \ count from a pinned array, clamps it to \u2264128, draws a random 32-bit value with `bpf_get_prandom_u32`, maps it into\
    \ [0, active) via a multiply\u2013shift, and calls `bpf_sk_select_reuseport` exactly once. There is no per-flow state\
    \ or bias in the selector.\n\nOn the server side, `spawnWorker` creates one goroutine per UDP socket that runs a tight\
    \ loop: `ReadFromUDP` \u2192 `handleRequest` \u2192 `WriteToUDP`. There is no internal worker pool: each worker processes\
    \ at most one request at a time, strictly sequentially. `handleRequest` implements GET and SCAN by busy-waiting for fixed\
    \ configured delays (`get_delay=10\xB5s`, `scan_delay=2ms`); SCAN cost does *not* depend on scan limit or key range. No\
    \ special socket buffer tuning is done beyond SO_REUSEADDR/SO_REUSEPORT. The client is an open-loop generator targeting\
    \ fixed rates (80k\u2013180k req/s) with a single send worker by default; it does not wait for responses before sending\
    \ more, and simply tracks outstanding requests.\n\nThe per-second `[perf]` logs show that across all tested loads, traffic\
    \ is distributed almost perfectly evenly across the 6 workers: each one sees essentially the same GET and SCAN counts\
    \ and similar average service times (\u224810\u201312\xB5s for GET, \u22482.0\u20132.1ms for SCAN). This confirms that\
    \ the eBPF agent selector is balancing packets uniformly and that workers themselves are not skewed. Aggregate completed\
    \ throughput rises with offered load up to about 135\u2013140k req/s (e.g., at 140k offered, ~136\u2013138k GETs/s plus\
    \ ~600\u2013700 SCANs/s), and then caps around ~145\u2013150k completed requests per second at both 160k and 180k offered.\
    \ Meanwhile, client logs show that at 80k and 100k, outstanding requests remain small and all sends are quickly matched\
    \ by receives; at 140k, outstanding grows into the low thousands but drains during the run; and at 160k/180k, outstanding\
    \ grows steadily into tens and then hundreds of thousands before draining only after the send phase ends. The reported\
    \ p99 latencies (3\u20135ms at 80k/100k, ~16ms at 140k, ~450ms at 160k, ~1.4s at 180k) mirror this queue growth. Throughout,\
    \ server-side average per-request delays remain near the configured 10\xB5s/2ms, demonstrating that long end-to-end latencies\
    \ come from waiting to be *started*, not from slower processing once a request is being handled."
  eval_hypothesis: "The observed behavior is best explained by a throughput ceiling in the single-threaded per-worker server\
    \ design under open-loop load, not by any problem in the eBPF steering. The agent eBPF program performs unbiased per-packet\
    \ random selection across the 6 reuseport sockets, which the server logs confirm via nearly identical per-worker GET/SCAN\
    \ counts and service times. Each worker goroutine, however, handles only one UDP datagram at a time and implements GET\
    \ and SCAN as pure busy-waits (10\xB5s and 2ms respectively). With \u224899\u201399.5% GETs and a small fraction of 2ms\
    \ SCANs, the synthetic delays plus syscall and Go runtime overhead yield an effective per-request cost on the order of\
    \ a few tens of microseconds. Given 6 such workers, the system\u2019s sustainable throughput empirically tops out around\
    \ 145\u2013150k requests per second.\n\nAt 80k and 100k req/s, the offered load is comfortably below this capacity. UDP\
    \ receive queues and the per-worker loops stay short; most requests start service almost immediately, and p99 latency\
    \ is dominated by the fixed 2ms SCAN cost. Around 140k req/s, the system runs close to saturation: the completed throughput\
    \ nearly matches the offered rate, but small queues begin to accumulate in the kernel\u2019s UDP receive buffers and ahead\
    \ of each worker\u2019s single-threaded loop. This extra waiting time raises p99 into the tens of milliseconds while average\
    \ per-request service times on the server remain at the configured 10\xB5s/2ms.\n\nAt 160k and 180k req/s, the open-loop\
    \ client drives the server beyond its true capacity. The server can still only complete ~150k requests per second, so\
    \ the arrival rate exceeds the departure rate. The excess packets accumulate in the kernel\u2019s per-socket queues and\
    \ effectively form FIFO backlogs for each worker. Because each worker processes requests strictly sequentially and SCANs\
    \ block that worker\u2019s goroutine for 2ms, any GETs landing behind a SCAN incur head-of-line blocking on top of the\
    \ global backlog. Over the course of the run, outstanding client requests grow into the tens and then hundreds of thousands,\
    \ consistent with the observed long drain period after sending stops and with p99 latencies in the hundreds of milliseconds\
    \ to over one second. The server\u2019s `[perf]` metrics still show balanced load and stable 10\xB5s/2ms service times,\
    \ confirming that the agent eBPF selector is functioning correctly; the latency explosions are a direct consequence of\
    \ saturating a single-request-at-a-time worker model that busy-waits per request, not of misrouted or imbalanced traffic\
    \ at the eBPF layer."
