    assistant_content_raw: "{\n  \"status\": \"finish\",\n  \"design_doc\": {\n    \"goals\": [\n      \"Lower GET tail latency\
      \ (especially p99) under mixed GET/SCAN load by reducing the chance that a GET waits behind a 2ms SCAN on the same worker\
      \ socket.\",\n      \"Keep aggregate sustainable throughput in the same ballpark as the current ~145\u2013150k req/s\
      \ ceiling, without changing userspace worker/socket wiring or adding new kernel maps.\",\n      \"Keep the eBPF selector\
      \ simple and self-contained: reuse AgentUDPSelector, only touch pebble_agent_state and pebble_udp_targets, and avoid\
      \ additional state or complex per-packet logic beyond minimal payload classification.\"\n    ],\n    \"evidence\": [\n\
      \      \"Wire format: GET requests are exactly `\\\"GET\\\" SP key SP reqID`; SCAN requests are `\\\"SCAN\\\" SP key\
      \ SP scanLimit SP reqID`, with uppercase methods, single spaces, and no newline/terminator bytes. This makes cheap classification\
      \ by ASCII prefix (`GET ` vs `SCAN `) straightforward in eBPF.\",\n      \"pebble_agent_state.Active is written once\
      \ at startup from the configured worker count and never updated again, so AgentUDPSelector can treat it as a constant\
      \ number of active reuseport slots for the process lifetime.\",\n      \"updateTargetsMap writes worker socket FDs into\
      \ pebble_udp_targets at contiguous indices 0..N-1, where the index matches the logical worker index used elsewhere,\
      \ so any index-based partitioning or bias in the selector directly corresponds to specific worker goroutines.\",\n \
      \     \"Existing experiments show that the current stateless, per-packet random AgentUDPSelector distributes GET and\
      \ SCAN traffic nearly perfectly evenly across all 6 workers, and each worker\u2019s average GET/SCAN service times match\
      \ the synthetic delays (~10\u201312\xB5s, ~2.0\u20132.1ms). This confirms that the selector is unbiased and that workers\
      \ are symmetric.\",\n      \"Despite balanced steering, client-side p99 latency explodes once offered load exceeds ~140k\
      \ req/s, while server-side per-request service times stay fixed. This points to queueing delay ahead of single-threaded\
      \ workers, with long 2ms SCANs causing head-of-line blocking for subsequent GETs on each per-socket FIFO queue.\",\n\
      \      \"SCANs are rare (~0.5\u20131% of requests) but ~200x more expensive than GETs, so they consume a large fraction\
      \ of total CPU time and are the main source of long per-socket stalls when queued in front of GETs.\"\n    ],\n    \"\
      architecture\": [\n      \"Extend AgentUDPSelector to classify each UDP datagram as a GET or SCAN purely by inspecting\
      \ the first few payload bytes in sk_reuseport_md->data, using strict bounds checks and simple ASCII comparisons (`\\\
      \"GET\\\"` followed by space vs `\\\"SCAN\\\"` followed by space); treat anything that does not look like a SCAN prefix\
      \ as a GET for steering purposes.\",\n      \"Continue to read the active worker count from pebble_agent_state.Active\
      \ and clamp it to a safe upper bound (\u2264128, matching pebble_udp_targets capacity); if active is 0, fall back to\
      \ default SK_PASS behavior as today.\",\n      \"For GET-classified packets, preserve the current behavior: select a\
      \ reuseport slot uniformly at random across the full [0, active) range using the existing fast multiply\u2013shift mapping\
      \ of bpf_get_prandom_u32, and call bpf_sk_select_reuseport once with that slot.\",\n      \"For SCAN-classified packets,\
      \ restrict selection to a small, fixed prefix subset of the reuseport slots [0, SCAN_LANES), where SCAN_LANES is a compile-time\
      \ constant hyperparameter (e.g., 1) and SCAN_LANES \u2264 active; within that subset, choose the slot uniformly at random\
      \ (or trivially 0 if SCAN_LANES == 1) and pass it to bpf_sk_select_reuseport.\",\n      \"This \u201Coverlapping subset\u201D\
      \ design makes a small number of low-index workers SCAN-preferred (they see all SCANs plus their fair share of GETs),\
      \ while the remaining workers handle only GETs. GET traffic still leverages all active workers for throughput, but most\
      \ GETs avoid sharing queues with SCANs, reducing the probability of GETs suffering 2ms head-of-line blocking on any\
      \ given worker.\"\n    ],\n    \"risks\": [\n      \"Static SCAN_LANES sizing: Choosing a fixed number of SCAN-preferred\
      \ slots (e.g., 1 out of 6) is tuned to the current ~99\u201399.5% GET / 0.5\u20131% SCAN mix and 10\xB5s/2ms delays.\
      \ If the workload mix or synthetic delays change materially, this static choice may either over-concentrate SCANs (causing\
      \ very high SCAN latency and saturating one worker) or under-concentrate them (reducing the benefit to GET tail latency).\"\
      ,\n      \"Uneven CPU utilization: Concentrating all SCANs on a small subset of workers will drive those workers to\
      \ higher utilization than the rest. Under high offered load, SCAN-preferred workers may saturate while others remain\
      \ less loaded, potentially capping throughput slightly below the perfectly even distribution case. This needs empirical\
      \ validation against the ~145\u2013150k req/s baseline.\",\n      \"Residual GET impact on SCAN-preferred workers: GETs\
      \ are still distributed across all active workers, including the SCAN-preferred ones. Any GETs that happen to land on\
      \ these workers will still experience head-of-line blocking behind queued SCANs, so GET tail latency will improve relative\
      \ to the fully mixed baseline but not be completely isolated from SCAN behavior.\",\n      \"Payload parsing correctness:\
      \ The selector must implement safe, verifier-friendly checks around reuse->data and reuse->data_end before reading any\
      \ bytes. Misclassification (e.g., treating malformed or short SCAN payloads as GETs or vice versa) could either dilute\
      \ the SCAN concentration benefit or further overload the SCAN-preferred workers; careful, minimal parsing logic is required.\"\
      ,\n      \"Assumption of stable active/target mapping: The design assumes that pebble_agent_state.Active remains constant\
      \ for the process lifetime and that pebble_udp_targets indices 0..(active-1) always correspond to currently valid worker\
      \ sockets. If future server code changes workers dynamically or uses non-contiguous target indices, the static [0, SCAN_LANES)\
      \ prefix assumption would need revisiting.\"\n    ]\n  },\n  \"questions\": []\n}"
