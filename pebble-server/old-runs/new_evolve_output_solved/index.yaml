    - question: Does any code in internal/server/server.go (especially in spawnWorker and handleRequest) maintain per-client
        or per-flow state keyed by the client address (net.UDPAddr) that would rely on all packets from a given client being
        handled by the same worker?
      answer:
        answer: No. The worker function in internal/server/server.go reads each UDP packet, immediately passes only the packet
          bytes (buf[:n]) and the worker index to handleRequest, and then writes the returned response back to the source
          address for that single packet. The client address (net.UDPAddr) is only used as the destination for WriteToUDP
          and is not stored or used as a key for any state. There is no per-client or per-flow state keyed by net.UDPAddr
          in spawnWorker, nor is any such state passed into or out of handleRequest, so packet affinity to a particular worker
          is not required by this code.
        code_snippets:
        - path: internal/server/server.go
          snippet: "func (s *Server) spawnWorker(ctx context.Context, idx int, conn *net.UDPConn) {\n\t...\n\t\tfor {\n\t\t\
            \tn, addr, err := conn.ReadFromUDP(buf)\n\t\t\tif err != nil {\n\t\t\t\t...\n\t\t\t}\n\n\t\t\tresponse := s.handleRequest(idx,\
            \ buf[:n])\n\t\t\tif response == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tif _, err := conn.WriteToUDP(response,\
            \ addr); err != nil {\n\t\t\t\t...\n\t\t\t}\n\t\t}\n\t}() \n}"
