  idea_payload: null
  idea_summary: Bootstrap node
  parent_id: null
  eval_summary: "The agent policy\u2019s eBPF program is not doing any dynamic, load-aware steering: on every packet it looks\
    \ up pebble_agent_state.Active (set once at load to the configured worker count, 6) and deterministically picks a reuseport\
    \ slot as `slot = reuse->hash % active`, then calls `bpf_sk_select_reuseport` and returns SK_PASS. The Go server always\
    \ opens 6 SO_REUSEPORT UDP sockets, inserts all 6 FDs into the pebble_udp_targets map at indices 0\u20135, and spawns\
    \ one goroutine per worker. Each worker goroutine runs a tight loop of `ReadFromUDP` \u2192 `handleRequest` \u2192 `WriteToUDP`;\
    \ `handleRequest` parses the request, performs only a busy\u2011wait delay (10\u202F\xB5s for GET, 2\u202Fms for SCAN)\
    \ plus some light parsing/formatting and stats accounting, and returns a response. There are no other blocking operations\
    \ on the hot path, so each worker is effectively a single\u2011threaded server whose capacity is bounded by that synthetic\
    \ delay and a small fixed per\u2011request overhead. The client runs open\u2011loop at fixed target rates (80k\u2013180k\
    \ req/s) with a small number of UDPConns (one per send worker, each with its own source port) and matching per\u2011conn\
    \ receive goroutines. The experiment logs show that in each run only 3\u20135 of the 6 server workers ever report traffic\
    \ in a given second, and which indices are active changes between runs. Aggregate server throughput flattens between ~70k\
    \ and ~105k req/s depending on the run, while the client continues to inject traffic at the configured rate, so outstanding\
    \ requests build up and a growing fraction of responses never arrive; the client logs these as \u201Cresponses missing\u201D\
    . Overall p99 latency (measured at the client over all requests) is lowest around 100k req/s and very high at 80k and\
    \ \u2265140k, reflecting how long packets spend queued in the kernel and at the workers before they can be processed by\
    \ the limited number of busy\u2011waiting goroutines; the server\u2019s own \u201C[perf] avg_get/avg_scan\u201D numbers\
    \ remain fixed near the configured synthetic delays because they do not include time spent in queues."
  eval_hypothesis: "The observed behavior is driven by the combination of (1) the agent eBPF selector doing a simple, static\
    \ hash\u2011based choice of reuseport slot per packet/flow (`slot = reuse->hash % active` with `active = 6`), (2) a small\
    \ number of client UDP flows (one per send worker / source port) so there are fewer flows than server workers, and (3)\
    \ each server worker processing requests strictly sequentially with busy\u2011wait delays. At startup, all 6 worker sockets\
    \ are inserted into the pebble_udp_targets map and the agent state\u2019s Active count is set to 6, but because the client\
    \ only originates a handful of flows, those flows hash onto only 3\u20135 of the 6 slots in each run. Which specific workers\
    \ are used (and how many flows collide on the same worker) varies randomly from run to run as source ports and hashes\
    \ change. Within a run, each packet for a given flow is effectively pinned to its chosen worker; that worker\u2019s goroutine\
    \ then handles the request synchronously and spends ~10\u202F\xB5s (GET) or 2\u202Fms (SCAN) in a busy\u2011wait loop\
    \ for every request. This architecture means: (a) the system\u2019s true parallelism is limited to the number of reuseport\
    \ slots that actually receive traffic, not the configured 6 workers; and (b) if multiple high\u2011rate client flows hash\
    \ to the same worker, that worker becomes a hot spot and builds a long queue while other workers are underutilized. When\
    \ the client target rate is near or above the sum of the capacities of the few workers that are actually receiving traffic,\
    \ packets accumulate in the per\u2011socket UDP receive queues. Because handleRequest\u2019s measured latency only times\
    \ the busy\u2011wait, the server\u2019s \u201C[perf] avg_get/avg_scan\u201D stay near 10\u202F\xB5s/2\u202Fms even as\
    \ queues grow large. From the client\u2019s perspective, however, end\u2011to\u2011end latency includes this queueing,\
    \ so p99 balloons into the multi\u2011second range at 80k and \u2265140k req/s. Once the socket receive buffers fill,\
    \ new datagrams are dropped silently by the kernel, so the client sees increasing \u201Cresponses missing\u201D counts\
    \ and outstanding request counts that never drain before the run ends. The non\u2011monotonicity in throughput and p99\
    \ across rates (e.g., 100k performing better than 80k) is explained by the random hash placement of a small number of\
    \ flows onto 6 workers: in the 100k run, flows happen to be spread relatively evenly across 5 workers, keeping each below\
    \ saturation and yielding lower queueing, while in the 80k and higher\u2011rate runs, more flows collide on fewer workers,\
    \ reducing effective usable capacity and causing larger queues, more UDP drops, and worse tail latency even at a lower\
    \ offered rate."
