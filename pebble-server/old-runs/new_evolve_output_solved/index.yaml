          \ Active: uint32(workers) }` is constructed; no other fields are set.\n- If objs.PebbleAgentState is non\u2011nil,\
          \ the code performs `objs.PebbleAgentState.Update(&key, &state, ebpf.UpdateAny)` with key 0 to store that struct\
          \ instance in the map.\n\nThere are no other references in the provided Go code that depend on the size or layout\
          \ of ebpfutil.AgentSelectorAgentState, nor any other uses of that struct in this file. Its only use here is as the\
          \ value type for that single Update call where Active is populated."
        code_snippets:
        - path: internal/server/ebpf.go
          snippet: "func loadAgent(workers int) (*ebpfPolicy, error) {\n\t...\n\tvar key uint32 = 0\n\tstate := ebpfutil.AgentSelectorAgentState{\n\
            \t\tActive: uint32(workers),\n\t}\n\tif objs.PebbleAgentState != nil {\n\t\tif err := objs.PebbleAgentState.Update(&key,\
            \ &state, ebpf.UpdateAny); err != nil {\n\t\t\tobjs.Close()\n\t\t\treturn nil, fmt.Errorf(\"configure agent state:\
            \ %w\", err)\n\t\t}\n\t}\n\n\treturn &ebpfPolicy{\n\t\tname:    \"agent\",\n\t\tprogram: objs.AgentUdpSelector,\n\
