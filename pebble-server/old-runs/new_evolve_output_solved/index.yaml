    \    int is_scan = 0;\n\n    if (c0 == 'G' && c1 == 'E' && c2 == 'T' && c3 == ' ') {\n        is_get = 1;\n    } else\
    \ if (payload + 5 <= data_end) {\n        __u8 c4 = payload[4];\n        if (c0 == 'S' && c1 == 'C' && c2 == 'A' && c3\
