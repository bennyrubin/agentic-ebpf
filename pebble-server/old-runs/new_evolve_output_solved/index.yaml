    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector: GET/SCAN-aware split with a\
    \ single dedicated SCAN worker.\n *\n * Approach\n * --------\n * Workload: ~99.5% GET, rare but ~2ms SCANs. Purely random\
    \ balancing lets\n * GETs frequently land behind SCANs on the same worker, which blows up GET\n * tail latency once queues\
    \ form.\n *\n * This selector is stateless and per-packet, but it peeks at the UDP payload\n * and treats long SCANs differently\
    \ from short GETs:\n *\n *   - UDP payload starts at reuse->data + 8 (after UDP header).\n *   - Classify request by ASCII\
    \ prefix:\n *       \"GET \"  -> treated as GET-like\n *       \"SCAN \" -> treated as SCAN\n *       other / malformed\
    \ -> also treated as GET-like\n *\n *   - pebble_agent_state.Active (clamped to 128) is the total number of\n *     active\
    \ reuseport slots.\n *\n *   - For active >= 2:\n *       * Reserve exactly one high-index worker for SCANs:\n *\n * \
    \            scan_slots = 1\n *             get_slots  = active - 1\n *\n *       * SCAN requests always go to that single\
    \ SCAN worker at index\n *         get_slots (i.e., the last slot).\n *\n *       * GET and all \"unknown\"/misparsed\
    \ payloads are randomly mapped into\n *         the GET subset [0, get_slots), never into the SCAN slot.\n *\n *   - For\
    \ active <= 1 or missing state: fall back to unbiased random over\n *     [0, active) (or SK_PASS when active==0).\n *\n\
    \ * Rationale\n * ---------\n * A previous variant that spread SCANs over multiple workers sacrificed too\n * much GET\
    \ capacity: fewer workers remained available for GETs, so GET p99\n * inflated again at high load. This version returns\
    \ to a single SCAN-only\n * worker, maximizing GET capacity while still isolating SCAN-induced head-of-\n * line blocking\
    \ to one socket.\n *\n * Treating unknown payloads as GET-like keeps them out of the SCAN worker,\n * avoiding accidental\
    \ reintroduction of SCAN latency into other traffic.\n *\n * Implementation details\n * ----------------------\n * - Uses\
    \ only existing maps: pebble_agent_state and pebble_udp_targets.\n * - No additional state; O(1) per packet with a handful\
    \ of byte loads.\n * - RNG -> index mapping uses a 32x32->64 multiply and high 32 bits to avoid\n *   divisions in the\
    \ hot path.\n * - Single bpf_sk_select_reuseport() call per packet, no loops, verifier-safe\n *   bounds checks against\
    \ data_end.\n */\n\nstruct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n\
    \    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_agent_state SEC(\".maps\");\n\nstatic __always_inline __u32 pick_slot(__u32 rnd, __u32 range)\n{\n    /* Map\
