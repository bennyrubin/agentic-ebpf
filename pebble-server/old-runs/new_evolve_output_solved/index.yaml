    \ the recent feedback):\n  - 80k: ~0.36 ms\n  - 100k: ~3.33 ms\n  - 140k: ~6.9 ms\n  - 160k: ~9.4 ms\n  - 180k: ~470 ms\n\
    - Takeaways:\n  - At **low load (80k/100k)** you\u2019re slightly better than baseline, but not better than the previous\
    \ 1-SCAN-worker design.\n  - At **140k**, p99 is **worse than baseline** (28 ms vs ~16 ms) and much worse than the 1-SCAN-worker\
    \ design (~6.9 ms).\n  - At **160k and 180k**, p99 latency is **dramatically worse than both baseline and the 1-SCAN-worker\
    \ design**.\n  - Root cause: with 2 SCAN-only workers you only have **4 GET workers**, so you hit the per-worker capacity\
    \ wall much earlier; GETs now queue behind other GETs on 4 sockets instead of 5 or 6.\n\n- **SCAN capacity vs GET capacity\
    \ trade-off**:\n  - This change improves SCAN capacity (2 SCAN workers instead of 1), but the workload is ~99.5% GET:\n\
    \    - The extra SCAN capacity doesn\u2019t help the scoring metric.\n    - Losing one more GET-capable worker **dominates**:\
    \ queues explode sooner, so GET p99 inflates badly at 140k+.\n\n**Top changes to try next**\n\n1. **Go back to exactly\
    \ one SCAN-only worker (for active \u2265 2)**\n\n   Goal: restore GET capacity (5 GET workers out of 6) while keeping\
    \ the good parts of this attempt (treat unknowns as GET-like).\n\n   Concretely, in the EVOLVE block:\n\n   ```c\n   /*\
    \ ... after clamping active ... */\n\n   if (active <= 1)\n       goto random_all;\n\n   /* Reserve exactly one SCAN worker\
