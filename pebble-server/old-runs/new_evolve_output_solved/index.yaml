      \ \u201Cunknown\u201D falls back to `random_all`, which can send them to the SCAN subset and reintroduce head-of-line\
      \ risk for those requests.\n\n   Change:\n\n   - Instead of `goto random_all;` on unknown, treat them as GETs and keep\
      \ them out of scan slots:\n\n   ```c\n   if (!is_get && !is_scan) {\n       /* Treat unknown as GET-like: avoid scan\
      \ slots. */\n       __u32 scan_slots = 1;      // or same logic as above\n       __u32 get_slots = active - scan_slots;\n\
      \       slot = pick_slot(rnd, get_slots);\n       (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\
      \       return SK_PASS;\n   }\n   ```\n\n   - This keeps the SCAN subset dedicated to true SCANs while preserving the\
      \ GET tail benefit even if the workload evolves or the parser occasionally fails.\n\n3. **(More aggressive, if 180k\
      \ still dominates the score) Allow a tiny fraction of GETs onto SCAN workers to reclaim some capacity**\n\n   Only if\
      \ experiments show the SCAN-only core is heavily underutilized for GET at 140\u2013160k and you\u2019re still missing\
      \ the 180k target:\n\n   - For GETs, introduce a second RNG branch to occasionally send a GET to the scan subset, e.g.:\n\
