      \ than both baseline and the 1-SCAN-worker design**.\n  - Root cause: with 2 SCAN-only workers you only have **4 GET\
      \ workers**, so you hit the per-worker capacity wall much earlier; GETs now queue behind other GETs on 4 sockets instead\
      \ of 5 or 6.\n\n- **SCAN capacity vs GET capacity trade-off**:\n  - This change improves SCAN capacity (2 SCAN workers\
