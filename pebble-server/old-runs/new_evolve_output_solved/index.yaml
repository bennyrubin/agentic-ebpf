  generation_feedback: "**Assessment vs idea**\n\n- The code clearly implements the intended idea: classify payload as `\"\
    GET \"` vs `\"SCAN \"` and steer SCANs to a reserved subset of workers using only `pebble_agent_state` and `pebble_udp_targets`,\
    \ with a single `bpf_sk_select_reuseport` call and simple O(1) logic.\n- Logs confirm the split is actually happening:\n\
    \  - At 80k (`agent-80000`): workers 0\u20134 see only GETs, worker 5 sees only SCANs:\n    - e.g. `worker=0..4` each\
    \ `gets\u224812.3\u201312.5k, scans=0`; `worker=5 gets=0, scans=318 avg_scan\u22482.0002ms`.\n  - So classification is\
    \ correct and all 6 workers are used, just asymmetrically (5 GET-only, 1 SCAN-only).\n- Metrics show the behavior change\
    \ matches the target of protecting GETs from SCAN head-of-line blocking:\n  - Baseline (parent summary): GET p99/overall\
    \ p99 blew up to ~16ms at 140k, ~450ms at 160k, ~1.4s at 180k.\n  - This attempt (likely GET p99):\n    - 80k: 0.359 ms\n\
    \    - 100k: 3.333 ms\n    - 140k: 6.876 ms\n    - 160k: 9.449 ms\n    - 180k: 469.78 ms  \n  - That\u2019s a *huge* improvement\
    \ at 140k and especially 160k (from ~450ms to ~9ms), and a big improvement at 180k (from ~1.4s to ~470ms), while still\
    \ using only reuseport/eBPF steering.\n\nSo in terms of **idea intent** (lower GET tail under mixed GET/SCAN without changing\
    \ userspace or maps) this attempt is largely successful, especially around the 140\u2013160k regime.\n\n---\n\n**Key behavior\
    \ / issues from metrics and logs**\n\n- **Worker utilization**\n  - Workers 0\u20134: evenly loaded with GETs, no SCANs\
    \ \u2192 good, unbiased GET hashing across GET workers.\n  - Worker 5: only SCANs, no GETs \u2192 full isolation of SCAN\
    \ traffic onto a single socket.\n- **Effect on latency**\n  - At 80k\u2013160k, GET p99 is now dominated by queuing behind\
    \ *other GETs*, not SCANs; p99 < 10ms even at 160k.\n  - At 180k, p99 jumps to ~470ms. This is still overload behavior:\n\
    \    - Even with SCAN isolation, 5 GET workers have finite capacity; at 180k we\u2019re again driving the system *above*\
    \ total GET service rate, so GETs now queue behind other GETs on those 5 sockets.\n    - Additionally, the single SCAN\
    \ worker is almost certainly saturated: all ~0.5\u20131% of SCANs are serialized on one 2ms-at-a-time goroutine. SCAN\
    \ latencies will explode and can still contaminate higher percentiles if the scoring uses overall or mixed metrics anywhere.\n\
    - **Throughput considerations**\n  - You\u2019ve removed SCAN work from 5 workers and concentrated it on worker 5. For\
    \ GETs this is great (they avoid 2ms head-of-line), but:\n    - Worker 5\u2019s CPU is effectively \u201Csacrificed\u201D\
    \ to SCANs and can no longer help with GETs.\n    - At very high offered rates (180k), this makes the GET cluster effectively\
    \ 5 workers worth of capacity instead of 6; once the client drives beyond that capacity, GET queues still grow, hence\
    \ the 469ms p99 at 180k.\n\nOverall takeaway: the design **drastically improves GET p99 at moderate/high load (up to ~160k)**,\
    \ but at the extreme overload point (180k) we still hit a capacity wall: 5 GET-only workers are not enough, and 1 SCAN-only\
    \ worker is badly overloaded.\n\n---\n\n**Top changes to try next**\n\n1. **Spread SCANs across a *small subset* of workers\
    \ instead of exactly one**\n\n   Goal: avoid completely sacrificing one core and reduce SCAN-queue blowups, while still\
    \ keeping most workers clean for GETs.\n\n   Concrete change (within EVOLVE-BLOCK):\n\n   - Instead of hardcoding `scan_slots\
    \ = 1`, make it proportional to `active`, but small. Example:\n\n   ```c\n   /* Reserve a small subset of high-index workers\
    \ for SCANs. */\n   __u32 scan_slots = active / 4;  // 25% of workers\n   if (scan_slots == 0)\n       scan_slots = 1;\n\
    \   if (scan_slots >= active)\n       scan_slots = active - 1;  // always leave at least 1 GET-only\n\n   __u32 get_slots\
    \ = active - scan_slots;\n\n   if (is_scan) {\n       __u32 idx_in_scan = pick_slot(rnd, scan_slots);\n       slot = get_slots\
    \ + idx_in_scan;      // scan workers: [get_slots, active)\n   } else if (is_get) {\n       slot = pick_slot(rnd, get_slots);\
    \    // GET workers: [0, get_slots)\n   } else {\n       goto random_all;\n   }\n   ```\n\n   - With 6 workers, this yields\
    \ `scan_slots=1` (no regression) or 2 depending on formula; you can tune divisor (e.g., `/3` to get 2 of 6). The experiment\
    \ will tell whether a 2-of-6 SCAN subset improves behavior at 180k without tanking 140\u2013160k.\n\n2. **Ensure \u201C\
    unknown\u201D or misparsed packets are treated as GET-like, not sent to SCAN slots**\n\n   Today, \u201Cunknown\u201D\
    \ falls back to `random_all`, which can send them to the SCAN subset and reintroduce head-of-line risk for those requests.\n\
    \n   Change:\n\n   - Instead of `goto random_all;` on unknown, treat them as GETs and keep them out of scan slots:\n\n\
    \   ```c\n   if (!is_get && !is_scan) {\n       /* Treat unknown as GET-like: avoid scan slots. */\n       __u32 scan_slots\
    \ = 1;      // or same logic as above\n       __u32 get_slots = active - scan_slots;\n       slot = pick_slot(rnd, get_slots);\n\
    \       (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n       return SK_PASS;\n   }\n   ```\n\n\
    \   - This keeps the SCAN subset dedicated to true SCANs while preserving the GET tail benefit even if the workload evolves\
    \ or the parser occasionally fails.\n\n3. **(More aggressive, if 180k still dominates the score) Allow a tiny fraction\
    \ of GETs onto SCAN workers to reclaim some capacity**\n\n   Only if experiments show the SCAN-only core is heavily underutilized\
    \ for GET at 140\u2013160k and you\u2019re still missing the 180k target:\n\n   - For GETs, introduce a second RNG branch\
    \ to occasionally send a GET to the scan subset, e.g.:\n\n   ```c\n   // After determining is_get and having get_slots/scan_slots\n\
    \   if (is_get) {\n       __u32 base = pick_slot(rnd, get_slots);   // default: GET-only\n       // Use low bits of rnd\
    \ as a cheap coin flip\n       if (scan_slots > 0 && (rnd & 0xF) == 0) { // ~1/16 of GETs\n           __u32 idx_in_scan\
    \ = (rnd >> 4) % scan_slots;\n           slot = get_slots + idx_in_scan;       // occasionally to scan workers\n     \
    \  } else {\n           slot = base;\n       }\n   }\n   ```\n\n   - This lets you tap a bit of extra GET capacity from\
    \ scan workers while keeping the probability that a GET lands behind a 2ms SCAN very low (so p99 remains mostly unaffected,\
    \ though some higher percentiles will move).\n\nTry (1) and (2) first; they\u2019re simple, verifier-safe, and keep the\
    \ core idea intact. Then re-run the 140k/160k/180k sweeps to see if 180k GET p99 comes down further without regressing\
    \ the excellent gains you already achieved at 160k."
