      \ = get_slots + idx_in_scan;       // occasionally to scan workers\n       } else {\n           slot = base;\n     \
      \  }\n   }\n   ```\n\n   - This lets you tap a bit of extra GET capacity from scan workers while keeping the probability\
      \ that a GET lands behind a 2ms SCAN very low (so p99 remains mostly unaffected, though some higher percentiles will\
      \ move).\n\nTry (1) and (2) first; they\u2019re simple, verifier-safe, and keep the core idea intact. Then re-run the\
      \ 140k/160k/180k sweeps to see if 180k GET p99 comes down further without regressing the excellent gains you already\
