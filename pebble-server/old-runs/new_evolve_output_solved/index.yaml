    \ /* >= 1 because active >= 2 */\n        __u32 idx_in_scan = pick_slot(rnd, scan_slots);\n        slot = get_slots +\
    \ idx_in_scan;       /* in [get_slots, active) */\n    } else if (is_get) {\n        __u32 scan_slots = 1;\n        __u32\
    \ get_slots = active - scan_slots;\n        slot = pick_slot(rnd, get_slots);     /* in [0, get_slots) */\n    } else\
