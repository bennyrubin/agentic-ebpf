      \ get_slots = active - scan_slots;\n\n   /* ... keep the existing parsing logic ... */\n\n   if (is_scan) {\n      \
      \ /* SCAN: map into the single reserved slot [get_slots, active). */\n       __u32 idx_in_scan = 0;    /* only one scan\
      \ slot */\n       slot = get_slots + idx_in_scan;\n       (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets,\
      \ &slot, 0);\n       return SK_PASS;\n   }\n\nget_like:\n   slot = pick_slot(rnd, get_slots);\n   (void)bpf_sk_select_reuseport(reuse,\
      \ &pebble_udp_targets, &slot, 0);\n   return SK_PASS;\n   ```\n\n   - Keep the current **\u201Cunknown \u2192 GET-like\u201D\
