- id: 6ceb58ceba6a4616bb0522b678306473
  idea_payload:
    status: finish
    design_doc:
      goals:
      - Eliminate worker underutilization caused by flow-hash pinning so that all configured SO_REUSEPORT workers receive
        traffic even when the number of client flows is small (e.g., the default 1 send worker vs. 64 server workers).
      - Avoid hot-spotting where multiple high-rate flows land on the same worker and build long per-socket UDP queues, causing
        drops and large p99 latencies.
      - 'Keep the eBPF selector self-contained and simple: no new maps, no additional userspace configuration beyond the existing
        Active field, and minimal logic per packet.'
      - Preserve correctness for the current UDP workload (stateless GET/SCAN with reqID) while accepting per-packet load
        balancing (no flow affinity) to fully exploit worker parallelism.
      - Provide a clean foundation for future refinements (e.g., optional GET/SCAN differentiation or light feedback mechanisms)
        without entangling the initial fix with unnecessary complexity.
      evidence:
      - 'The existing agent selector uses `slot = reuse->hash % active` with Active set once at startup from the Go side (`AgentSelectorAgentState{Active:
        uint32(workers)}`), and never updates this map again; there is no dynamic load-aware behavior.'
      - Client default `-send-workers` is 1, so experiments typically use a single UDPConn/source port (one flow) unless explicitly
        overridden, which is far fewer flows than server workers (default 64, max 128).
      - Server config normalizes workers to a default of 64 and a hard maximum of 128, and the BPF reuseport map `pebble_udp_targets`
        has `max_entries=128`, so up to 128 worker sockets can be installed and addressed via a simple modulo on `state->active`.
      - "The Go server\u2019s workers are strictly stateless per packet: `spawnWorker` reads a datagram, calls `handleRequest(workerIndex,\
        \ payload)` and writes the response back to the one-shot `addr`. No state is stored keyed by client address, so packets\
        \ from the same client do not need to hit the same worker."
      - 'The only field in `pebble_agent_state` that Go writes is `Active`; it constructs `AgentSelectorAgentState{Active:
        uint32(workers)}` and updates key 0 once in `loadAgent`. No other fields are touched or assumed in Go, so extending
        the C struct with additional fields is safe from the userspace perspective.'
      - "Experiment logs show that in each run only 3\u20135 of the 6 workers (in that configuration) receive any traffic,\
        \ and which indices are active changes between runs, consistent with deterministic flow hashing from a small number\
        \ of client flows onto a larger worker set."
      - Throughput saturates and p99 latency explodes once the offered rate exceeds the aggregate capacity of the subset of
        workers that happened to receive flows; the fact that a run at 100k req/s can outperform 80k req/s is explained by
        luckier hash distribution (more workers used) rather than any adaptive behavior.
      architecture:
      - Extend `struct agent_state` in the BPF program to include a `__u32 rr_counter` field alongside `Active`. This counter
        will live in the existing `pebble_agent_state` ARRAY[1] map and be automatically zero-initialized; Go will continue
        to write only `Active`, leaving `rr_counter` untouched but valid.
      - "On each packet in `agent_udp_selector`, look up `pebble_agent_state[0]` as today; if `state == NULL` or `state->Active\
        \ == 0`, immediately return `SK_PASS` to fall back to the kernel\u2019s default reuseport behavior."
      - If `Active > 0`, atomically fetch-and-increment `state->rr_counter` using BPF-supported atomic operations (e.g., a
        `__sync_fetch_and_add`-style intrinsic on `rr_counter`). Use the returned pre-increment value as a monotonically increasing
        sequence number per packet.
      - Compute the target slot as `slot = seq % state->Active`, where `seq` is the fetched counter value and `Active` is
        the worker count configured at startup. The modulo will uniformly distribute packets across `[0, Active-1]`, ensuring
        even usage of all configured workers regardless of the number of client flows.
      - "Invoke `bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0)` once per packet. If it succeeds, simply return\
        \ `SK_PASS` (letting the kernel deliver to the selected socket). If it fails (e.g., due to a race with userspace removing\
        \ a socket), just return `SK_PASS` without retries, relying on kernel fallback behavior\u2014no additional loops or\
        \ probes to keep the program simple."
      - "Do not inspect `reuse->hash` or any packet payload fields; GET and SCAN requests are treated identically by the selector.\
        \ Because SCANs are rare (\u22480.5%) and the selector is uniform, they will naturally be dispersed across all workers\
        \ instead of concentrating on a single socket."
      - "Rely on the existing userspace behavior to insert valid worker FDs into `pebble_udp_targets[0..Active-1]` at startup\
        \ and to keep `Active` fixed for the life of the server, as currently implemented. With `Active \u2264 128` guaranteed\
        \ by config normalization, the modulo operation and map indexing remain within bounds."
      risks:
      - 'Changing `struct agent_state` in C to add `rr_counter` changes the struct size, but Go only initializes the `Active`
        field (`AgentSelectorAgentState{Active: ...}`) and never inspects the struct layout; bpf2go will regenerate a matching
        Go struct, so this is low risk but still requires recompiling eBPF assets.'
      - 'The new design intentionally abandons flow affinity: packets from a single client flow will be sprayed across all
        workers. While the current server and client are fully compatible with this (stateless per request, UDP, reqID-based
        matching), any future features that assume per-flow stickiness would need to be vetted against this behavior.'
      - "The global `rr_counter` in a single ARRAY map element introduces a shared atomic hotspot. At the current experimental\
        \ load (\u2264 180k req/s) and modest server core counts, this is unlikely to be a bottleneck, but if the system scales\
        \ to very high packet rates on many cores, contention on this atomic increment could add measurable overhead."
      - Because we no longer probe multiple slots when `bpf_sk_select_reuseport` fails, a transient inconsistency between
        `Active` and actually installed FDs (e.g., a misconfiguration or a future dynamic resize) could cause the kernel to
        fall back more often to its default selection, partially reintroducing hash-based imbalance. Current code keeps `Active`
        constant and pins all FDs at startup, so this is acceptable under present assumptions.
      - Packet-level round-robin may slightly increase perceived jitter or reordering for any hypothetical client that implicitly
        relied on server-side ordering from a single worker. The current workload uses reqIDs and unordered UDP semantics,
        so this is not an issue now but is worth documenting.
