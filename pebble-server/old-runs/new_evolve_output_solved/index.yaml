    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector: stateless per-packet randomized\
    \ load balancing\n * with fast index computation and defensive clamping.\n *\n * Motivation\n * ----------\n * The previous\
    \ agent selector switched from flow-hash pinning to\n * per-packet random selection, eliminating underutilized workers\
    \ and\n * hot-spot queues when there are few client flows. That design already\n * met the core goals:\n *\n *   - All\
    \ SO_REUSEPORT workers receive traffic even with 1 client flow.\n *   - No flow affinity; each packet is independently\
    \ balanced.\n *   - Simple, stateless logic using only pebble_agent_state + targets.\n *\n * Refinement\n * ----------\n\
    \ * - agent_state.active is configured once at startup to the intended\n *   worker count.\n * - For each packet:\n *\
    \     1. Load state->active.\n *     2. Clamp: active = min(state->active, 128).\n *        If the result is 0, fall back\
    \ to SK_PASS.\n *     3. Draw rnd = bpf_get_prandom_u32().\n *     4. Compute:\n *          slot = ((__u64)rnd * active)\
    \ >> 32;\n *        This maps uniformly into [0, active) without a division.\n *     5. Call bpf_sk_select_reuseport once\
    \ with this slot.\n *\n * This preserves per-packet randomized load-balancing across workers,\n * with deterministic behavior\
    \ and verifier-friendly logic.\n */\n\nstruct agent_state {\n    __u32 active;\n    __u32 pad;\n};\n\nstruct {\n    __uint(type,\
    \ BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n\
    \    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum\
    \ sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state =\
    \ bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n\
    \    if (active == 0)\n        return SK_PASS;\n\n    /* Clamp to the REUSEPORT array size (128). */\n    if (active >\
    \ 128)\n        active = 128;\n\n    if (active == 0)\n        return SK_PASS;\n\n    /* Per-packet random selection over\
    \ [0, active) via multiply-shift. */\n    __u32 rnd = bpf_get_prandom_u32();\n    __u32 slot = ((__u64)rnd * active) >>\
    \ 32;\n\n    /* Single helper call; kernel ignores additional calls anyway. */\n    (void)bpf_sk_select_reuseport(reuse,\
    \ &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") =\
    \ \"GPL\";"
