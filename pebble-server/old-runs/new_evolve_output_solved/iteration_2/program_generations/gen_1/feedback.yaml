    \ but:\n    - Worker 5\u2019s CPU is effectively \u201Csacrificed\u201D to SCANs and can no longer help with GETs.\n \
    \   - At very high offered rates (180k), this makes the GET cluster effectively 5 workers worth of capacity instead of\
    \ 6; once the client drives beyond that capacity, GET queues still grow, hence the 469ms p99 at 180k.\n\nOverall takeaway:\
    \ the design **drastically improves GET p99 at moderate/high load (up to ~160k)**, but at the extreme overload point (180k)\
    \ we still hit a capacity wall: 5 GET-only workers are not enough, and 1 SCAN-only worker is badly overloaded.\n\n---\n\
    \n**Top changes to try next**\n\n1. **Spread SCANs across a *small subset* of workers instead of exactly one**\n\n   Goal:\
    \ avoid completely sacrificing one core and reduce SCAN-queue blowups, while still keeping most workers clean for GETs.\n\
    \n   Concrete change (within EVOLVE-BLOCK):\n\n   - Instead of hardcoding `scan_slots = 1`, make it proportional to `active`,\
    \ but small. Example:\n\n   ```c\n   /* Reserve a small subset of high-index workers for SCANs. */\n   __u32 scan_slots\
    \ = active / 4;  // 25% of workers\n   if (scan_slots == 0)\n       scan_slots = 1;\n   if (scan_slots >= active)\n  \
    \     scan_slots = active - 1;  // always leave at least 1 GET-only\n\n   __u32 get_slots = active - scan_slots;\n\n \
    \  if (is_scan) {\n       __u32 idx_in_scan = pick_slot(rnd, scan_slots);\n       slot = get_slots + idx_in_scan;    \
    \  // scan workers: [get_slots, active)\n   } else if (is_get) {\n       slot = pick_slot(rnd, get_slots);    // GET workers:\
    \ [0, get_slots)\n   } else {\n       goto random_all;\n   }\n   ```\n\n   - With 6 workers, this yields `scan_slots=1`\
    \ (no regression) or 2 depending on formula; you can tune divisor (e.g., `/3` to get 2 of 6). The experiment will tell\
    \ whether a 2-of-6 SCAN subset improves behavior at 180k without tanking 140\u2013160k.\n\n2. **Ensure \u201Cunknown\u201D\
    \ or misparsed packets are treated as GET-like, not sent to SCAN slots**\n\n   Today, \u201Cunknown\u201D falls back to\
    \ `random_all`, which can send them to the SCAN subset and reintroduce head-of-line risk for those requests.\n\n   Change:\n\
    \n   - Instead of `goto random_all;` on unknown, treat them as GETs and keep them out of scan slots:\n\n   ```c\n   if\
    \ (!is_get && !is_scan) {\n       /* Treat unknown as GET-like: avoid scan slots. */\n       __u32 scan_slots = 1;   \
    \   // or same logic as above\n       __u32 get_slots = active - scan_slots;\n       slot = pick_slot(rnd, get_slots);\n\
    \       (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n       return SK_PASS;\n   }\n   ```\n\n\
    \   - This keeps the SCAN subset dedicated to true SCANs while preserving the GET tail benefit even if the workload evolves\
    \ or the parser occasionally fails.\n\n3. **(More aggressive, if 180k still dominates the score) Allow a tiny fraction\
    \ of GETs onto SCAN workers to reclaim some capacity**\n\n   Only if experiments show the SCAN-only core is heavily underutilized\
