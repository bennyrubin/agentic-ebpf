    :\\\"finish\\\",\\\"Summary\\\":\\\"The system is a synthetic UDP key-value emulator with 6 SO_REUSEPORT workers and an\
    \ eBPF sk_reuseport program (\\u201cagent\\u201d) that randomly selects a worker per packet. The agent eBPF code is stateless,\
    \ reads an `active` worker count from a pinned array, clamps it to \\u2264128, draws a random 32-bit value with `bpf_get_prandom_u32`,\
    \ maps it into [0, active) via a multiply\\u2013shift, and calls `bpf_sk_select_reuseport` exactly once. There is no per-flow\
    \ state or bias in the selector.\\\\n\\\\nOn the server side, `spawnWorker` creates one goroutine per UDP socket that\
    \ runs a tight loop: `ReadFromUDP` \\u2192 `handleRequest` \\u2192 `WriteToUDP`. There is no internal worker pool: each\
    \ worker processes at most one request at a time, strictly sequentially. `handleRequest` implements GET and SCAN by busy-waiting\
    \ for fixed configured delays (`get_delay=10\\u00b5s`, `scan_delay=2ms`); SCAN cost does *not* depend on scan limit or\
    \ key range. No special socket buffer tuning is done beyond SO_REUSEADDR/SO_REUSEPORT. The client is an open-loop generator\
    \ targeting fixed rates (80k\\u2013180k req/s) with a single send worker by default; it does not wait for responses before\
    \ sending more, and simply tracks outstanding requests.\\\\n\\\\nThe per-second `[perf]` logs show that across all tested\
    \ loads, traffic is distributed almost perfectly evenly across the 6 workers: each one sees essentially the same GET and\
    \ SCAN counts and similar average service times (\\u224810\\u201312\\u00b5s for GET, \\u22482.0\\u20132.1ms for SCAN).\
    \ This confirms that the eBPF agent selector is balancing packets uniformly and that workers themselves are not skewed.\
    \ Aggregate completed throughput rises with offered load up to about 135\\u2013140k req/s (e.g., at 140k offered, ~136\\\
    u2013138k GETs/s plus ~600\\u2013700 SCANs/s), and then caps around ~145\\u2013150k completed requests per second at both\
    \ 160k and 180k offered. Meanwhile, client logs show that at 80k and 100k, outstanding requests remain small and all sends\
    \ are quickly matched by receives; at 140k, outstanding grows into the low thousands but drains during the run; and at\
    \ 160k/180k, outstanding grows steadily into tens and then hundreds of thousands before draining only after the send phase\
    \ ends. The reported p99 latencies (3\\u20135ms at 80k/100k, ~16ms at 140k, ~450ms at 160k, ~1.4s at 180k) mirror this\
