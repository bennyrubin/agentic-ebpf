    \ = active - scan_slots;\n\n    /* Attempt minimal payload classification. */\n    __u8 *data = (__u8 *)(long)reuse->data;\n\
    \    __u8 *data_end = (__u8 *)(long)reuse->data_end;\n\n    /* Ensure UDP header (8 bytes) is present. If not, treat as\
