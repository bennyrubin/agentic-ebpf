    \ slot as `slot = reuse->hash % active`, then calls `bpf_sk_select_reuseport` and returns SK_PASS. The Go server always\
    \ opens 6 SO_REUSEPORT UDP sockets, inserts all 6 FDs into the pebble_udp_targets map at indices 0\u20135, and spawns\
    \ one goroutine per worker. Each worker goroutine runs a tight loop of `ReadFromUDP` \u2192 `handleRequest` \u2192 `WriteToUDP`;\
    \ `handleRequest` parses the request, performs only a busy\u2011wait delay (10\u202F\xB5s for GET, 2\u202Fms for SCAN)\
    \ plus some light parsing/formatting and stats accounting, and returns a response. There are no other blocking operations\
    \ on the hot path, so each worker is effectively a single\u2011threaded server whose capacity is bounded by that synthetic\
    \ delay and a small fixed per\u2011request overhead. The client runs open\u2011loop at fixed target rates (80k\u2013180k\
    \ req/s) with a small number of UDPConns (one per send worker, each with its own source port) and matching per\u2011conn\
