    \ can be processed by the limited number of busy\u2011waiting goroutines; the server\u2019s own \u201C[perf] avg_get/avg_scan\u201D\
    \ numbers remain fixed near the configured synthetic delays because they do not include time spent in queues. / The observed\
    \ behavior is driven by the combination of (1) the agent eBPF selector doing a simple, static hash\u2011based choice of\
    \ reuseport slot per packet/flow (`slot = reuse->hash % active` with `active = 6`), (2) a small number of client UDP flows\
