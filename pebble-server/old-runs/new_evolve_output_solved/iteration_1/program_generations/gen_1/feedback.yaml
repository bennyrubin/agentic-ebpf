  \ (\u224810.4\u201310.7k gets in the first second, \u224813.1\u201313.5k gets in the next), plus a balanced aggregate line:\
  \  \n      `interval=1s gets=63298 ...` then \u224879k on the next second. That\u2019s a big improvement over the parent\
  \ where only 3\u20135 workers ever did work.\n    - **Selector is simple and self-contained:** still only uses `pebble_agent_state`\
  \ and `pebble_udp_targets`, one `bpf_sk_select_reuseport` call, O(1) logic, no extra maps or userspace knobs.\n    - **Correctness\
  \ for the existing workload:** nothing in the selector depends on request contents; UDP handling remains stateless per packet\
  \ at the Go layer.\n\n  - Remaining high p99 at high rates is now clearly a **capacity** issue, not a steering bug:\n  \
  \  - p99: 80k=3.47ms, 100k=4.18ms, 140k=14.8ms, then 160k\u2248620ms, 180k\u22481.48s.\n    - All 6 workers are busy; when\
  \ offered load exceeds \u201C6 \xD7 single-thread worker capacity\u201D, queues and drops are inevitable.\n\n- **Key behavior\
  \ / takeaways**\n\n  - **Load balancing looks good:**\n    - At 80k, all 6 workers see near-identical traffic; no obvious\
  \ hot spot worker.\n    - Aggregate throughput in the log (~63\u201379k/s depending on interval) is now limited by CPU/worker\
  \ capacity, not by flow-placement pathologies.\n  - **Client metrics behave sensibly:**\n    - Low p99 in the under-capacity\
  \ region (80k\u2013100k), rising smoothly as total demand approaches/exceeds server capacity.\n    - Very large p99 at 160k/180k\
  \ is consistent with 6 busy\u2011wait workers each doing 2ms SCANs and the UDP queues backing up; this matches the model\
  \ from the parent analysis.\n  - **The micro-change (modulo \u2192 multiply\u2011shift, optional hash mixing) did not obviously\
  \ hurt or dramatically change the curve**; results are essentially similar to the previous per\u2011packet\u2011random attempt,\
  \ as expected.\n\n- **Top 2\u20133 changes to try next**\n\n  1. **Clamp `active` against `reuse->num_sks` defensively**\n\
  \n     - Today you trust `state->active` and only bound it to `1..128`. If userspace ever mis-syncs `Active` vs the actual\
  \ number of installed sockets, you could hand `bpf_sk_select_reuseport` an index that has no FD.\n     - It\u2019s cheap\
  \ to make `active` = min(`state->active`, `reuse->num_sks`, 128):\n\n     ```c\n     __u32 active = state->active;\n   \
  \  /* Defensive sanity: non-zero and within map + kernel limits. */\n     if (active == 0)\n         return SK_PASS;\n\n\
  \     if (active > 128)\n         active = 128;\n\n     /* Don't target more slots than there are sockets. */\n     if (reuse->num_sks\
  \ && reuse->num_sks < active)\n         active = reuse->num_sks;\n     ```\n\n     - Then use this `active` in the multiply\u2011\
  shift. This keeps behavior identical in the normal case but makes the program robust to misconfiguration or future changes.\n\
  \n  2. **(Optional) Simplify randomness back to pure `prandom` if you want maximum clarity**\n\n     - The `mixed = rnd\
