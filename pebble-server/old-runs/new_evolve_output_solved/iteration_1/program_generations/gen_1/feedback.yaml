  t shown a measurable benefit in the metrics.\n     - If you value maximal clarity over micro\u2011tuning, you can drop the\
  \ mix:\n\n     ```c\n     __u32 rnd  = bpf_get_prandom_u32();\n     __u32 slot = ((__u64)rnd * active) >> 32;\n     ```\n\
  \n     - This still gives uniform per-packet random load-balancing with fast multiply\u2011shift.\n\n  3. **Experiment-level\
