    \ UDPConn/source port (one flow) unless explicitly overridden, which is far fewer flows than server workers (default 64,\
    \ max 128).\", \"Server config normalizes workers to a default of 64 and a hard maximum of 128, and the BPF reuseport\
    \ map `pebble_udp_targets` has `max_entries=128`, so up to 128 worker sockets can be installed and addressed via a simple\
    \ modulo on `state->active`.\", \"The Go server\\u2019s workers are strictly stateless per packet: `spawnWorker` reads\
    \ a datagram, calls `handleRequest(workerIndex, payload)` and writes the response back to the one-shot `addr`. No state\
    \ is stored keyed by client address, so packets from the same client do not need to hit the same worker.\", \"The only\n\
