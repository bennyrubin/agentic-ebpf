    \ for a given flow is effectively pinned to its chosen worker; that worker\u2019s goroutine then handles the request synchronously\
    \ and spends ~10\u202F\xB5s (GET) or 2\u202Fms (SCAN) in a busy\u2011wait loop for every request. This architecture means:\
