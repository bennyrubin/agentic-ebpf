  \ enforces rate limit via golang.org/x/time/rate, tags each request with reqID (makeReqID/parseReqID, main.go:308-337) so\
  \ receive goroutines can compute latency and feed the aggregator (latencyAggregator, main.go:40-66).\",\n        \"Server\
  \ stats logger (server.go:328-395) emits per-worker and aggregate lines that scripts/monitoring can scrape.\"\n      ],\n\
  \      \"downstream\": [\n        \"Server relies on internal/server/ebpf.go + generated internal/ebpfutil bindings.\",\n\
  \        \"Client output is parsed by run.sh\u2019s Python aggregator; logs feed human debugging.\"\n      ]\n    },\n \
  \   {\n      \"order\": 4,\n      \"name\": \"Support scripts\",\n      \"artefacts\": [\n        \"scripts/build_ebpf.sh:1-34\"\
