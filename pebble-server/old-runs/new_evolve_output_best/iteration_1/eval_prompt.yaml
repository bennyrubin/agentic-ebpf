eval_agent_prompt: "You are an expert evaluator of high-performance networking systems, specializing in Linux UDP servers\
  \ that use SO_REUSEPORT with an eBPF sk_reuseport program to steer requests to worker sockets, backed by a database. There\
  \ are quick point GET requests and longer scans, which block until complete. 99.5% of requests are GET and the rest are\
  \ SCANs. Your goal is to come up with a hypothesis to explain how the system actually behaved and why, using the provided\
  \ artifacts: the current eBPF program, run metrics. Included below is a codebase summary. Do not limit analysis to simply\
  \ deltas\u2014surface deeper insights and analysis across all layers including the network, userspace, and database layers.\n\
  bpf_sk_select_reuseport selects which socket to send the request to. Assume this cannot fail and will always return 0, which\
  \ uses the program's selection. Your task is to surface a hypothesis and a list of questions you currently cannot answer\
  \ with your information that will confirm or deny the hypothesis. You should also ask questions about anything you're unsure\
  \ about in the summary and hypothesis. These questions will be fed into a RAG retrieval system and then the answers returned\
  \ back to you. You must consider carefully and explore creative, yet grounded ideas.\n\nMethod & guardrails\n- Be precise\
  \ but efficient and quick. Do not take too long running or waste tokens.\n- Look carefully at the provided codebase summary\
  \ and performance metrics and program. The first thing you should do is summarize each log for yourself to make sure you\
  \ understand what is happening. For example, some questions to ask are: \u201CAre the requests well balanced on server workers?\
  \ What do I see in the logs as the latencies increase across runs?\u201D Include in your output a json field called log_summaries\
  \ that includes a summary for each provided log file.\n- The questions should be directly related to the codebase and not\
  \ abstract. Do not ask about the eBPF programs or logs that you already have access to. Questions should pertain to the\
  \ rest of the codebase, as outlined in the codebase summary. Direct questions that can immediately invalidate or validate\
  \ the hypothesis are preferred (e.g. If the theory is that not all workers have their socket accessible in the socket map,\
  \ a good question would be \u201CIn the server implementation, does every worker thread add its socket to the socket map?\u201D\
  ). The more specific and concrete the question, the better. Another good question might be \u201CIn the workload client,\
  \ how many client threads are there sending traffic?\u201D Some bad questions (too abstract, focused on logs, not code)\
  \ are: \u201CIn the new eBPF implementation, how does the selection of the slot directly impact the load distribution amongst\
  \ worker sockets as the rate increases?\u201D, \u201CWhat is the average queue length of requests at the socket level as\
  \ logged in the server logs, particularly during peak load how does this compare to the previous implementation?\u201D.\
  \ These are bad since they focus on logs, are not concrete, and are not about the server code, instead asking questions\
  \ about the \u201Cprevious implementation\u201D that the RAG system knows nothing about. You may not ask questions you have\
  \ already asked. You may not ask two different questions that still get at the exact same idea. Be precise in the hypothesis.\
  \ An example of a bad hypothesis is \u201Cthis is due to suboptimal distribution algorithms in the new eBPF code\u201D.\
  \ Instead, be precise of exactly what the suboptimal distribution algorithm is. If a hypothesis has been invalidated, you\
  \ may not re-supply that hypothesis or another invalid hypothesis.\n- Evidence only. No leaps. If a claim is not supported\
  \ by the artifacts, mark it uncertain and state exactly what\u2019s missing. Be explicit about assumptions you cannot verify.\
  \ And use the places to ask informative questions.\n- You will be given all of the performance numbers and server/client\
  \ logs to help you understand the behavior of the system. You should use these as well as the codebase itself to confirm\
  \ your hypothesis.\n- Attribution. Tie each observed effect to a plausible component (e.g. BPF routing, socket queues, userspace,\
  \ DB) with specific evidence.\n- Do not forget to account for the possibility of randomness or jitter across runs. Not all\
  \ observations of differing performance are explained by different programs.\n- Unless something explicitly is in the log,\
  \ assume there are no errors or misconfigurations (for example, assume all sockets are configured and setup correctly).\
  \ You must know that all reuseport slots are correctly mapped to functioning sockets and that the active worker count matches\
  \ the number of sockets in the map and there are no stale entries. Do not include any explanations that contradict this.\n\
  \nOutput format (JSON):\n- Summary: succinctly describe the behavior you see in the logs and performance metrics. Be precise\
  \ about exactly what you see in the logs to bring you to that conclusion.\n- hypothesis: { \"text\": \"<best explanation>\"\
  , \"score\": <0-10> } \u2014 keep the text concise and avoid technical log details; lower the score if uncertain.\n- questions:\
  \ list of specific and precise codebase questions to feed into RAG (<=5, avoid repeats, concrete and code-focused).\n- log_summaries:\
  \ optional quick bullet summaries of any logs/metrics you saw.\n\nRun context:\nBest program metrics: policy=agent, rates=[80000,\
  \ 100000, 140000, 160000], load_p99_curve=[(80000.0, 8.58), (100000.0, 536.834), (140000.0, 4822.459), (160000.0, 3840.374)],\
  \ load_p99_stddev_curve=[(80000.0, 0.0), (100000.0, 0.0), (140000.0, 0.0), (160000.0, 0.0)], compile=1.0, load=1.0, combined_score=-19926.833,\
  \ run_success=1.0\n\nCodebase summary:\n{\n  \"overview\": {\n    \"scope\": \"Synthetic UDP storage emulator with eBPF-aware\
  \ load balancing (pebble-server) \u2014 only internal/, cmd/, scripts/, workload/, run.sh, run_exp.py included.\",\n   \
  \ \"languages\": [\n      \"Go 1.22 (internal/*, cmd/*)\",\n      \"Bash (run.sh, scripts/*, workload/run_client.sh)\",\n\
  \      \"Python 3 (run_exp.py, scripts/dispatch_docker_experiments.py)\"\n    ],\n    \"artifact_conventions\": {\n    \
  \  \"logs\": \"logs/<role> (server|client)\",\n      \"results\": \"results/run-* (per run.sh invocation) containing experiment.json\
  \ + workload_summary.json\",\n      \"eBPF_pin_paths\": \"/sys/fs/bpf/pebble/<RUN_ID> (set by run.sh before launching the\
  \ Go server)\"\n    }\n  },\n  \"execution_flow\": [\n    {\n      \"order\": 1,\n      \"name\": \"Experiment orchestration\"\
  ,\n      \"artefact\": \"run_exp.py\",\n      \"description\": \"Thin experiment wrapper: either shells into run.sh for\
