  \ wires CLI flags, creates log/results dirs, enables pprof/profiling, builds server.Config and runs server.New/Run under\
  \ signal-aware context.\",\n        \"internal/server.Server.New/Run (server.go:104-181) validate config, load eBPF policy,\
