  \ plots.\",\n      \"key_steps\": [\n        \"parse_args (run_exp.py:29-95) exposes policies/rates/threads plus manifest\
  \ + plotting toggles.\",\n        \"invoke_run_sh/load_manifest_runs gather `run-*` directories, extract metrics from workload_summary.json,\
  \ and pass records into write_experiment_summary/generate_plots.\"\n      ]\n    },\n    {\n      \"order\": 2,\n      \"\
  name\": \"Per-run workflow\",\n      \"artefact\": \"run.sh\",\n      \"description\": \"Convenience script that (a) slices\
