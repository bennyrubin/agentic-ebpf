  \ scripts/launch_server.sh and client via run_client wrapper.\",\n        \"Embedded Python (run.sh:415-452) regex-parses\
  \ client logs into workload_summary.json; final line prints the run directory for downstream tooling.\"\n      ]\n    },\n\
  \    {\n      \"order\": 3,\n      \"name\": \"Runtime services\",\n      \"artefacts\": [\n        \"cmd/pebble_server/main.go:21-91\
