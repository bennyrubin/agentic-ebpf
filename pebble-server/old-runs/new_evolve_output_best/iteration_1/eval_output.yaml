    status: |-
      continue
    Summary: "Four runs of the UDP pebble server with the 'agent' eBPF policy at 80k, 100k, 140k, and 160k req/s show: (1)\
      \ server-side per-request latencies remain near the synthetic delays (\u224810\xB5s GET, \u22482ms SCAN) across all\
      \ rates; (2) aggregate server throughput saturates around ~100\u2013105k req/s; (3) client-side outstanding request\
      \ counts and p99 latencies grow sharply once the offered rate reaches 100k+, with eventual packet loss (missing responses)\
      \ at 140k and 160k; and (4) reuseport workers see somewhat skewed but not extreme load distribution, with some workers\
      \ often idle in a given run."
    hypothesis:
      text: "The server is effectively CPU-limited to about 100k requests/s on the cores assigned to it, given the synthetic\
        \ 10\xB5s GET and 2ms SCAN busy-wait delays. The `agent_udp_selector` eBPF program simply uses `reuse->hash % active`\
        \ to choose a worker and calls `bpf_sk_select_reuseport` once, so traffic from each client UDP 4\u2011tuple is statically\
        \ pinned to a single reuseport worker and never rebalanced based on load. As the open-loop client drives the server\
        \ at or above this CPU ceiling, per-worker goroutines stay busy running the synthetic delays, the kernel UDP receive\
        \ queues fill, and excess packets are dropped once buffers overflow. Time spent waiting in the socket queues and delayed\
        \ scheduling on busy workers appears to the client as rising outstanding counts, multi-second p99 tail latencies,\
        \ and missing responses at 140k/160k, while the server\u2019s own \u201C[perf]\u201D averages stay near the configured\
        \ synthetic delays because they measure only in-handler service time, not queueing. The eBPF policy neither improves\
        \ nor significantly harms distribution beyond static hashing; the dominant effect is global CPU saturation plus static\
        \ per-flow pinning rather than dynamic, latency-aware steering."
      score: 7
