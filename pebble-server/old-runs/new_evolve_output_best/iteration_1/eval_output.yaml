      \ and 160k req/s. The eBPF agent program simply hashes the kernel-provided reuseport hash modulo a fixed \u201Cactive\u201D\
      \ worker count (set once to 6 and never updated) and calls bpf_sk_select_reuseport; it does not look at request type\
      \ or any load signal. Across runs, server-side \u201C[perf]\u201D logs show that only 4\u20135 of the 6 workers ever\
      \ see traffic, that their in-handler latencies remain pinned near the configured synthetic delays, and that aggregate\
      \ processed throughput plateaus around ~100\u2013105k req/s. Client logs show that at 80k RPS the system runs stably\
      \ with low outstanding requests, but at 100k RPS the outstanding depth grows while all responses still arrive; at 140k\
      \ and 160k RPS, outstanding counts explode and 18\u201323% of responses never arrive, while the server continues to\
      \ process at ~100k req/s and both server and client UDP sockets use default (small) receive buffers.\",\"hypothesis\"\
      :{\"text\":\"The observed behavior is best explained by a CPU\u2011limited server plus small UDP receive buffers, combined\
      \ with an eBPF selector that provides only static, hash\u2011based steering and no request\u2011aware load control.\\\
      n\\nAt runtime the server creates 6 reuseport UDP sockets and 6 worker goroutines, and the eBPF \u2018agent\u2019 policy\
      \ is configured with Active=6 once at startup. For each packet, the program uses the kernel\u2019s reuseport hash and\
      \ selects a worker index as `hash % active`, then bpf_sk_select_reuseport enforces that choice. Since the client uses\
      \ only a single UDPConn, there is only one logical sender, but the kernel\u2019s reuseport hash nevertheless distributes\
      \ packets across a subset of workers; in the logs, 4\u20135 workers per run consistently receive traffic, while 1\u2013\
      2 workers remain idle. Among the active workers, the load is moderately skewed but of the right order (e.g., ~20\u2013\
      27k gets/s on the busiest worker at higher rates), so there is no evidence of a catastrophic imbalance; the eBPF policy\
      \ is effectively acting as a simple, static hash distributor over the active subset.\\n\\nEach worker processes requests\
      \ sequentially in a tight loop: ReadFromUDP \u2192 parseRequest \u2192 busy\u2011wait for 10\xB5s or 2ms \u2192 WriteToUDP.\
      \ handleRequest\u2019s stats timing starts immediately before the busy\u2011wait and ends immediately after it, so the\
      \ logged avg_get\u224810\xB5s and avg_scan\u22482ms reflect only the synthetic delay, not any time spent queued in the\
      \ kernel, blocked in ReadFromUDP, or doing parsing/formatting and syscalls. In aggregate, though, the logs show that\
      \ the server can sustain only about 100\u2013105k requests/s across its active workers. Given 4\u20135 busy workers\
      \ and the observed saturation point, the true per-request CPU cost (busy\u2011wait plus Go and network overhead) is\
      \ on the order of tens of microseconds per request, which consumes essentially all of the CPU time available on the\
      \ server\u2019s 6 pinned cores once the offered rate reaches ~100k RPS.\\n\\nAt 80k RPS, arrival rate is comfortably\
      \ below this capacity, kernel UDP receive queues remain short, and end\u2011to\u2011end client latency is dominated\
      \ by the synthetic delays; outstanding requests stay low and no responses are lost. At 100k RPS, the offered rate roughly\
      \ matches the server\u2019s processing capacity. The server continues to report ~10\xB5s/2ms in-handler latencies and\
