    hypothesis:
      text: "The system\u2019s behavior is best explained by a CPU-limited server whose effective concurrency is capped by\
        \ how many reuseport workers actually get traffic, combined with static, flow-pinned steering in the eBPF agent policy.\
        \ Each client send worker uses its own UDPConn, so there are only as many UDP flows as send workers. The eBPF agent\
        \ program computes `slot = reuse->hash % active` (with `active` fixed to the worker count) and, given our assumption\
        \ that `bpf_sk_select_reuseport` always succeeds on the first try, pins each 4\u2011tuple to one reuseport socket\
        \ for the duration of the run. With a small number of client flows, that hash lands on only 4\u20135 of the 6 server\
        \ workers, exactly matching the pattern that some workers see zero traffic in every run. Those active workers run\
        \ a sequential ReadFromUDP \u2192 parse \u2192 busy\u2011wait \u2192 WriteToUDP loop, and each request burns not just\
        \ the 10\xB5s/2ms synthetic delay but also additional Go and networking overhead (parsing, formatting, syscalls).\
        \ The total per-request CPU cost across this hot path is therefore on the order of ~50\xB5s, which, with 4\u20135\
        \ active worker goroutines, yields an effective capacity of around 100k requests/s. At 80k/s, capacity exceeds demand\
        \ so queues stay short and client p99 latency is low. At 100k/s, arrival nearly matches capacity: per-request service\
        \ time in handleRequest remains near the synthetic delays, but a growing amount of time is spent queued in kernel\
        \ UDP receive buffers and in the Go runtime before the handler, which shows up as client\u2011side p99 ~0.5s and rising\
        \ outstanding counts, yet no losses because the receive queues don\u2019t yet overflow. At 140k and 160k/s, offered\
        \ load exceeds this ~100k/s capacity, so the per-socket UDP receive queues for the active workers (left at default\
        \ SO_RCVBUF) fill and begin dropping packets while the busy workers continue to process at their capped rate. Because\
        \ `handleRequest` only times the busy-wait region, its avg_get/avg_scan metrics remain near 10\xB5s/2ms and do not\
        \ reflect the large queueing latency or packet drops observed by the client. The eBPF agent policy thus contributes\
        \ indirectly by statically pinning a small number of flows to a subset of workers (limiting effective concurrency),\
        \ but the dominant bottleneck is aggregate CPU capacity of the hot request path, which plateaus near 100k req/s and\
        \ drives both the high tail latencies and missing responses when the client overdrives the system."
