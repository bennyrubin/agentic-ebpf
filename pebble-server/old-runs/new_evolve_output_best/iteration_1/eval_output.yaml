    - question: "In the receive goroutine in cmd/workload_client/main.go, how are errors from conn.Read handled\u2014specifically,\
        \ when a read deadline expires or a timeout occurs, does the goroutine break out of the loop and stop reading permanently,\
        \ or does it continue reading and/or refresh the read deadline?"
      answer:
        answer: |-
          In the receive goroutine, when conn.Read returns an error, the code handles timeouts and other errors differently:

          - If the error is a timeout (net.Error with Timeout() == true):
            - The read deadline is **reset** to `time.Now().Add(5 * time.Second)`.
            - The goroutine then checks the `quit` channel:
              - If `quit` is closed, it returns and stops.
              - Otherwise, it executes `continue`, which causes it to **stay in the for-loop and keep reading**.
            So a read deadline expiry/timeout does **not** stop the goroutine permanently; it refreshes the deadline and continues reading unless `quit` is signaled.

          - If the error is `net.ErrClosed` or `os.ErrClosed`:
            - The goroutine immediately returns, stopping permanently.

          - For any other non-timeout error:
            - It logs the error with `logger.Printf("read error ...")` and then `continue`s the loop, attempting to read again.

          Thus, only connection-closed errors cause the receive goroutine to exit; timeout/deadline expiry causes the deadline to be refreshed and the loop to continue reading.
        code_snippets:
        - path: |-
            cmd/workload_client/main.go
          snippet: "for {\n    n, err := conn.Read(buf)\n    // Capture receive timestamp immediately\n    recvNano := time.Now().UnixNano()\n\
            \    if err != nil {\n        if ne, ok := err.(net.Error); ok && ne.Timeout() {\n            // Reset deadline\
            \ on timeout\n            conn.SetReadDeadline(time.Now().Add(5 * time.Second))\n            select {\n      \
            \      case <-quit:\n                return\n            default:\n                continue\n            }\n \
            \       }\n        if errors.Is(err, net.ErrClosed) || errors.Is(err, os.ErrClosed) {\n            return\n  \
            \      }\n        logger.Printf(\"read error (worker=%d): %v\", workerID, err)\n        continue\n    }\n    \n\
            \    fields := bytes.Fields(buf[:n])\n    if len(fields) < 2 {\n        continue\n    }\n    sendNano, isGet,\
            \ ok := parseReqID(fields[1])\n    if !ok {\n        continue\n    }\n    latencyMs := float64(recvNano-sendNano)\
            \ / 1e6\n    select {\n    case latencyCh <- latencyRecord{latency: latencyMs, isGet: isGet}:\n    case <-quit:\n\
            \        return\n    }\n}\n"
