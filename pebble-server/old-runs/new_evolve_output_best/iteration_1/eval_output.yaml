      \ each 4\u2011tuple to one reuseport socket for the duration of the run. With a small number of client flows, that hash\
      \ lands on only 4\u20135 of the 6 server workers, exactly matching the pattern that some workers see zero traffic in\
      \ every run. Those active workers run a sequential ReadFromUDP \u2192 parse \u2192 busy\u2011wait \u2192 WriteToUDP\
