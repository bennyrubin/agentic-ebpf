    question_answers:
    - question: |-
        In cmd/workload_client/main.go, does each send worker goroutine share a single UDPConn to the server, or does it create its own UDPConn with a distinct local port?
      answer:
        answer: "Each send worker goroutine creates its own UDPConn with a distinct local port. Inside the worker loop, `net.DialUDP(\"\
          udp\", nil, udpAddr)` is called per worker index `i`, and that `conn` is passed only to that worker\u2019s send\
          \ goroutine and its paired receive goroutine. Using `nil` for the local address lets the OS assign a separate ephemeral\
          \ local port per worker connection."
        code_snippets:
        - path: |-
            cmd/workload_client/main.go
          snippet: "conn, err := net.DialUDP(\"udp\", nil, udpAddr)\n\t\tif err != nil {\n\t\t\tlogger.Fatalf(\"dial udp worker=%d:\
            \ %v\", i, err)\n\t\t}\n\t\tdefer conn.Close()\n\n\t\tseed := time.Now().UnixNano() + int64(i)\n\t\trng := rand.New(rand.NewSource(seed))\n\
            \n\t\tworkerID := i\n\n\t\tsendWG.Add(1)\n\t\tgo func(workerID int, conn *net.UDPConn, rng *rand.Rand) {"
        - path: |-
            cmd/workload_client/main.go
          snippet: "go func(workerID int, conn *net.UDPConn) {\n\t\t\tdefer recvWG.Done()\n\t\t\tbuf := make([]byte, 64*1024)\n\
            \t\t\t// Set read deadline once to avoid blocking forever\n\t\t\tconn.SetReadDeadline(time.Now().Add(5 * time.Second))\n\
            \t\t\tfor {\n\t\t\t\tn, err := conn.Read(buf)"
    - question: |-
        In run.sh (and any helpers it calls), when no explicit CPU arguments are provided, how many logical CPU cores are included in SERVER_CPUSET for the pebble_server process?
      answer:
        answer: |-
          If no explicit CPU arguments are provided (`SERVER_CORES` unset and `CPUSET_POOL` left at its default), the script sets `SERVER_CORES` equal to `THREADS`, whose default value is 6. It then builds `SERVER_CPUSET_LIST` from the first `SERVER_CORES` entries of `AVAILABLE_CPUS` and joins them into `SERVER_CPUSET`. Thus, by default, SERVER_CPUSET includes 6 logical CPU cores for the pebble_server process.
        code_snippets:
        - path: |-
            run.sh
          snippet: |-
            THREADS=${THREADS:-6}
            ...
            SERVER_CORES=${SERVER_CORES:-}
            ...
            if [[ -z "$SERVER_CORES" ]]; then
              ensure_positive_int "--threads" "$THREADS"
              SERVER_CORES="$THREADS"
              DEFAULTED_SERVER=1
            fi
        - path: |-
            run.sh
          snippet: |-
            SERVER_CORES=$((SERVER_CORES))
            CLIENT_CORES=$((CLIENT_CORES))

            total_requested=$((SERVER_CORES + CLIENT_CORES))
            ...
            SERVER_CPUSET_LIST=("${AVAILABLE_CPUS[@]:0:SERVER_CORES}")
            CLIENT_CPUSET_LIST=("${AVAILABLE_CPUS[@]:SERVER_CORES:CLIENT_CORES}")
            SERVER_CPUSET=$(join_by , "${SERVER_CPUSET_LIST[@]}")
    - question: |-
        In internal/server/ebpf.go, when loading the 'agent' policy, how is pebble_agent_state.Active initialized, and is it ever modified after Server.Run starts?
      answer:
        answer: |-
          When the 'agent' policy is selected, loadAgent(workers int) constructs an ebpfutil.AgentSelectorAgentState with Active set to the configured workers value, cast to uint32:

          - A key of type uint32 is created with value 0.
          - An AgentSelectorAgentState struct is initialized with:
            - Active: uint32(workers)
          - If the PebbleAgentState map is non-nil, this state is written to the map with that key using Update(..., ebpf.UpdateAny).

          This initialization happens once during loadAgent. There is no code shown that modifies PebbleAgentState (and thus pebble_agent_state.Active) after this point, including after Server.Run starts; the value is set to workers at load time and not updated later in the provided code.
        code_snippets:
        - path: |-
            internal/server/ebpf.go
          snippet: "func loadAgent(workers int) (*ebpfPolicy, error) {\n\tif err := ensureRlimit(); err != nil {\n\t\treturn\
            \ nil, err\n\t}\n\tpinDir := pinDirectory()\n\tif err := ensurePinDirectory(pinDir); err != nil {\n\t\treturn\
            \ nil, fmt.Errorf(\"ensure pin directory: %w\", err)\n\t}\n\tvar objs ebpfutil.AgentSelectorObjects\n\topts :=\
            \ &ebpf.CollectionOptions{\n\t\tMaps: ebpf.MapOptions{PinPath: pinDir},\n\t}\n\tif err := ebpfutil.LoadAgentSelectorObjects(&objs,\
            \ opts); err != nil {\n\t\treturn nil, fmt.Errorf(\"load agent objects: %w\", err)\n\t}\n\n\tif workers < 0 {\n\
            \t\tobjs.Close()\n\t\treturn nil, ErrInvalidConfig(\"workers must be non-negative\")\n\t}\n\n\tvar key uint32\
