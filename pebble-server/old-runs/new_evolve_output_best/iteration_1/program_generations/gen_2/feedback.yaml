  \ which matches ~0.5% scans and shows all 6 workers active.\n\n  \u2192 This hits **Goal 1 (drive all workers)** and **Goal\
  \ 2 (isolate SCANs)** structurally.\n\n- **Client-side p99 is massively better than the baseline.** Interpreting `load_p99_curve`\
  \ as **milliseconds**:\n\n  - 80k: **2.04 ms**\n  - 100k: **2.406 ms**\n  - 140k: **21.259 ms**\n  - 160k: **1073.506 ms\
  \ \u2248 1.07 s**\n\n  Baseline summary said ~500 ms @100k, ~690 ms @140k, ~1.7 s @160k. So up to 140k, p99 dropped by **1\u2013\
  2 orders of magnitude**, and even at 160k it\u2019s better. Since 99.5% of ops are GETs, this essentially means **GET p99\
  \ has been pulled way down** by the SCAN isolation.\n\n- **Selector complexity constraints are respected:**\n\n  - One `bpf_map_lookup_elem`\
  \ on `pebble_agent_state`.\n  - A few bounded pointer walks in `classify_scan`.\n  - Exactly one `bpf_sk_select_reuseport`\
  \ call.\n  - No new maps or userspace config; `agent_state.active` is the only control surface and is set by existing Go\
  \ code.\n\nNet: the program now does what the design asked for: **RR over the whole GET subset**, **dedicated SCAN subset**,\
  \ **all workers live**, and **GET tail behavior improved** at a fixed overall CPU budget.\n\n---\n\n**Key behavioral takeaways**\n\
  \n- **Classification is now correct.**\n\n  - Workers 0\u20133: `avg_get\u224810\xB5s`, `scans=0`.\n  - Workers 4\u2013\
  5: `avg_scan\u22482ms`, `gets=0`.\n\n  This shows `classify_scan()` successfully finds the `\"SCAN\"` prefix and routes\
  \ those packets exclusively to the SCAN subset.\n\n- **Worker utilization is even inside each class.**\n\n  At 80k:\n\n\
  \  - Each GET worker sees ~15\u201320k gets/s; both SCAN workers see similar scan counts (~140\u2013200/s).\n  - No workers\
  \ are idle; no hash-induced bias.\n\n- **Remaining p99 blow-up at 160k matches simple overload, not a selector bug.**\n\n\
  \  - Server is still fundamentally CPU-bound; once you push past ~100k\u2013120k aggregate service rate, queues and UDP\
  \ drops dominate.\n  - With SCANs confined to 2 workers, their queueing mostly hurts SCANs; GETs see much milder tail growth\
  \ until you overdrive the 4 GET workers.\n\n---\n\n**Top 2\u20133 changes to try next**\n\nAt this point the **BPF policy\
  \ is basically \u201Cdone\u201D with respect to the stated goals**. The remaining pain is overload behavior, not mis\u2011\
  routing. My recommendations:\n\n1. **Tune worker split only if you want to favor GETs even more under heavy overload.**\n\
  \n   Today for `active=6` you have **4 GET / 2 SCAN**. That\u2019s a reasonable approximation to the ~50/50 CPU split GET\
  \ vs SCAN, but if your top priority is protecting GETs at very high rates you can skew it further:\n\n   - For example:\n\
  \n     ```c\n     if (active >= 5)\n         scan_slots = 1;   // 5 GET, 1 SCAN\n     else\n         scan_slots = 1;\n \
  \    ```\n\n   - This gives GETs more CPU headroom, at the cost of **much worse SCAN latency** once you hit overload.\n\
  \   - If you try this, compare **GET-only p99** before/after at 140k+; overall p99 will be dominated by SCANs either way.\n\
  \n2. **(If you want to simplify) Collapse `classify_scan()` to a single \u201Cpayload-direct\u201D path once you confirm\
  \ `reuse->data` layout.**\n\n   Right now you try 3 interpretations (IP\u2192UDP\u2192payload, UDP\u2192payload, payload).\
  \ That\u2019s safe but slightly heavier. A quick follow-up:\n\n   - Temporarily change `classify_scan()` to **only**:\n\n\
  \     ```c\n     static __always_inline int classify_scan(struct sk_reuseport_md *reuse)\n     {\n         void *data =\
  \ (void *)(long)reuse->data;\n         void *data_end = (void *)(long)reuse->data_end;\n         char *p = (char *)data;\n\
  \n         if (p + 4 > (char *)data_end)\n             return 0;\n\n         return p[0] == 'S' && p[1] == 'C' && p[2] ==\
  \ 'A' && p[3] == 'N';\n     }\n     ```\n\n   - Run at 80k and check that workers 0\u20133 remain GET-only and 4\u20135\
  \ remain SCAN-only.\n   - If behavior matches, keep the simpler version; if not, revert to your current multi-path classifier.\
  \ This is a **minor perf/complexity cleanup**, not a functional change.\n\n3. **Focus subsequent iterations outside BPF\
  \ (buffer sizes, instrumentation) rather than more selector logic.**\n\n   Within the constraints (one map, one select call,\
  \ no new control surfaces), the selector is already doing about as much as it can:\n\n   - To further reduce extreme p99s\
  \ at 160k+, you\u2019ll likely need:\n     - Larger `SO_RCVBUF` on server and client sockets.\n     - Possibly more GET\
  \ workers (more CPU) or a shorter synthetic SCAN delay if semantics allow.\n   - On the measurement side, make sure your\
  \ summary tracks **GET and SCAN percentiles separately** so future selector tweaks can be judged on GET p99 directly, not\
  \ just overall.\n\nIf you want another strictly-in-BPF change beyond these, it would be policy, not correctness (e.g., *dropping*\
  \ or further throttling SCANs), and that\u2019s a bigger semantics decision than the original design envisioned."
