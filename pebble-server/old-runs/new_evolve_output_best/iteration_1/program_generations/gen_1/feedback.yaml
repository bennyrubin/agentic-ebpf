    - Idea intent: {\"status\": \"finish\", \"design_doc\": {\"goals\": [\"Drive all configured SO_REUSEPORT workers (0..Active-1)\
    \ into steady use, removing the persistent bias where 1\\u20132 workers remain almost idle even when the server is CPU-saturated.\"\
