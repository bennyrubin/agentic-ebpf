    \ current pebble_agent_state map and its Active field exactly as initialised by loadAgent, avoiding any need to touch\
    \ Go beyond what it already does for the agent policy.\"], \"evidence\": [\"The current agent selector uses only reuse->hash\
    \ % Active and a fixed search loop over pebble_udp_targets; logs show that with a single UDPConn sender, only 4\\u20135\
    \ of 6 workers see traffic, so hash-based steering alone is not achieving uniform utilisation.\", \"Throughput plateaus\
