    \ workloads. Here we use simple round\u2011robin counters\n *      stored in pebble_agent_state so every packet advances\
    \ an index and\n *      all [0..Active-1) workers get traffic over time.\n *\n * 2) Isolate long SCAN requests from short\
    \ GETs:\n *    - SCANs (~0.5% of traffic but ~200x the cost of GET) consumed a large\n *      share of CPU and caused\
    \ head\u2011of\u2011line blocking when mixed with GETs\n *      on the same workers.\n *    - Requests are ASCII and begin\
