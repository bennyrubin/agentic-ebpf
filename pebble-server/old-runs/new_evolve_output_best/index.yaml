  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector\n *\n * Approach\n * --------\n\
    \ * This selector sends every incoming UDP packet to one of the active\n * SO_REUSEPORT workers using a single global\
    \ round\u2011robin counter stored in\n * pebble_agent_state. It is completely verb\u2011agnostic (no GET/SCAN parsing),\n\
    \ * so all workers handle both short GETs and long SCANs.\n *\n * Goals satisfied:\n *   - No dedicated GET\u2011only\
    \ or SCAN\u2011only workers: all N workers share the\n *     mixed workload, improving overall CPU utilization and pushing\
    \ the\n *     queueing knee closer to the true CPU limit.\n *   - Load balanced by request count via a single, global\
    \ RR counter, which\n *     is a good fit when per\u2011verb CPU costs are stable.\n *   - Extremely cheap per packet:\
    \ one ARRAY lookup, one atomic\n *     fetch\u2011and\u2011increment (BPF_XADD), a few integer ops, and one\n *     bpf_sk_select_reuseport()\
    \ call.\n *   - Minimal state and no new control surfaces: pebble_agent_state holds\n *     only:\n *\n *         struct\
    \ agent_state {\n *             __u32 active;  // # of workers, written by Go\n *             __u32 rr;      // global\
    \ round\u2011robin counter, in BPF\n *         };\n *\n *     Go continues to write only Active; rr is zero\u2011initialized\
    \ and then\n *     maintained entirely in this program.\n *\n * Implementation\n * --------------\n *   1) Look up agent_state[0].\
    \ If missing or active==0, return SK_PASS so\n *      the kernel chooses a socket.\n *   2) Clamp active to the sockarray\
    \ size (128) for safety.\n *   3) Atomically increment rr using BPF_XADD. To satisfy the BPF backend\n *      restrictions,\
    \ we ignore the atomic primitive's return value and take\n *      a best\u2011effort snapshot of rr afterwards for slot\
    \ selection.\n *   4) Compute slot = rr % active (or 0 if active==1) and call\n *      bpf_sk_select_reuseport() exactly\
    \ once. If the helper fails, the\n *      kernel falls back to its default selection logic.\n *\n * The logic is straight\u2011\
    line, uses only allowed helpers, and keeps per\u2011packet\n * overhead tiny while spreading mixed GET/SCAN load across\
    \ all workers.\n */\n\nstruct agent_state {\n    __u32 active; /* number of configured workers (0..active-1) */\n    __u32\
    \ rr;     /* global round-robin counter */\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries,\
    \ 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state\
    \ SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n\
    {\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n\
    \        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\n    /*\
    \ Safety clamp: sockarray is sized to 128 entries. */\n    if (active > 128)\n        active = 128;\n\n    /* Atomically\
    \ increment the global RR counter.\n     * The BPF backend for LLVM does not allow using the XADD return value,\n    \
    \ * so we discard it and then take a best-effort snapshot of rr.\n     */\n    __sync_fetch_and_add(&state->rr, 1);\n\n\
    \    /* Snapshot after increment; races are acceptable for RR spreading. */\n    __u32 rr = state->rr;\n\n    __u32 slot;\n\
    \    if (active > 1)\n        slot = rr % active;\n    else\n        slot = 0;\n\n    /* Exactly one selection attempt;\
    \ extra calls would be ignored. */\n    (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);\n\n    return\
    \ SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
