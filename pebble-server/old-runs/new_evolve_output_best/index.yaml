      \ the userspace cost model.\n  - **Implementation details**\n    - Uses a global `rr` with an atomic bump and a CPU\u2011\
      ID offset: `slot = (rr + cpu) % active`.\n    - The atomic increment keeps the counter safe under concurrency; mixing\
      \ `cpu` is a micro\u2011heuristic to decorrelate CPU paths but not essential.\n\n---\n\n- **Concrete next changes to\
