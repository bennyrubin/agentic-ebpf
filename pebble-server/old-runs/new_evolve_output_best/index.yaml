    idea_payload:
      status: continue
      design_doc:
        goals:
        - "Avoid stranding CPU capacity on SCAN-only workers when the workload is overwhelmingly GET (\u224899.5% GET, 0.5%\
          \ SCAN), so that all 6 cores contribute to the mixed workload and the queueing knee moves as close as possible to\
          \ the theoretical CPU-bound limit (~145k req/s for the current GET/SCAN costs)."
        - Ensure no worker remains significantly underutilized while others are saturated, regardless of the GET/SCAN mix,
          by using a steering policy that balances *CPU cost* across workers rather than just *request counts per verb*.
        - "Keep the eBPF selector extremely simple and cheap per packet (no new maps, minimal state in pebble_agent_state,\
          \ straight-line logic) so it remains negligible relative to the 10\xB5s/2ms synthetic DB costs."
        - Preserve flexibility to reintroduce smarter verb- or cost-aware steering later (e.g., dynamic SCAN pool sizing)
          without requiring userspace configuration changes or new maps.
        evidence:
        - "The current agent selector cleanly splits workers into GET-only (0\u20133) and SCAN-only (4\u20135) groups using\
          \ separate round-robin counters, and perf logs show near-perfect per-verb balancing with no misclassification or\
          \ mixed workloads on a single worker."
        - "At 140k offered load, each GET worker processes ~34\u201335k GET/s and each SCAN worker ~340\u2013370 SCAN/s, implying\
          \ effective CPU costs of ~29\xB5s per GET and ~2.5ms per SCAN when including parsing/I/O/scheduling overhead on\
          \ top of the 10\xB5s/2ms busy-waits."
        - "With 4 dedicated GET workers and 2 dedicated SCAN workers, the mixed workload saturates at ~135\u2013140k req/s;\
          \ the GET workers are effectively at 100% CPU, while SCAN workers are around ~85\u201390% utilized given the 0.5%\
          \ SCAN fraction, leaving some SCAN-side headroom that GETs cannot use due to the hard GET/SCAN split."
        - "At 160k offered load, the client\u2019s outstanding request count grows while server completions stay near ~135\u2013\
          140k/s and per-worker avg_get/avg_scan remain flat; this points directly to CPU saturation in userspace with requests\
          \ queuing in kernel/client buffers rather than any eBPF steering bottleneck."
        - "Given the measured per-request costs and the 99.5/0.5 mix, the theoretical CPU-bound throughput with *perfect*\
          \ balancing across all 6 workers is ~145k req/s, so the current 4+2 split is within ~4\u20137% of optimal but cannot\
          \ improve further without allowing GETs to use SCAN-worker CPU or vice versa."
        architecture:
        - 'Replace the current verb-partitioned 4+2 (GET/SCAN) worker split with a *single shared worker pool* in AgentUDPSelector:
          all packets (GET and SCAN) are steered in a simple global round-robin across the full [0..active-1] reuseport range,
          using a single round-robin counter in pebble_agent_state. This eliminates the static GET-only/SCAN-only distinction
          so that no workers sit idle while others are saturated, and lets the mixed workload naturally consume all 6 cores
          up to the true CPU-bound limit.'
        - Retain the existing classify_scan-style payload inspection only if it is needed for future cost-aware policies,
          but remove it from the hot path for selection in the initial v2 design; selection decisions become verb-agnostic
          and depend solely on the global RR index and the configured active worker count that Go already writes into pebble_agent_state.
        - Keep pebble_agent_state minimal (active + a single RR counter, possibly reusing one of the existing fields) and
          avoid any per-worker load tracking, division-heavy arithmetic, or loops so that the selector remains verifier-friendly
          and adds effectively zero measurable overhead compared to the current agent implementation.
        - Optionally, reserve the ability to extend this design later into a cost-aware variant by adding a small number of
