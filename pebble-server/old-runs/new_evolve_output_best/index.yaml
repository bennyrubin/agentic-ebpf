    - question: In cmd/workload_client/main.go, function buildPayload (and any helpers it uses), what is the exact byte layout
        of GET and SCAN request payloads on the wire (including any leading/trailing spaces or newlines)? Please show the
        implementation of buildPayload.
      answer:
        answer: "The client builds the request payload as a single ASCII line with space-separated fields and **no trailing\
          \ newline**. The layout differs slightly for GET vs SCAN.\n\n1) GET request payload layout\n\nFor a GET request,\
          \ `buildPayload` is called with `reqType == \"GET\"`. The wire format is:\n\n  \"GET\" SP KEY SP REQID\n\nwhere:\n\
          - `\"GET\"` is the literal ASCII string `G`, `E`, `T`.\n- `SP` is a single space character (`' '`, byte value 0x20).\n\
          - `KEY` is the key generated by `appendKey`:\n  - First the ASCII bytes of `prefix` are appended.\n  - Then the\
          \ decimal representation of `keyIdx`:\n    - If `keyIdx < 100000000`, it is rendered as exactly 8 decimal digits\
          \ with leading zeros (e.g. `00000042`).\n    - Otherwise it is rendered as a normal base-10 ASCII integer with no\
          \ leading zeros.\n- `REQID` is the ASCII string returned from `makeReqID`, which is made of:\n  - 16 hex digits\
          \ encoding `sendNano` (most significant nibble first),\n  - followed by 8 hex digits encoding `seq`,\n  - followed\
          \ by a single type byte: `'G'` for GET or `'S'` for SCAN.\n\nThere are **no extra spaces** other than the two shown\
          \ above, and **no newline** is appended. The buffer is not terminated with `\\n` or `\\r\\n`.\n\nSo a GET payload\
          \ looks like:\n\n  GET\u2423<prefix><8\u2011digit\u2011or\u2011longer\u2011decimal\u2011key>\u2423<16-hex-time><8-hex-seq><'G'\
          \ or 'S'>\n\n2) SCAN request payload layout\n\nFor a SCAN request, `reqType == \"SCAN\"`. An extra decimal field\
          \ for the scan limit is inserted between the key and the request ID. The wire format is:\n\n  \"SCAN\" SP KEY SP\
          \ LIMIT SP REQID\n\nwhere everything is as above, with one additional field:\n- `\"SCAN\"` is the literal ASCII\
          \ `S`, `C`, `A`, `N`.\n- `LIMIT` is the decimal ASCII representation of `scanLimit` (no leading zeros unless `scanLimit`\
          \ itself requires them); it is produced by `strconv.AppendInt` in base 10.\n\nAgain, there are **no trailing spaces**\
          \ and **no newline**. Exactly three spaces separate the four fields.\n\nSo a SCAN payload looks like:\n\n  SCAN\u2423\
          <prefix><8\u2011digit\u2011or\u2011longer\u2011decimal\u2011key>\u2423<decimal-scanLimit>\u2423<16-hex-time><8-hex-seq><'G'\
          \ or 'S'>\n\nNote: The last character of `REQID` is `'G'` or `'S'` depending on whether `isGet` was true when `makeReqID`\
          \ was called; for GET payloads it will be `'G'`, and for SCAN payloads it will be `'S'`.\n\nImplementation of buildPayload:\n\
          \n```go\nfunc buildPayload(rng *rand.Rand, buf []byte, reqType, reqID, prefix string, keySpace, scanLimit int) []byte\
          \ {\n\tbuf = buf[:0]\n\tbuf = append(buf, reqType...)\n\tbuf = append(buf, ' ')\n\tkeyIdx := rng.Intn(keySpace)\n\
          \tbuf = appendKey(buf, prefix, keyIdx)\n\tif reqType == \"SCAN\" {\n\t\tbuf = append(buf, ' ')\n\t\tbuf = strconv.AppendInt(buf,\
          \ int64(scanLimit), 10)\n\t}\n\tbuf = append(buf, ' ')\n\tbuf = append(buf, reqID...)\n\treturn buf\n}\n```\n\n\
          Helper `appendKey` that defines the key formatting:\n\n```go\nfunc appendKey(buf []byte, prefix string, keyIdx int)\
          \ []byte {\n\tbuf = append(buf, prefix...)\n\tif keyIdx < 100000000 {\n\t\tstart := len(buf)\n\t\tbuf = append(buf,\
          \ '0', '0', '0', '0', '0', '0', '0', '0')\n\t\tfor i := 7; i >= 0; i-- {\n\t\t\tbuf[start+i] = byte('0' + keyIdx%10)\n\
          \t\t\tkeyIdx /= 10\n\t\t}\n\t\treturn buf\n\t}\n\treturn strconv.AppendInt(buf, int64(keyIdx), 10)\n}\n```"
