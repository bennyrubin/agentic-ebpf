- id: 72a380710c22411089d7434439ff0da1
  idea_payload:
    status: finish
    design_doc:
      goals:
      - "Drive all configured SO_REUSEPORT workers (0..Active-1) into steady use, removing the persistent bias where 1\u2013\
        2 workers remain almost idle even when the server is CPU-saturated."
      - Reduce GET tail latency by steering rare, long SCAN requests onto a small, dedicated subset of workers so they no
        longer contend heavily with GETs on the same ReceiveFrom/handler loop.
      - 'Keep the selector simple and cheap: one map lookup, a few bounded payload reads, constant-time arithmetic, and at
        most one bpf_sk_select_reuseport call per packet, with no additional maps and no new userspace configuration.'
      - 'Respect existing control surfaces: reuse the current pebble_agent_state map and its Active field exactly as initialised
        by loadAgent, avoiding any need to touch Go beyond what it already does for the agent policy.'
      evidence:
      - "The current agent selector uses only reuse->hash % Active and a fixed search loop over pebble_udp_targets; logs show\
        \ that with a single UDPConn sender, only 4\u20135 of 6 workers see traffic, so hash-based steering alone is not achieving\
        \ uniform utilisation."
      - "Throughput plateaus around ~100\u2013105k req/s while 1\u20132 workers remain mostly idle; this indicates CPU saturation\
        \ on the active workers plus a missed opportunity to exploit the idle cores via better reuseport steering."
      - "Given 0.5% SCANs at 2ms and 99.5% GETs at 10\xB5s, SCANs consume roughly half of total CPU despite their rarity,\
        \ so letting them share workers with GETs is expected to cause substantial head-of-line blocking for GETs on those\
        \ workers."
      - 'loadAgent initialises pebble_agent_state with a single AgentSelectorAgentState{Active: uint32(workers)} at key 0
        using ebpf.UpdateAny, fully overwriting any existing value; this guarantees that on each server start the BPF-side
        state begins from a clean, known layout with a single Active field.'
      - buildPayload always emits uppercase "GET" or "SCAN" as the first token, followed by a space and other ASCII fields,
        with no leading whitespace and no newline; this makes it safe and cheap for eBPF to classify request type by inspecting
        the first 4 bytes of sk_reuseport_md->data.
      - pebble_agent_state is unique to the agent policy, and worker indices are treated purely as positional (0..workers-1)
        with no special semantics, so the agent selector is free to impose its own static mapping of GETs vs SCANs onto the
        index range.
      architecture:
      - Keep the existing pebble_agent_state map as a single-entry, pinned ARRAY that only exposes an Active uint32 field.
        AgentUDPSelector performs a single lookup on this map (key 0) to obtain the current worker count; it does not modify
        the map or add new fields, so userspace configuration remains unchanged.
      - "Classify each packet as GET, SCAN, or \"other\" entirely inside AgentUDPSelector by peeking at the payload via sk_reuseport_md->data/data_end:\
        \ if the packet is at least 5 bytes long and the first 4 bytes are 'S','C','A','N', treat it as SCAN; if the first\
        \ 3 bytes are 'G','E','T', treat it as GET; otherwise, fall back to treating it as GET. This matches the current workload\u2019\
        s wire format while remaining safe for shorter or malformed packets."
      - "Replace the current hash%active + 128-iteration search loop with a single-step, stateless selection that mixes in\
        \ a small amount of payload entropy to decorrelate from the kernel\u2019s reuseport hash: start from h = reuse->hash,\
        \ then, if the payload is long enough, XOR in a 32-bit word derived from a few bytes near the end of the payload (e.g.,\
        \ part of the reqID). This ensures per-packet variation even for a single 4\u2011tuple sender, improving distribution\
        \ without any extra state."
      - "Implement a simple, static GET/SCAN split over the worker index space using only Active from pebble_agent_state and\
        \ compile-time constants:\n  - If Active == 0: immediately return SK_PASS to let the kernel choose.\n  - If Active\
        \ == 1: always target slot 0 for all requests.\n  - If Active >= 2: reserve the highest-index worker (slot Active-1)\
        \ as the SCAN worker and use the lower workers (slots 0..Active-2) for GETs/\"other\".\n    \u2022 For SCAN: deterministically\
        \ choose slot = Active-1 (all SCANs share the dedicated SCAN worker).\n    \u2022 For GET/other: compute slot = h\
        \ % (Active-1), giving a stateless but more uniformly distributed mapping of GETs across the first Active-1 workers."
      - "After computing slot, call bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0) exactly once. If the call\
        \ returns 0 (success), immediately return SK_PASS so the kernel delivers the packet to the chosen socket. If it fails\
        \ (e.g., due to an unexpected empty slot or a race with userspace closing a socket), simply return SK_PASS without\
        \ retry, allowing the kernel to fall back to its default selection logic. This removes the large unrolled retry loop,\
        \ keeps instructions and branches minimal, and relies on the server\u2019s target-map maintenance to ensure slots\
        \ 0..Active-1 are normally valid."
      - "By dedicating one worker (Active-1) to SCANs and letting all remaining workers focus on GETs, the design isolates\
        \ the high-cost SCAN path onto its own receive queue and goroutine. Under the current 0.5% SCAN mix, this approximates\
        \ giving SCANs roughly one core\u2019s worth of capacity while preserving five workers' worth of capacity for GETs,\
        \ greatly reducing the chance that a 2ms SCAN will stall a long chain of 10\xB5s GETs on the same worker."
      risks:
      - Request classification in BPF is intentionally simple and assumes that commands start with uppercase "GET" or "SCAN"
        and no leading whitespace, as in the current client. If future clients introduce new verbs (e.g., "MGET") or lowercase
        variants, the selector will classify them as GETs and they will share the GET pool; this is safe but would lose any
        intended special treatment for new verbs.
      - "Reserving exactly one worker for SCANs is tuned to the current workload (0.5% SCAN, 2ms vs 10\xB5s). If the SCAN\
        \ fraction or cost increases significantly in future scenarios, that single SCAN worker could become a bottleneck,\
        \ incurring large SCAN queueing while GETs proceed smoothly; this is a deliberate tradeoff to protect GET latency\
        \ and can be revisited (e.g., by changing the compiled-in number of SCAN workers) if needed."
      - The improved hash that mixes reuse->hash with a few payload bytes is still a static, stateless function; it cannot
        react to transient per-worker backlog or UDP receive queue occupancy. Under heavy sustained overload with small SO_RCVBUF,
        the server will still eventually drop packets once aggregate arrival rate exceeds CPU capacity, although capacity
        and fairness should improve compared to the previous hash-only selector.
      - The design assumes that all indices 0..Active-1 in pebble_udp_targets are kept up to date with valid socket fds by
        the existing Go-side updateTargetsMap logic. If any index within the "GET" or "SCAN" regions is left empty due to
        a future bug or misconfiguration, the selector will not retry other slots and instead let the kernel fall back to
        its default choice, potentially reducing control over worker assignment in those rare cases.
      - Reading a few bytes from the packet payload in the sk_reuseport path adds a small but real amount of work to the selector.
        While this cost is negligible compared to the tens of microseconds per request of application processing, it should
        still be kept to a minimum (e.g., avoid loops over the payload) to ensure we do not unintentionally become CPU-significant
        at much higher packet rates.
