    assistant_content_raw: "{\n  \"status\": \"finish\",\n  \"design_doc\": {\n    \"goals\": [\n      \"Increase effective\
      \ CPU utilization under mixed GET/SCAN workloads by avoiding permanent reservation of some workers as SCAN-only, so\
      \ that all N reuseport workers can contribute to the overall throughput and push the queueing knee closer to the true\
      \ CPU-bound limit (\u2248145k req/s in the evaluated 99.5% GET mix).\",\n      \"Balance load across workers in proportion\
      \ to per-request CPU cost (short GET vs long SCAN) as much as possible using simple, verb-agnostic steering, so that\
      \ no worker is significantly under- or over-utilized relative to others.\",\n      \"Keep the AgentUDPSelector eBPF\
      \ program extremely simple and cheap per packet: use only the existing pebble_agent_state map (no new maps), keep state\
      \ minimal (Active + one counter), and implement straight-line, verifier-friendly logic.\",\n      \"Avoid introducing\
      \ any new userspace configuration or control surfaces: the Go side should continue to write only the Active worker count\
      \ into pebble_agent_state, with all additional selector behavior determined entirely inside eBPF.\",\n      \"Maintain\
      \ flexibility to extend the design later (e.g., add lightweight cost-aware heuristics or limited SCAN isolation) without\
      \ breaking existing userspace code or requiring new maps.\"\n    ],\n    \"evidence\": [\n      \"The evaluation summary\
      \ shows that with 6 workers and the current agent selector, workers 0\u20133 receive only GETs and workers 4\u20135\
      \ receive only SCANs; within each group, per-verb counts are evenly balanced via per-verb round-robin selection, and\
      \ aggregate GET+SCAN completions match the client\u2019s sent/recv totals, indicating correct routing and good intra-group\
      \ balance.\",\n      \"From the 140k req/s run, each GET worker completes ~34\u201335k GET/s and each SCAN worker ~340\u2013\
      370 SCAN/s. This implies an effective CPU cost of ~29\xB5s core time per GET and ~2.5ms per SCAN (busy-wait plus parsing/I/O/scheduling\
      \ overhead), consistent across runs.\",\n      \"Given 4 dedicated GET workers and 2 dedicated SCAN workers, and a highly\
      \ GET-skewed mix (\u224899.5% GET in the described evaluation), the system saturates at ~135\u2013140k req/s. Under\
      \ these costs, the theoretical capacity with perfect sharing of all 6 cores across both verbs is \u2248145k req/s, while\
      \ the 4+2 partition effectively leaves some SCAN-side headroom unused by GETs, producing an observed gap that matches\
      \ the theoretical ~4\u20137% loss in capacity.\",\n      \"At 160k offered load, client logs show outstanding requests\
      \ growing while server completions stay ~135\u2013140k/s and per-worker avg_get/avg_scan remain near the configured\
      \ 10\xB5s/2ms delays. This indicates a CPU-saturated userspace, not an eBPF bottleneck: excess requests accumulate in\
      \ kernel/client queues, inflating end-to-end p99 latency (~1s) once demand exceeds service capacity.\",\n      \"The\
      \ Go-side type for pebble_agent_state (ebpfutil.AgentSelectorAgentState) currently contains only an Active uint32, and\
      \ internal/server/ebpf.go initializes this single field. This means user space does not depend on any additional state\
      \ fields; the selector can safely add extra fields to the BPF-side state struct for internal use, provided Active remains\
      \ the first field.\",\n      \"internal/server.server.go and run_exp.py treat workers generically: they aggregate per-worker\
      \ GET and SCAN counters and latencies without assigning semantic roles (GET-only vs SCAN-only) to particular worker\
      \ indices. No analysis or plotting relies on index ranges; they rely purely on per-verb counters. This frees the selector\
      \ to change worker/verb mappings without requiring application changes.\"\n    ],\n    \"architecture\": [\n      \"\
      Use AgentUDPSelector as a *single-pool, verb-agnostic* dispatcher. Replace the current verb-partitioning logic (separate\
      \ GET and SCAN worker ranges) with a unified, global round-robin across all active reuseport workers: every arriving\
      \ packet, regardless of verb, is assigned slot = (rr++) mod Active, where rr is a single 32-bit counter stored in pebble_agent_state\
      \ alongside Active.\",\n      \"Simplify pebble_agent_state to hold just two conceptual fields: Active (worker count,\
      \ set by Go as today) and Rr (a global round-robin counter, maintained exclusively in eBPF). The Go-side struct already\
      \ exposes Active; any additional field(s) are appended and left zero-initialized by userspace, ensuring backward compatibility\
      \ and no new configuration requirements.\",\n      \"Eliminate SCAN classification from the *selection* hot path for\
      \ the next-generation agent policy. The selector no longer needs to inspect payloads or maintain per-verb counters:\
      \ scheduling decisions are based solely on the global RR index and Active. This reduces per-packet work in BPF and,\
      \ more importantly, prevents the hard 4+2 GET/SCAN worker split that strands capacity when the workload is strongly\
      \ skewed.\",\n      \"Rely on the law of large numbers for cost balancing: with a global RR dispatcher and a fixed GET/SCAN\
      \ mix, each worker observes roughly the same GET/SCAN distribution, so their average CPU utilization converges. Because\
      \ SCANs are much more expensive than GETs but relatively rare (in the evaluated runs), this mixture yields nearly equal\
      \ CPU load on all workers and thus minimizes the maximum per-worker load for a given total throughput.\",\n      \"\
      Keep the selector logic strictly straight-line and verifier-friendly: one pebble_agent_state lookup, a fetch+increment\
      \ of the RR counter, a modulo by Active (with simple guards for Active \u2264 1), a single bpf_sk_select_reuseport call,\
      \ and SK_PASS. No loops, no dynamic branching on packet headers, no per-worker maps, and no dependence on external configuration.\"\
      ,\n      \"Optionally, reserve room in the pebble_agent_state struct for future extensions (e.g., a tiny number of integral\
      \ tuning constants or aggregate per-verb counters) but do not rely on them in this iteration. Future versions could,\
      \ for example, implement a very small SCAN-preferred subset or probabilistic SCAN steering when the SCAN fraction is\
      \ high, yet still avoid userspace configuration by using fixed constants and purely in-kernel state.\"\n    ],\n   \
      \ \"risks\": [\n      \"Struct layout compatibility: the Go type ebpfutil.AgentSelectorAgentState currently has only\
      \ an Active field. Extending the BPF-side state struct to include a new RR counter requires regenerating bindings so\
      \ that the Go struct also has the new field(s) appended. Using named field initialization (`AgentSelectorAgentState{Active:\
      \ ...}`) should keep existing code building and leave new fields zero-initialized, but this must be verified when changing\
      \ the eBPF C definition and regenerating assets.\",\n      \"Change in worker/verb mapping: moving from a 4+2 GET/SCAN\
      \ partition to a shared pool where every worker sees both GETs and SCANs will change the shape of per-worker stats (each\
      \ worker will now report both GET and SCAN counts). While internal/server and run_exp.py are already index-agnostic,\
      \ any external tooling or ad-hoc analysis scripts that assumed specific worker index ranges for specific verbs could\
      \ need updating.\",\n      \"Latency trade-offs under higher SCAN fractions: with verb-agnostic RR, long SCAN requests\
      \ will occasionally sit in front of GET requests on the same worker, creating head-of-line blocking for those GETs.\
      \ For the evaluated, very GET-skewed workload this effect should be small relative to the overall queueing behavior\
      \ near saturation, but in future scenarios with higher SCAN fractions this design could increase GET-specific tail latency\
      \ compared to a strict partitioning policy. If such workloads are important, a follow-on iteration may need to reintroduce\
      \ limited SCAN isolation or cost-aware steering while keeping the implementation simple.\"\n    ]\n  },\n  \"questions\"\
      : []\n}"
