    \  get_slots=4 (workers 0\u20133) handle GETs\n *       scan_slots=2 (workers 4\u20135) handle SCANs\n *\n * This gives\
    \ SCANs more than one core at higher worker counts while still\n * preserving enough GET capacity and keeping the logic\
    \ constant\u2011time.\n */\n\n#include <linux/ip.h>\n#include <linux/udp.h>\n#include <linux/in.h>\n\nstruct agent_state\
