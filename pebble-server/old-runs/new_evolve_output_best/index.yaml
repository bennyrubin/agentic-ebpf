    \ * This selector sends every incoming UDP request to one of the active\n * SO_REUSEPORT workers using a single global\
    \ round\u2011robin counter stored\n * in pebble_agent_state. It is completely verb\u2011agnostic (no GET/SCAN\n * parsing),\
    \ so all workers handle both short GETs and long SCANs.\n *\n * Goals satisfied:\n *   - No dedicated GET\u2011only or\
    \ SCAN\u2011only workers: all N workers share\n *     the mixed workload, improving overall CPU utilization and pushing\n\
    \ *     the queueing knee closer to the true CPU limit.\n *   - Load balanced by request count: a simple global RR counter\
    \ spreads\n *     requests evenly across workers, which is a good approximation to\n *     cost\u2011proportional balancing\
    \ when request costs are fairly stable.\n *   - Extremely cheap per packet: one ARRAY lookup, one atomic counter\n * \
    \    increment (BPF_XADD), a few integer ops, and a single\n *     bpf_sk_select_reuseport() call.\n *   - Minimal state\
    \ and no new control surfaces: pebble_agent_state\n *     continues to be written from Go with only the Active field;\
    \ rr is\n *     maintained solely by this BPF program.\n *\n * State layout\n * ------------\n *   struct agent_state\
    \ {\n *       __u32 active;  // # of active workers, written by Go once\n *       __u32 rr;      // global round\u2011\
    robin counter, updated in BPF\n *   };\n *\n * Implementation\n * --------------\n *   1) Look up agent_state[0]. If missing\
    \ or active==0, return SK_PASS so\n *      the kernel chooses a socket.\n *   2) Clamp active to the sockarray size (128)\
    \ for safety.\n *   3) Snapshot rr and then atomically increment it using XADD:\n *\n *         rr = state->rr;\n *  \
    \       (void)__sync_fetch_and_add(&state->rr, 1);\n *\n *      We intentionally ignore the atomic's return value so that\
    \ LLVM\n *      lowers it to a pure BPF_XADD without backend issues.\n *\n *   4) Compute slot = rr % active (or 0 if\
    \ active==1) and call\n *      bpf_sk_select_reuseport() exactly once. If it fails, the kernel\n *      falls back to\
    \ its own selection logic.\n *\n * The logic is straight\u2011line, uses only allowed helpers, maintains a\n * single\
    \ counter in pebble_agent_state, and keeps per\u2011packet overhead\n * minimal while spreading mixed GET/SCAN load across\
    \ all workers.\n */\n\nstruct agent_state {\n    __u32 active; /* number of configured workers (0..active-1) */\n    __u32\
    \ rr;     /* global round-robin counter */\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries,\
    \ 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state\
    \ SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n\
    {\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n\
    \        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\n    /*\
    \ Safety clamp: sockarray is sized to 128 entries. */\n    if (active > 128)\n        active = 128;\n\n    /* Snapshot\
    \ the current RR value, then atomically bump it.\n     * We ignore the __sync_fetch_and_add() return value so LLVM/BPF\n\
    \     * emits a plain XADD and stays verifier-friendly.\n     */\n    __u32 rr = state->rr;\n    (void)__sync_fetch_and_add(&state->rr,\
    \ 1);\n\n    __u32 slot;\n    if (active > 1)\n        slot = rr % active;\n    else\n        slot = 0;\n\n    /* Exactly\
    \ one selection attempt; extra calls would be ignored. */\n    (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets,\
