    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector\n *\n * Design goals\n * ------------\n\
    \ * 1) Drive all SO_REUSEPORT workers into steady use:\n *    - The previous policy used only reuse->hash % Active plus\
    \ a linear\n *      probe. With a single UDPConn sender this produced a strong bias\n *      where 1\u20132 workers stayed\
    \ almost idle even when others were\n *      saturated.\n *    - This version uses a simple round\u2011robin counter stored\
    \ in\n *      pebble_agent_state so that every packet advances the index,\n *      ensuring that all [0..Active-1) workers\
    \ see traffic regardless\n *      of the flow hash.\n *\n * 2) Isolate long SCAN requests from short GETs:\n *    - SCANs\
    \ are rare but ~200x more expensive than GETs, so sharing\n *      workers causes head\u2011of\u2011line blocking for\
    \ GETs and inflates p99.\n *    - We classify requests by peeking into the UDP payload: payloads\n *      begin with the\
    \ ASCII verb \"GET \" or \"SCAN \" (see buildPayload\n *      in the client). We parse IPv4+UDP headers using ctx->data\
    \ /\n *      ctx->data_end from struct sk_reuseport_md and check for \"SCAN\".\n *    - For Active >= 3, we dedicate a\
    \ small tail subset of workers to\n *      SCAN requests (roughly 1/4 of the pool, clamped so at least one\n *      worker\
    \ always handles GETs). GETs are round\u2011robined across the\n *      remaining workers; SCANs across the scan subset.\
    \ For very small\n *      worker counts (<=2), we skip splitting and just round\u2011robin.\n *\n * 3) Keep the selector\
    \ verifier\u2011friendly and cheap:\n *    - One array map lookup (pebble_agent_state), no additional maps.\n *    - No\
    \ loops, only straight\u2011line bounds\u2011checked header parsing.\n *    - Exactly one bpf_sk_select_reuseport() call\
    \ per packet.\n *    - All randomness\u2011free and deterministic; state is kept only in\n *      pebble_agent_state via\
    \ simple 32\u2011bit counters.\n *\n * 4) Respect existing control surfaces:\n *    - The Go server writes AgentSelectorAgentState{Active:\
    \ workers}\n *      into pebble_agent_state at key 0. We extend the C struct with\n *      extra fields for our counters;\
    \ they are zero\u2011initialised on\n *      update, so behavior is well\u2011defined without any Go changes.\n */\n\n\
    #include <linux/ip.h>\n#include <linux/udp.h>\n#include <linux/in.h>\n\nstruct agent_state {\n    __u32 active;   /* number\
    \ of configured workers (0..Active-1) */\n    __u32 get_rr;   /* round-robin counter for GET (and generic) */\n    __u32\
    \ scan_rr;  /* round-robin counter for SCAN workers */\n    __u32 pad;      /* reserved for future use / alignment */\n\
    };\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value,\
    \ struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state SEC(\".maps\");\n\nstatic __always_inline\
    \ int classify_scan(struct sk_reuseport_md *reuse)\n{\n    /* Default to \"not a SCAN\" unless we can confidently detect\
    \ \"SCAN\". */\n    int is_scan = 0;\n\n    void *data = (void *)(long)reuse->data;\n    void *data_end = (void *)(long)reuse->data_end;\n\
    \    char *cursor = data;\n\n    /* We assume data starts at the IPv4 header (consistent with sk_reuseport_md). */\n \
    \   struct iphdr *iph = (struct iphdr *)cursor;\n    if ((void *)(iph + 1) > data_end)\n        return 0;\n\n    if (iph->protocol\
    \ != IPPROTO_UDP)\n        return 0;\n\n    __u32 ihl_len = (__u32)iph->ihl * 4;\n    if (ihl_len < sizeof(*iph))\n  \
    \      return 0;\n\n    cursor += ihl_len;\n    if ((void *)cursor + sizeof(struct udphdr) > data_end)\n        return\
    \ 0;\n\n    cursor += sizeof(struct udphdr);\n    if ((void *)cursor + 4 > data_end)\n        return 0;\n\n    /* Payload\
    \ begins with \"GET \" or \"SCAN \". We only need to detect \"SCAN\". */\n    if (cursor[0] == 'S' && cursor[1] == 'C'\
    \ &&\n        cursor[2] == 'A' && cursor[3] == 'N')\n        is_scan = 1;\n\n    return is_scan;\n}\n\nSEC(\"sk_reuseport/selector\"\
    )\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state\
    \ = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n\
    \    if (active == 0)\n        return SK_PASS;\n\n    /* Classify request type using UDP payload, if possible. */\n  \
    \  int is_scan = classify_scan(reuse);\n\n    __u32 slot = 0;\n\n    if (active <= 2) {\n        /* Small pools: just\
    \ round-robin across all workers. */\n        __u32 rr = state->get_rr++;\n        if (active > 1)\n            slot =\
    \ rr % active;\n        else\n            slot = 0;\n    } else {\n        /*\n         * Larger pools: reserve a small\
    \ tail subset of workers for SCAN.\n         * - scan_slots \u2248 active / 4, but at least 1 and at most active-1.\n\
    \         * - Workers [0 .. get_slots-1]  : primarily GET traffic.\n         * - Workers [get_slots .. active-1] : SCAN\
    \ traffic.\n         */\n        __u32 scan_slots = active / 4;\n        if (scan_slots == 0)\n            scan_slots\
    \ = 1;\n        if (scan_slots >= active)\n            scan_slots = active - 1;\n\n        __u32 get_slots = active -\
    \ scan_slots; /* >= 1 */\n\n        if (is_scan) {\n            __u32 rr = state->scan_rr++;\n            if (scan_slots\
    \ > 1)\n                slot = get_slots + (rr % scan_slots);\n            else\n                slot = get_slots; /*\
    \ single dedicated SCAN worker */\n        } else {\n            __u32 rr = state->get_rr++;\n            if (get_slots\
    \ > 1)\n                slot = rr % get_slots;\n            else\n                slot = 0; /* only worker 0 for GETs\
    \ */\n        }\n    }\n\n    if (slot >= active) {\n        /* Safety clamp; should not normally trigger. */\n      \
    \  if (active > 0)\n            slot %= active;\n        else\n            slot = 0;\n    }\n\n    /* Exactly one selection\
    \ attempt; kernel ignores any additional calls. */\n    (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot,\
    \ 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
