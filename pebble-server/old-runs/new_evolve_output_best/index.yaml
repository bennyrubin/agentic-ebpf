  code: "//go:build ignore\n\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);\n\
    \    __uint(max_entries, 128);\n    __type(key, __u32);\n    __type(value, __u32);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
    } pebble_udp_targets SEC(\".maps\");\n\n// EVOLVE-BLOCK-START\n/*\n * Agent UDP selector\n *\n * Approach\n * --------\n\
    \ * This selector intentionally does NOT special\u2011case GET vs SCAN or reserve\n * any workers for a particular verb.\
    \ Instead, every incoming packet is\n * distributed in a simple, global round\u2011robin across all configured\n * SO_REUSEPORT\
    \ workers.\n *\n * Motivation:\n *   - Under mixed GET/SCAN workloads, dedicating a subset of workers to\n *     SCANs\
    \ leaves some cores under\u2011utilized when SCAN traffic is sparse,\n *     and causes localized queue build\u2011ups\
    \ when SCANs surge.\n *   - By letting all N workers handle both short (GET) and long (SCAN)\n *     requests, we keep\
    \ utilization more uniform and push the queueing\n *     knee closer to the true CPU limit.\n *   - We deliberately avoid\
    \ per\u2011flow hashing so that occasional long SCANs\n *     are smeared across workers instead of all landing on one\
    \ unlucky\n *     socket, which reduces tail latency at high load.\n *\n * Design:\n *   - The pebble_agent_state map\
    \ stores:\n *\n *       struct agent_state {\n *           __u32 active;  // number of workers; written by Go once\n *\
    \           __u32 rr;      // global round\u2011robin counter; updated in BPF\n *       };\n *\n *     Go code already\
    \ writes only the Active field; rr is naturally\n *     zero\u2011initialized on map update and then maintained entirely\
    \ in BPF.\n *\n *   - For each packet:\n *       1) Read active. If zero, fall back to kernel selection (SK_PASS).\n *\
    \       2) Increment rr and compute slot = rr % active (or 0 if active==1).\n *       3) Call bpf_sk_select_reuseport\
    \ exactly once with that slot.\n *\n * Properties:\n *   - Verb\u2011agnostic: does not inspect payloads at all.\n * \
    \  - Minimal state: one counter shared by all CPUs plus Active.\n *   - Straight\u2011line, verifier\u2011friendly logic\
    \ (no loops, no complex parsing).\n *   - Cheap per packet: one map lookup, one 32\u2011bit increment, one 32\u2011bit\n\
    \ *     division, and a single bpf_sk_select_reuseport() helper call.\n */\n\nstruct agent_state {\n    __u32 active;\
    \ /* number of configured workers (0..active-1) */\n    __u32 rr;     /* global round-robin counter */\n};\n\nstruct {\n\
    \    __uint(type, BPF_MAP_TYPE_ARRAY);\n    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct\
    \ agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n} pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\"\
    )\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state\
    \ = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n\
    \    if (active == 0)\n        return SK_PASS;\n\n    /* Clamp to the sockarray size for safety, though Go should enforce\
    \ this. */\n    if (active > 128)\n        active = 128;\n\n    /* Global round-robin across [0 .. active-1]. Exact atomicity\
    \ is not\n     * required; approximate fairness is sufficient under load. */\n    __u32 rr = state->rr++;\n    __u32 slot\
    \ = 0;\n\n    if (active > 1)\n        slot = rr % active;\n    else\n        slot = 0;\n\n    /* Extra safety: ensure\
    \ slot is in range even if Active changed between\n     * reading it and using it. */\n    if (slot >= active)\n     \
    \   slot = slot % active;\n\n    /* Exactly one selection attempt; additional calls would be ignored. */\n    (void)bpf_sk_select_reuseport(reuse,\
    \ &pebble_udp_targets, &slot, 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") =\
    \ \"GPL\";"
