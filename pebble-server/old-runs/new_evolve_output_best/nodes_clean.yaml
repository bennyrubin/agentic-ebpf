      )\nenum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state\
      \ = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if (!state)\n        return SK_PASS;\n\n    __u32 active =\
      \ state->active;\n    if (active == 0)\n        return SK_PASS;\n\n    /* Safety clamp: sockarray is sized to 128 entries.\
      \ */\n    if (active > 128)\n        active = 128;\n\n    /* Atomically increment the global RR counter.\n     * The\
      \ BPF backend for LLVM does not allow using the XADD return value,\n     * so we discard it and then take a best-effort\
      \ snapshot of rr.\n     */\n    __sync_fetch_and_add(&state->rr, 1);\n\n    /* Snapshot after increment; races are acceptable\
      \ for RR spreading. */\n    __u32 rr = state->rr;\n\n    __u32 slot;\n    if (active > 1)\n        slot = rr % active;\n\
      \    else\n        slot = 0;\n\n    /* Exactly one selection attempt; extra calls would be ignored. */\n    (void)bpf_sk_select_reuseport(reuse,\
