- id: bd44584fa51a4fe2b6d64785deba3d69
  idea_summary: Bootstrap node
  idea_payload: null
  parent_id: null
  eval_summary: "The experiments run a UDP pebble server with 6 SO_REUSEPORT workers and the eBPF \u2018agent\u2019 sk_reuseport\
    \ selector, under synthetic delays of 10\xB5s per GET and 2ms per SCAN with 99.5% GETs. The client uses a single send\
    \ worker and a single UDPConn, rate-limited at 80k, 100k, 140k, and 160k req/s. The eBPF agent program simply hashes the\
    \ kernel-provided reuseport hash modulo a fixed \u201Cactive\u201D worker count (set once to 6 and never updated) and\
    \ calls bpf_sk_select_reuseport; it does not look at request type or any load signal. Across runs, server-side \u201C\
    [perf]\u201D logs show that only 4\u20135 of the 6 workers ever see traffic, that their in-handler latencies remain pinned\
    \ near the configured synthetic delays, and that aggregate processed throughput plateaus around ~100\u2013105k req/s.\
    \ Client logs show that at 80k RPS the system runs stably with low outstanding requests, but at 100k RPS the outstanding\
    \ depth grows while all responses still arrive; at 140k and 160k RPS, outstanding counts explode and 18\u201323% of responses\
    \ never arrive, while the server continues to process at ~100k req/s and both server and client UDP sockets use default\
    \ (small) receive buffers."
  eval_hypothesis: "The observed behavior is best explained by a CPU\u2011limited server plus small UDP receive buffers, combined\
    \ with an eBPF selector that provides only static, hash\u2011based steering and no request\u2011aware load control.\n\n\
    At runtime the server creates 6 reuseport UDP sockets and 6 worker goroutines, and the eBPF \u2018agent\u2019 policy is\
    \ configured with Active=6 once at startup. For each packet, the program uses the kernel\u2019s reuseport hash and selects\
    \ a worker index as `hash % active`, then bpf_sk_select_reuseport enforces that choice. Since the client uses only a single\
    \ UDPConn, there is only one logical sender, but the kernel\u2019s reuseport hash nevertheless distributes packets across\
    \ a subset of workers; in the logs, 4\u20135 workers per run consistently receive traffic, while 1\u20132 workers remain\
    \ idle. Among the active workers, the load is moderately skewed but of the right order (e.g., ~20\u201327k gets/s on the\
    \ busiest worker at higher rates), so there is no evidence of a catastrophic imbalance; the eBPF policy is effectively\
    \ acting as a simple, static hash distributor over the active subset.\n\nEach worker processes requests sequentially in\
    \ a tight loop: ReadFromUDP \u2192 parseRequest \u2192 busy\u2011wait for 10\xB5s or 2ms \u2192 WriteToUDP. handleRequest\u2019\
    s stats timing starts immediately before the busy\u2011wait and ends immediately after it, so the logged avg_get\u2248\
    10\xB5s and avg_scan\u22482ms reflect only the synthetic delay, not any time spent queued in the kernel, blocked in ReadFromUDP,\
    \ or doing parsing/formatting and syscalls. In aggregate, though, the logs show that the server can sustain only about\
    \ 100\u2013105k requests/s across its active workers. Given 4\u20135 busy workers and the observed saturation point, the\
    \ true per-request CPU cost (busy\u2011wait plus Go and network overhead) is on the order of tens of microseconds per\
    \ request, which consumes essentially all of the CPU time available on the server\u2019s 6 pinned cores once the offered\
    \ rate reaches ~100k RPS.\n\nAt 80k RPS, arrival rate is comfortably below this capacity, kernel UDP receive queues remain\
    \ short, and end\u2011to\u2011end client latency is dominated by the synthetic delays; outstanding requests stay low and\
    \ no responses are lost. At 100k RPS, the offered rate roughly matches the server\u2019s processing capacity. The server\
    \ continues to report ~10\xB5s/2ms in-handler latencies and ~95\u2013100k processed requests/s, but the client\u2019s\
    \ outstanding depth climbs into the tens of thousands and p99 latency around 0.5s emerges. This divergence is explained\
    \ by queueing: packets spend increasing time sitting in per-socket UDP receive queues and waiting for a busy worker goroutine\
    \ to reach its next ReadFromUDP; that queueing delay is invisible to the server\u2019s stats but fully visible in the\
    \ client\u2019s send\u2192recv timing.\n\nAt 140k and 160k RPS, the client overdrives the system well beyond this ~100k/s\
    \ service rate. The server still processes at roughly the same ~100k/s for most of the run (as shown by \u201C[perf] interval\u201D\
    \ lines), indicating CPU\u2011bound throughput that no longer scales with input rate. Because neither the server nor the\
    \ client configures SO_RCVBUF/ReadBuffer, both sides rely on relatively small default UDP receive buffers. On the server\
    \ side, as outstanding requests reach into the hundreds of thousands, the per-worker UDP receive queues quickly overflow;\
    \ this is visible in the gap between total client sends and total requests counted in server \u201C[perf]\u201D logs (e.g.,\
    \ at 160k, only ~910k of 1.1M sends are ever processed by the server). Additional loss occurs on the return path and/or\
    \ at the client\u2019s UDP receive buffer: the client receives fewer responses than the server processes (tens of thousands\
    \ difference at high rates), even though the receive goroutine continues reading after timeouts and only exits on connection\
    \ close, so many server replies are simply dropped before the client application sees them. The client\u2019s outstanding\
    \ counters and missing-response warnings at the end of the 140k and 160k runs therefore reflect both requests that never\
    \ reached handleRequest and responses that were processed and sent by the server but dropped in transit or at the client\u2019\
    s socket.\n\nThe eBPF \u2018agent\u2019 selector is thus not the primary performance limiter. It neither incorporates\
    \ any notion of worker load nor distinguishes GET from SCAN, so SCANs (with 2ms CPU spins) occasionally occupy a worker\
    \ and delay subsequent GETs, but their 0.5% share means they contribute only a modest fraction of the total CPU load.\
    \ The dominant factors are: (1) a fixed pool of 4\u20135 effectively utilized workers whose CPU\u2011bound hot path caps\
    \ throughput near 100k req/s, and (2) small UDP receive buffers on both server and client that cannot absorb the sustained\
    \ overload at 140k and 160k RPS, leading to drops. Because handleRequest\u2019s internal timing ignores queueing and network\
    \ overhead, the server\u2019s \u201C[perf]\u201D logs stay near the configured synthetic delays even as the client observes\
    \ exploding p99 latencies and significant packet loss. Overall, the system behaves like an overloaded, CPU\u2011saturated\
    \ UDP service where static hash-based eBPF routing and default buffer sizes allow queues to build and then overflow once\
    \ the offered rate exceeds the true processing capacity."
