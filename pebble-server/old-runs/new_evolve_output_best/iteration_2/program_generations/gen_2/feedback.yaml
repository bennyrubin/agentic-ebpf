  \ with queueing at 160k, not a steering bug.\n  - Busy\u2011wait averages stay ~10\xB5s/2ms \u2192 BPF overhead is negligible.\n\
  \nNet: this is a **correct, simple, and effective** implementation of the \u201Call workers handle mixed GET/SCAN via simple\
  \ RR\u201D idea. Remaining issues are micro\u2011level, not conceptual.\n\n---\n\n**Key behaviors / takeaways**\n\n- **Load\
  \ distribution**\n  - All workers see both verbs; GET and SCAN counts are tightly clustered per worker.\n  - No evidence\
  \ of underutilized or overloaded outliers.\n- **Throughput / latency**\n  - Clean, monotonic p99 growth up to ~140k, then\
  \ blow\u2011up at 160k due to backlog.\n  - Plateau around ~135\u2013140k/s is consistent with userspace CPU saturation\
  \ given per\u2011request cost model.\n- **Implementation detail**\n  - You currently:\n    ```c\n    __u32 rr = state->rr;\n\
  \    (void)__sync_fetch_and_add(&state->rr, 1);\n    ```\n    This leaves a tiny race window between the non\u2011atomic\
  \ read and the XADD; on busy systems it can lose increments (harmless for throughput, but slightly fuzzes fairness) and\
  \ is more complex than necessary.\n\n---\n\n**Concrete next changes to try**\n\n1. **Use the atomic return value and drop\
