  \ still using a single global counter:\n *\n *        slot = (rr + cpu_id) % active;\n *\n *    This keeps effective round\u2011\
  robin fairness but reduces the chance that all\n *    CPUs momentarily contend for the same worker when the counter wraps\
  \ or\n *    bursts arrive in lockstep.\n *\n * 4) Call bpf_sk_select_reuseport exactly once using that slot into the\n *\
  \    pebble_udp_targets sockarray. If the helper fails, the kernel will fall\n *    back to its own reuseport selection.\n\
  \ *\n * The logic is straight\u2011line, uses only verifier\u2011approved helpers, and keeps\n * per\u2011packet overhead\
  \ minimal while balancing load across all workers.\n */\n\nstruct agent_state {\n    __u32 active; /* number of configured\
  \ workers (0..active-1) */\n    __u32 rr;     /* global round-robin counter */\n};\n\nstruct {\n    __uint(type, BPF_MAP_TYPE_ARRAY);\n\
  \    __uint(max_entries, 1);\n    __type(key, __u32);\n    __type(value, struct agent_state);\n    __uint(pinning, LIBBPF_PIN_BY_NAME);\n\
  } pebble_agent_state SEC(\".maps\");\n\nSEC(\"sk_reuseport/selector\")\nenum sk_action agent_udp_selector(struct sk_reuseport_md\
  \ *reuse)\n{\n    __u32 key = 0;\n    struct agent_state *state = bpf_map_lookup_elem(&pebble_agent_state, &key);\n    if\
  \ (!state)\n        return SK_PASS;\n\n    __u32 active = state->active;\n    if (active == 0)\n        return SK_PASS;\n\
  \n    /* Safety clamp: sockarray is sized to 128 entries. */\n    if (active > 128)\n        active = 128;\n\n    /* Atomic\
  \ fetch-and-increment of the global RR counter.\n     * This compiles to a BPF_XADD and is safe for concurrent\n     * updates\
  \ to an ARRAY map value from multiple CPUs.\n     */\n    __u32 rr = __sync_fetch_and_add(&state->rr, 1);\n\n    /* Use\
  \ CPU ID as a phase offset so each CPU walks the ring\n     * with a slightly different starting point. This keeps the\n\
  \     * policy verb-agnostic but smooths cross-CPU contention.\n     */\n    __u32 cpu = bpf_get_smp_processor_id();\n\n\
  \    __u32 slot;\n    if (active > 1)\n        slot = (rr + cpu) % active;\n    else\n        slot = 0;\n\n    /* Exactly\
  \ one helper call; extra calls would be ignored. */\n    (void)bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot,\
  \ 0);\n\n    return SK_PASS;\n}\n// EVOLVE-BLOCK-END\n\nchar _license[] SEC(\"license\") = \"GPL\";"
