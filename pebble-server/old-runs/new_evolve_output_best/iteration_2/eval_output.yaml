            go run ./cmd/workload_client \
              -server "$SERVER" \
              -duration "${DURATION}s" \
              -rate "$RATE" \
              -get-frac "$GET_FRAC" \
              -scan-limit "$SCAN_LIMIT" \
              -key-prefix "$KEY_PREFIX" \
              -key-space "$KEY_SPACE" \
              -send-workers "$SEND_WORKERS" \
              -log "$LOG_FILE"
        - path: |-
            cmd/workload_client/main.go
          snippet: "var (\n\t\tserverAddr  = flag.String(\"server\", \"127.0.0.1:9000\", \"UDP server address\")\n\t\tduration\
            \    = flag.Duration(\"duration\", 30*time.Second, \"duration of the workload\")\n\t\ttargetRate  = flag.Float64(\"\
            rate\", 1000, \"target send rate (requests per second)\")\n\t\tgetFrac     = flag.Float64(\"get-frac\", 0.8, \"\
            fraction of GET requests; remainder are SCAN\")\n\t\tscanLimit   = flag.Int(\"scan-limit\", 500, \"number of keys\
