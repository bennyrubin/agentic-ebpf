              join_by() {
                local sep="$1"
                shift || true
                local IFS="$sep"
                echo "$*"
              }
      - question: "In internal/server/handleRequest, exactly how are the per-worker avg_get and avg_scan metrics measured\u2014\
          does the timing window cover only the synthetic busy-wait delay or does it include any time spent between ReadFromUDP\
          \ returning and entering/exiting handleRequest (i.e., does it capture socket queueing or just the emulated DB work)?"
        answer:
          answer: "The avg_get and avg_scan metrics are computed from per-worker counters that only time the emulated DB work\
            \ inside handleRequest. The code maintains workerStats that track getLatency, scanLatency, getCount, and scanCount;\
            \ those are incremented and accumulated around the synthetic work (the busy\u2011wait / emulated DB section).\
            \ Periodically, each worker\u2019s stats object is snapshotted and reset via snapshotAndReset(), and the server\
            \ logging loop computes per\u2011worker averages as:\n\n- workerAvgGet = time.Duration(int64(snap.getLatency)\
            \ / int64(snap.getCount))\n- workerAvgScan = time.Duration(int64(snap.scanLatency) / int64(snap.scanCount))\n\n\
            and then sums them into a total and prints overall averages similarly.\n\nBecause only getLatency and scanLatency\
            \ from workerStats are used, the measurement window does not include time between ReadFromUDP returning and entering\
            \ handleRequest, nor any additional time outside the emulated DB section. It therefore does not capture socket\
            \ queueing delay; it only measures the synthetic get/scan work that handleRequest explicitly times."
          code_snippets:
          - path: |-
              internal/server/server.go
            snippet: |-
              var total workerStatsSnapshot
              for i := range s.stats {
                  snap := s.stats[i].snapshotAndReset()
                  if snap.getCount > 0 || snap.scanCount > 0 {
                      var workerAvgGet time.Duration
                      if snap.getCount > 0 {
                          workerAvgGet = time.Duration(int64(snap.getLatency) / int64(snap.getCount))
                      }
                      var workerAvgScan time.Duration
                      if snap.scanCount > 0 {
                          workerAvgScan = time.Duration(int64(snap.scanLatency) / int64(snap.scanCount))
                      }
                      s.logger.Printf(
                          "[perf] worker=%d gets=%d get_errors=%d avg_get=%s scans=%d scan_errors=%d avg_scan=%s",
                          i,
                          snap.getCount,
                          snap.getErrors,
                          workerAvgGet,
                          snap.scanCount,
                          snap.scanErrors,
                          workerAvgScan,
                      )
                  }
                  total.getCount += snap.getCount
                  total.getErrors += snap.getErrors
                  total.getLatency += snap.getLatency
                  total.scanCount += snap.scanCount
                  total.scanErrors += snap.scanErrors
                  total.scanLatency += snap.scanLatency
              }
              if total.getCount == 0 && total.scanCount == 0 {
                  continue
              }
              var avgGet time.Duration
              if total.getCount > 0 {
                  avgGet = time.Duration(int64(total.getLatency) / int64(total.getCount))
              }
              var avgScan time.Duration
              if total.scanCount > 0 {
                  avgScan = time.Duration(int64(total.scanLatency) / int64(total.scanCount))
              }
      - question: "In cmd/workload_client, how is the -get-frac flag used to choose between GET and SCAN operations\u2014\
