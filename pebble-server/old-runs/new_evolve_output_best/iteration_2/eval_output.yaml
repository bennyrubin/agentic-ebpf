    Summary: "Four runs with the agent eBPF policy on a 6-worker UDP server (GET delay=10\xB5s, SCAN delay=2ms) show: (1)\
      \ the eBPF selector cleanly splits GETs to workers 0\u20133 and SCANs to workers 4\u20135, with very even round\u2011\
      robin balancing inside each group; (2) per\u2011worker avg_get \u224810\u201311\xB5s and avg_scan \u22482.0\u20132.1ms\
      \ remain almost constant across rates; (3) aggregate server throughput plateaus at \u2248135\u2013137k req/s (GET+SCAN)\
      \ regardless of higher offered load; (4) the client sees essentially no loss (sent == recv in every run) but outstanding\
      \ requests grow sharply at 160k req/s, producing a p99 latency jump from ~21ms (140k) to ~1s (160k)."
    hypothesis:
      text: "The system\u2019s throughput is fundamentally limited by the CPU budget allocated to the server (likely around\
        \ three cores), most of which is consumed by the synthetic busy\u2011wait delays for GET and SCAN operations. The\
        \ agent eBPF program correctly classifies and segregates SCANs onto workers 4\u20135 and GETs onto 0\u20133, and distributes\
        \ load evenly within each group, as shown by the per\u2011worker perf lines. With the given GET/SCAN fractions, the\
        \ total busy\u2011wait time implied by the observed throughput at 160k offered load is ~3 core\u2011seconds per wall\u2011\
        second, which matches a 3\u2011core server budget and explains why the server stably processes only ~135k req/s. At\
        \ 140k, total CPU demand is just below this limit so queuing is modest (p99 \u2248 21ms); at 160k, offered load exceeds\
        \ capacity by ~25k req/s, so a backlog of ~140k requests builds up at the client/server queues and drains only after\
        \ sending stops, yielding ~1s p99 latency. Thus, high latencies are caused by CPU\u2011bounded service capacity in\
        \ the userspace workers (including synthetic delays), not by misclassification or imbalance in the eBPF routing itself."
