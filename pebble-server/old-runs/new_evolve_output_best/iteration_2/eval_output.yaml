        answer:
          answer: "When running locally with no custom CPUSET overrides (no SERVER_CORES/CLIENT_CORES/CPUSET_POOL flags),\
            \ the script first defaults SERVER_CORES to the --threads value and CLIENT_CORES to the --send-workers value:\n\
            - THREADS defaults to 6 \u2192 SERVER_CORES=6\n- SEND_WORKERS defaults to 6 \u2192 CLIENT_CORES=6\n\n`resolve_cpu_pool`\
            \ (called before this block) fills AVAILABLE_CPUS with the full local CPU list (because CPUSET_POOL is empty).\
            \ The script then ensures that `SERVER_CORES + CLIENT_CORES` does not exceed the number of available CPUs, and\
            \ splits AVAILABLE_CPUS into two contiguous segments:\n- `SERVER_CPUSET_LIST = AVAILABLE_CPUS[0:SERVER_CORES]`\
            \ \u2192 first 6 CPUs\n- `CLIENT_CPUSET_LIST = AVAILABLE_CPUS[SERVER_CORES:SERVER_CORES+CLIENT_CORES]` \u2192\
            \ next 6 CPUs\n\n`join_by ,` turns SERVER_CPUSET_LIST into a comma-separated list. Therefore, for local experiments\
            \ with defaults and no overrides, the pebble_server process is pinned to 6 CPU cores: the first 6 CPUs in the\
            \ system\u2019s available CPU list (e.g., `0,1,2,3,4,5`)."
          code_snippets:
          - path: |-
              run.sh
            snippet: |-
              THREADS=${THREADS:-6}
              SEND_WORKERS=${SEND_WORKERS:-6}
              ...
              if [[ -z "$SERVER_CORES" ]]; then
                ensure_positive_int "--threads" "$THREADS"
                SERVER_CORES="$THREADS"
                DEFAULTED_SERVER=1
              fi

              if [[ -z "$CLIENT_CORES" ]]; then
                ensure_positive_int "--send-workers" "$SEND_WORKERS"
                CLIENT_CORES="$SEND_WORKERS"
                DEFAULTED_CLIENT=1
              fi
          - path: |-
              run.sh
            snippet: |-
              SERVER_CORES=$((SERVER_CORES))
              CLIENT_CORES=$((CLIENT_CORES))

              total_requested=$((SERVER_CORES + CLIENT_CORES))
              if (( total_requested > ${#AVAILABLE_CPUS[@]} )); then
                echo "Insufficient CPUs in selected pool: requested ${total_requested}, available ${#AVAILABLE_CPUS[@]} (${AVAILABLE_CPUS[*]})." >&2
                exit 1
              fi

              SERVER_CPUSET_LIST=("${AVAILABLE_CPUS[@]:0:SERVER_CORES}")
              CLIENT_CPUSET_LIST=("${AVAILABLE_CPUS[@]:SERVER_CORES:CLIENT_CORES}")
              SERVER_CPUSET=$(join_by , "${SERVER_CPUSET_LIST[@]}")
              CLIENT_CPUSET=$(join_by , "${CLIENT_CPUSET_LIST[@]}")
