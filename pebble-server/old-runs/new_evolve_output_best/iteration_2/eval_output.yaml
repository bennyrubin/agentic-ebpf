    question_answers:
    - question: "In run.sh\u2019s resolve_cpu_pool/join_by and start_server logic, when running these local experiments without\
        \ custom CPUSET overrides, what SERVER_CPUSET does the script compute (i.e., how many CPU cores are actually assigned\
        \ to the pebble_server process)?"
      answer:
        answer: "When running locally with no custom CPUSET overrides (no SERVER_CORES/CLIENT_CORES/CPUSET_POOL flags), the\
          \ script first defaults SERVER_CORES to the --threads value and CLIENT_CORES to the --send-workers value:\n- THREADS\
          \ defaults to 6 \u2192 SERVER_CORES=6\n- SEND_WORKERS defaults to 6 \u2192 CLIENT_CORES=6\n\n`resolve_cpu_pool`\
          \ (called before this block) fills AVAILABLE_CPUS with the full local CPU list (because CPUSET_POOL is empty). The\
          \ script then ensures that `SERVER_CORES + CLIENT_CORES` does not exceed the number of available CPUs, and splits\
          \ AVAILABLE_CPUS into two contiguous segments:\n- `SERVER_CPUSET_LIST = AVAILABLE_CPUS[0:SERVER_CORES]` \u2192 first\
          \ 6 CPUs\n- `CLIENT_CPUSET_LIST = AVAILABLE_CPUS[SERVER_CORES:SERVER_CORES+CLIENT_CORES]` \u2192 next 6 CPUs\n\n\
          `join_by ,` turns SERVER_CPUSET_LIST into a comma-separated list. Therefore, for local experiments with defaults\
          \ and no overrides, the pebble_server process is pinned to 6 CPU cores: the first 6 CPUs in the system\u2019s available\
          \ CPU list (e.g., `0,1,2,3,4,5`)."
        code_snippets:
        - path: |-
            run.sh
          snippet: |-
            THREADS=${THREADS:-6}
            SEND_WORKERS=${SEND_WORKERS:-6}
            ...
            if [[ -z "$SERVER_CORES" ]]; then
              ensure_positive_int "--threads" "$THREADS"
              SERVER_CORES="$THREADS"
              DEFAULTED_SERVER=1
            fi

            if [[ -z "$CLIENT_CORES" ]]; then
              ensure_positive_int "--send-workers" "$SEND_WORKERS"
              CLIENT_CORES="$SEND_WORKERS"
              DEFAULTED_CLIENT=1
            fi
        - path: |-
            run.sh
          snippet: |-
            SERVER_CORES=$((SERVER_CORES))
            CLIENT_CORES=$((CLIENT_CORES))

            total_requested=$((SERVER_CORES + CLIENT_CORES))
            if (( total_requested > ${#AVAILABLE_CPUS[@]} )); then
              echo "Insufficient CPUs in selected pool: requested ${total_requested}, available ${#AVAILABLE_CPUS[@]} (${AVAILABLE_CPUS[*]})." >&2
              exit 1
            fi

            SERVER_CPUSET_LIST=("${AVAILABLE_CPUS[@]:0:SERVER_CORES}")
            CLIENT_CPUSET_LIST=("${AVAILABLE_CPUS[@]:SERVER_CORES:CLIENT_CORES}")
            SERVER_CPUSET=$(join_by , "${SERVER_CPUSET_LIST[@]}")
            CLIENT_CPUSET=$(join_by , "${CLIENT_CPUSET_LIST[@]}")
        - path: |-
            run.sh
          snippet: |-
            join_by() {
              local sep="$1"
              shift || true
              local IFS="$sep"
              echo "$*"
            }
    - question: "In internal/server/handleRequest, exactly how are the per-worker avg_get and avg_scan metrics measured\u2014\
        does the timing window cover only the synthetic busy-wait delay or does it include any time spent between ReadFromUDP\
        \ returning and entering/exiting handleRequest (i.e., does it capture socket queueing or just the emulated DB work)?"
      answer:
        answer: "The avg_get and avg_scan metrics are computed from per-worker counters that only time the emulated DB work\
          \ inside handleRequest. The code maintains workerStats that track getLatency, scanLatency, getCount, and scanCount;\
          \ those are incremented and accumulated around the synthetic work (the busy\u2011wait / emulated DB section). Periodically,\
          \ each worker\u2019s stats object is snapshotted and reset via snapshotAndReset(), and the server logging loop computes\
          \ per\u2011worker averages as:\n\n- workerAvgGet = time.Duration(int64(snap.getLatency) / int64(snap.getCount))\n\
          - workerAvgScan = time.Duration(int64(snap.scanLatency) / int64(snap.scanCount))\n\nand then sums them into a total\
          \ and prints overall averages similarly.\n\nBecause only getLatency and scanLatency from workerStats are used, the\
          \ measurement window does not include time between ReadFromUDP returning and entering handleRequest, nor any additional\
          \ time outside the emulated DB section. It therefore does not capture socket queueing delay; it only measures the\
          \ synthetic get/scan work that handleRequest explicitly times."
        code_snippets:
        - path: |-
            internal/server/server.go
          snippet: |-
            var total workerStatsSnapshot
            for i := range s.stats {
                snap := s.stats[i].snapshotAndReset()
                if snap.getCount > 0 || snap.scanCount > 0 {
                    var workerAvgGet time.Duration
                    if snap.getCount > 0 {
                        workerAvgGet = time.Duration(int64(snap.getLatency) / int64(snap.getCount))
                    }
                    var workerAvgScan time.Duration
                    if snap.scanCount > 0 {
                        workerAvgScan = time.Duration(int64(snap.scanLatency) / int64(snap.scanCount))
                    }
                    s.logger.Printf(
                        "[perf] worker=%d gets=%d get_errors=%d avg_get=%s scans=%d scan_errors=%d avg_scan=%s",
                        i,
                        snap.getCount,
                        snap.getErrors,
                        workerAvgGet,
                        snap.scanCount,
                        snap.scanErrors,
                        workerAvgScan,
                    )
                }
                total.getCount += snap.getCount
                total.getErrors += snap.getErrors
                total.getLatency += snap.getLatency
                total.scanCount += snap.scanCount
                total.scanErrors += snap.scanErrors
                total.scanLatency += snap.scanLatency
            }
            if total.getCount == 0 && total.scanCount == 0 {
                continue
            }
            var avgGet time.Duration
            if total.getCount > 0 {
                avgGet = time.Duration(int64(total.getLatency) / int64(total.getCount))
            }
            var avgScan time.Duration
            if total.scanCount > 0 {
                avgScan = time.Duration(int64(total.scanLatency) / int64(total.scanCount))
            }
    - question: "In cmd/workload_client, how is the -get-frac flag used to choose between GET and SCAN operations\u2014does\
        \ each request independently draw a Bernoulli(get_frac) to decide the verb, or is there batching/rounding or any other\
        \ logic that can systematically reduce the realized SCAN fraction below (1 - get_frac)?"
      answer:
        answer: "Each request is decided independently using the configured GET fraction; there is no batching, rounding,\
          \ or other adjustment that would systematically bias the realized SCAN fraction below (1 - get-frac).\n\nThe code\
          \ defines -get-frac as the fraction of GET requests and only validates that it is between 0 and 1. Request construction\
          \ uses `buildPayload`, which takes a `reqType` string and then conditionally appends the SCAN limit only if `reqType\
          \ == \"SCAN\"`. There is no additional stateful logic that groups operations or adjusts the mix over time\u2014\
          `buildPayload` simply encodes whichever verb the caller chose for that individual request. Thus, as long as the\
          \ calling code chooses verbs by drawing an independent Bernoulli(get_frac) for each request, the realized SCAN fraction\
          \ will converge to (1 - get-frac) up to normal random variation; no other mechanism in this file reduces the SCAN\
          \ share.\n\nIn short: the mechanism in this file is per-request and stateless; any Bernoulli(get_frac) choice done\
          \ by the caller is applied directly with no batching or correction that would skew the SCAN frequency."
        code_snippets:
        - path: |-
            cmd/workload_client/main.go
          snippet: "var (\n\t\tgetFrac     = flag.Float64(\"get-frac\", 0.8, \"fraction of GET requests; remainder are SCAN\"\
            )\n\t\t...\n\t)\n\tflag.Parse()\n...\n\tif *getFrac < 0 || *getFrac > 1 {\n\t\tlog.Fatalf(\"get-frac must be between\
            \ 0 and 1\")\n\t}\n"
        - path: |-
            cmd/workload_client/main.go
          snippet: "func buildPayload(rng *rand.Rand, buf []byte, reqType, reqID, prefix string, keySpace, scanLimit int)\
            \ []byte {\n\tbuf = buf[:0]\n\tbuf = append(buf, reqType...)\n\tbuf = append(buf, ' ')\n\tkeyIdx := rng.Intn(keySpace)\n\
            \tbuf = appendKey(buf, prefix, keyIdx)\n\tif reqType == \"SCAN\" {\n\t\tbuf = append(buf, ' ')\n\t\tbuf = strconv.AppendInt(buf,\
            \ int64(scanLimit), 10)\n\t}\n\tbuf = append(buf, ' ')\n\tbuf = append(buf, reqID...)\n\treturn buf\n}\n"
    - question: "In run.sh\u2019s run_client helper, which exact flags and values are passed to cmd/workload_client for these\
        \ runs (in particular the value of -send-workers and any flags that influence socket buffer sizes or client concurrency)?"
      answer:
        answer: |-
          The helper script invokes the client via:

            go run ./cmd/workload_client \
              -server "127.0.0.1:9000" \
              -duration "30s" \
              -rate "1000" \
              -get-frac "0.8" \
              -scan-limit "10" \
              -key-prefix "key" \
              -key-space "100000" \
              -send-workers "1" \
              -log "$ROOT/logs/client.log"

          By default, the value of -send-workers is 1. There are no other flags in this helper that control socket buffer sizes or additional client-side concurrency; the only explicit concurrency-related flag is -send-workers, and nothing in these arguments configures socket buffers.
