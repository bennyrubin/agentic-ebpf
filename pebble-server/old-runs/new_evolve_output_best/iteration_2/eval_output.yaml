    - question: |-
        In internal/server/handleRequest, how is the simulated latency implemented for GET and SCAN requests (which helper function(s) are used to busy-wait or sleep, and are those helpers invoked exactly once per request for each verb)?
      answer:
        answer: |-
          For both GET and SCAN requests, the latency is simulated directly inside handleRequest using an inline busy-wait loop driven by time.Now(), without any separate helper functions.

          GET:
          - A start time is captured with `start := time.Now()`.
          - A deadline is computed with `deadline := start.Add(s.cfg.GetDelay)`.
          - The code then busy-waits in a tight loop: `for time.Now().Before(deadline) {}`.
          - After the loop, the elapsed time is measured with `elapsed := time.Since(start)` and recorded via `stats.recordGet(elapsed, false)` if stats are available.
          - This busy-wait section is executed exactly once per GET request.

          SCAN:
          - A start time is captured with `start := time.Now()`.
          - A deadline is computed with `deadline := start.Add(s.cfg.ScanDelay)`.
          - The code then busy-waits in a tight loop: `for time.Now().Before(deadline) {}`.
          - After the loop, the elapsed time is measured with `elapsed := time.Since(start)` and recorded via `stats.recordScan(elapsed, false)` if stats are available.
          - This busy-wait section is executed exactly once per SCAN request (only after argument validation and limit clamping succeed).

          No sleep-based helper or generic latency helper function is used; each verb implements its own single busy-wait loop inline in handleRequest.
        code_snippets:
        - path: |-
            internal/server/server.go
          snippet: "case \"GET\":\n\tvar reqID string\n\tif len(args) == 2 {\n\t\treqID = args[1]\n\t\targs = args[:1]\n\t\
            }\n\t// Busy wait for accurate timing\n\tstart := time.Now()\n\tdeadline := start.Add(s.cfg.GetDelay)\n\tfor time.Now().Before(deadline)\
            \ {\n\t}\n\telapsed := time.Since(start)\n\tif stats != nil {\n\t\tstats.recordGet(elapsed, false)\n\t}\n\treturn\
            \ formatResponse(\"VALUE\", reqID, []byte(args[0]))"
        - path: |-
            internal/server/server.go
          snippet: "case \"SCAN\":\n\tvar reqID string\n\tif len(args) == 3 {\n\t\treqID = args[2]\n\t\targs = args[:2]\n\t\
            }\n\tlimit, err := strconv.Atoi(args[1])\n\tif err != nil || limit <= 0 {\n\t\tif stats != nil {\n\t\t\tstats.recordScan(0,\
            \ true)\n\t\t}\n\t\treturn formatResponse(\"ERR\", reqID, []byte(\"invalid scan limit\"))\n\t}\n\tif limit > s.cfg.MaxScanKeys\
            \ {\n\t\tlimit = s.cfg.MaxScanKeys\n\t}\n\t// Busy wait for accurate timing\n\tstart := time.Now()\n\tdeadline\
            \ := start.Add(s.cfg.ScanDelay)\n\tfor time.Now().Before(deadline) {\n\t}\n\telapsed := time.Since(start)\n\t\
            if stats != nil {\n\t\tstats.recordScan(elapsed, false)\n\t}\n\treturn formatResponse(\"SCAN\", reqID, []byte(\"\
            EMPTY\"))"
