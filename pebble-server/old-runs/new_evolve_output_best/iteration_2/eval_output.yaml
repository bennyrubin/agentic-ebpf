            \ defines -get-frac as the fraction of GET requests and only validates that it is between 0 and 1. Request construction\
            \ uses `buildPayload`, which takes a `reqType` string and then conditionally appends the SCAN limit only if `reqType\
            \ == \"SCAN\"`. There is no additional stateful logic that groups operations or adjusts the mix over time\u2014\
            `buildPayload` simply encodes whichever verb the caller chose for that individual request. Thus, as long as the\
            \ calling code chooses verbs by drawing an independent Bernoulli(get_frac) for each request, the realized SCAN\
            \ fraction will converge to (1 - get-frac) up to normal random variation; no other mechanism in this file reduces\
            \ the SCAN share.\n\nIn short: the mechanism in this file is per-request and stateless; any Bernoulli(get_frac)\
            \ choice done by the caller is applied directly with no batching or correction that would skew the SCAN frequency."
