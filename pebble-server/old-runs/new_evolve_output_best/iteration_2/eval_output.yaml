            \tlogPath     = flag.String(\"log\", \"logs/client.log\", \"path to log file\")\n\t\tsendWorkers = flag.Int(\"\
            send-workers\", 1, \"number of concurrent send workers\")\n\t)\n\tflag.Parse()\n\n\tworkers := *sendWorkers\n\t\
            if workers <= 0 {\n\t\tworkers = 1\n\t}"
    - question: "In cmd/pebble_server and internal/server.New/Run, is runtime.GOMAXPROCS ever set explicitly based on SERVER_CPUSET,\
