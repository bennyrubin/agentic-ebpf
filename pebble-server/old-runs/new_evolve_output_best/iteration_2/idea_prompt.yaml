  eval_summary: "A 6-worker UDP server, pinned to 6 CPU cores, uses the agent eBPF sk_reuseport selector to split traffic\
    \ by verb: workers 0\u20133 handle only GETs while workers 4\u20135 handle only SCANs. The selector\u2019s classify_scan\
    \ logic correctly identifies SCAN payloads and, via separate round\u2011robin counters, evenly balances GET load across\
    \ the 4 GET workers and SCAN load across the 2 SCAN workers. Server perf logs at all rates show this clean split and near-perfect\
    \ balancing; no worker sees both GETs and SCANs, and total per\u2011second GET+SCAN counts across workers match the client\u2019\
    s sent/recv totals, confirming no packet loss or misrouting. Inside each worker goroutine, ReadFromUDP \u2192 handleRequest\
    \ \u2192 WriteToUDP are executed synchronously in a tight loop, and handleRequest simulates DB work with a single busy\u2011\
    wait per request (10\xB5s for GET, 2ms for SCAN). The per\u2011worker avg_get/avg_scan metrics time only this busy\u2011\
    wait, not queueing or I/O, so they stay near 10\xB5s and 2ms even as load increases. As offered load rises from 80k to\
    \ 140k req/s, aggregate completions grow linearly up to ~135\u2013140k req/s; per\u2011worker counts at 140k show each\
    \ GET worker completing ~34\u201335k GETs/s and each SCAN worker ~340\u2013370 scans/s. This implies an effective CPU\
    \ cost of roughly 29\xB5s core time per GET and ~2.5ms per SCAN (busy\u2011wait plus parsing/I/O/scheduling overhead).\
    \ With 4 dedicated GET workers and 2 SCAN workers, this yields a mixed-workload capacity of about 135\u2013140k req/s,\
    \ which matches the observed plateau. At 160k offered load, client logs show outstanding requests growing to ~140k while\
    \ server perf logs still report ~135\u2013140k completions per second and stable avg_get/avg_scan. The open\u2011loop\
    \ client continues sending at the target rate, so excess requests accumulate in kernel and client queues rather than being\
    \ dropped. After sending stops, the server continues draining the backlog until sent==recv, but many requests have waited\
    \ on the queues for up to ~1s, which is reflected in the 160k run\u2019s ~1s p99 latency. Thus, the system behavior across\
    \ all runs is consistent with a CPU\u2011saturated userspace server with well-functioning eBPF steering; the sharp latency\
    \ jump at 160k arises from queueing once the mixed GET/SCAN load exceeds the ~135\u2013140k req/s service capacity, not\
    \ from any misclassification or imbalance in the agent selector."
