idea_agent_prompt: "You are an expert in high-performance Linux UDP servers that load-balance traffic with SO_REUSEPORT and\
  \ a custom sk_reuseport eBPF program. The traffic comes in as short GET requests and longer SCAN requests with 99.5% of\
  \ the workload being GETs. Study the supplied artifacts (current eBPF implementation, run metrics, short codebase summary,\
  \ performance summary, and performance explanation hypothesis.) to understand how the system actually behaved and why. From\
  \ that understanding, produce a draft design document for a next-generation eBPF selector that improves on the observed\
  \ problems. Additionally, be creative, trying new, potentially drastic different approaches, when you believe it will improve\
  \ performance. Avoid speculation, note uncertainties, and assume reuseport slots, worker sockets, and database wiring are\
  \ correctly configured in the application.\n\nGuidelines:\n- Be precise, concise, and evidence-backed. Mark unknowns as\
  \ uncertain.\n- Always use the simplest possible solution, unless necessary to add more complexity to achieve the goal.\
  \ For example, don't introduce state or a map unless it is the only way to achieve the goal. Don't add complicated math\
  \ or algorithms or branching unless necessary.\n- For now, do not focus on fallbacks or error handling, nor logging to ensure\
  \ correctness.\n- Set \"status\": \"finish\" once you no longer need additional codebase information. Return \"continue\"\
  \ only when you truly need RAG answers to refine the design.\n- Questions must target codebase details you cannot infer\
  \ yet (e.g., \"In workload/client.go, how many sender threads are spawned?\"). The questions should be directly related\
  \ to the codebase and not abstract. Never repeat answered questions or ask about artifacts already provided. For example,\
  \ do not ask about the eBPF programs or logs that you already have access to and the RAG codebase knows nothing about.\n\
  - For now, do not include code that requires any configuration in userspace. The eBPF program should be self-contained.\
  \ You may include constant hyperparameters in the code, that you must tune yourself.\n- Do not worry about the selector\
  \ logic. You only need to use AgentUDPSelector and can change state in the pebble_agent_state map, but may not create a\
  \ new map.\n\nOutput strict JSON:\n{\n  \"status\": \"continue|finish\",\n  \"design_doc\": {\n    \"goals\": [\"clear goals\
  \ tied to observed issues\"],\n    \"evidence\": [\"key supporting observations from the hypothesis and performance summary\"\
  ],\n    \"architecture\": [\"specific approach that should be taken by the eBPF program. Do not include code, only a text,\
  \ design level idea/thought. Keep it to a few lines.\"],\n    \"risks\": [\"open questions or assumptions to verify from\
  \ the codebase\"]\n  },\n  \"questions\": [\"<=5 precise, code-focused RAG queries needed to finalize the design\"]\n}\n\
  \nRun context:\nEvaluation summary: A 6-worker UDP server, pinned to 6 CPU cores, uses the agent eBPF sk_reuseport selector\
  \ to split traffic by verb: workers 0\u20133 handle only GETs while workers 4\u20135 handle only SCANs. The selector\u2019\
  s classify_scan logic correctly identifies SCAN payloads and, via separate round\u2011robin counters, evenly balances GET\
  \ load across the 4 GET workers and SCAN load across the 2 SCAN workers. Server perf logs at all rates show this clean split\
  \ and near-perfect balancing; no worker sees both GETs and SCANs, and total per\u2011second GET+SCAN counts across workers\
  \ match the client\u2019s sent/recv totals, confirming no packet loss or misrouting. Inside each worker goroutine, ReadFromUDP\
  \ \u2192 handleRequest \u2192 WriteToUDP are executed synchronously in a tight loop, and handleRequest simulates DB work\
  \ with a single busy\u2011wait per request (10\xB5s for GET, 2ms for SCAN). The per\u2011worker avg_get/avg_scan metrics\
  \ time only this busy\u2011wait, not queueing or I/O, so they stay near 10\xB5s and 2ms even as load increases. As offered\
  \ load rises from 80k to 140k req/s, aggregate completions grow linearly up to ~135\u2013140k req/s; per\u2011worker counts\
  \ at 140k show each GET worker completing ~34\u201335k GETs/s and each SCAN worker ~340\u2013370 scans/s. This implies an\
  \ effective CPU cost of roughly 29\xB5s core time per GET and ~2.5ms per SCAN (busy\u2011wait plus parsing/I/O/scheduling\
  \ overhead). With 4 dedicated GET workers and 2 SCAN workers, this yields a mixed-workload capacity of about 135\u2013140k\
  \ req/s, which matches the observed plateau. At 160k offered load, client logs show outstanding requests growing to ~140k\
  \ while server perf logs still report ~135\u2013140k completions per second and stable avg_get/avg_scan. The open\u2011\
  loop client continues sending at the target rate, so excess requests accumulate in kernel and client queues rather than\
  \ being dropped. After sending stops, the server continues draining the backlog until sent==recv, but many requests have\
  \ waited on the queues for up to ~1s, which is reflected in the 160k run\u2019s ~1s p99 latency. Thus, the system behavior\
  \ across all runs is consistent with a CPU\u2011saturated userspace server with well-functioning eBPF steering; the sharp\
  \ latency jump at 160k arises from queueing once the mixed GET/SCAN load exceeds the ~135\u2013140k req/s service capacity,\
  \ not from any misclassification or imbalance in the agent selector.\nEvaluation hypothesis: The agent eBPF selector is\
  \ working correctly and is not the bottleneck; the observed throughput plateau and latency blow-up are caused by CPU-saturated\
  \ userspace workers whose per-request cost (busy-waited synthetic delays plus parsing/I/O/scheduling overhead) yields a\
  \ mixed-workload capacity of about 135\u2013140k req/s, so at 160k offered load requests queue in kernel/client buffers\
  \ without being dropped, inflating end-to-end p99 latency to ~1s while server-side avg_get/avg_scan metrics remain near\
  \ the configured delays because they measure only the busy-wait section, not the growing queueing time.\nBest program metrics:\
  \ policy=agent, rates=[80000, 100000, 140000, 160000], load_p99_curve=[(80000.0, 2.04), (100000.0, 2.406), (140000.0, 21.259),\
